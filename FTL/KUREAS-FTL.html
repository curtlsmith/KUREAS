// KUREAS-FTL Fault Tree Logic Solver

// (De Morgan push-down for NOT OR / NOT AND), N-of-M voting, transfer gates,
// SAPHIRE logic flags (T/F/I), plus MCUB / exact (BDD) / BDD-MCUB hybrid

//
// Cut-set literal notation: 'NAME' = event fails, '/NAME' = complement.
// A gate result is an array of cut sets; [] = FALSE (cannot fail),
// [[]] = TRUE (always failed).

function FTSolverFactory(){

const litNeg=l=>l.charCodeAt(0)===47?l.slice(1):'/'+l;

// ── Event probability lookup ──────────────────────────────────────────────
// Returns the mean probability of a literal, or null when unknown.
// Flag events (FailureModel '5') resolve to exactly 1 (T) or 0 (F).
// Logic flag of an event: 'T' | 'F' | 'I' | null. Honours FailureModel 5 / LogicFlag (KUREAS)
// and a raw SAPHIRE FdT of T/F/I on eventInfo that was never post-processed.
function flagOf(info){if(!info)return null;if(info.FailureModel==='5')return String(info.LogicFlag||'T').toUpperCase();if(!info.FailureModel){const f=String(info.FdT||'').toUpperCase();if(f==='T'||f==='F'||f==='I')return f;}return null;}

// ── Minimization (absorption) ─────────────────────────────────────────────
// Input: array of cut sets (arrays of literals). Output: deduplicated, sorted,
// minimal cut sets. Uses the KUREAS-SYS bucket-by-pivot approach.
function minimize(sets){
  if(sets.length<=1)return sets.map(s=>s.slice().sort());
  const uniq=[];const seen=new Set();const freq=new Map();
  for(const cs of sets){const s=cs.slice().sort();const k=s.join(SEP);if(!seen.has(k)){seen.add(k);uniq.push(s);for(const l of s)freq.set(l,(freq.get(l)||0)+1);}}

  // candidate only has to scan small buckets: a kept K can subsume C only if K's pivot is in C.
  const kept=[];const buckets=new Map();

// ── Boolean combination with truncation ───────────────────────────────────
const posOrder=cs=>{let n=0;for(let i=0;i<cs.length;i++)if(cs[i].charCodeAt(0)!==47)n++;return n;};

function checkLimit(n,ctx){if(n>30000000)throw new Error(`Cut set explosion: a gate would produce more than ${(30000000).toLocaleString()} intermediate cut sets that can survive truncation. Raise the probability truncation or set a maximum cut set order in Settings.`);}

  // Oversized product: raise the working threshold to the maxCutSets-th largest pair bound

  // |A|·|B| array is allocated.

  // with truncation, guard the cut sets actually materialized (checked after each row below).

  for(let i=0;i<A.length;i++){const a=A[i];const ba=bA[i];

    for(let oj=0;oj<order.length;oj++){const j=order[oj];const bb=bB[j];

      const b=B[j];const bp=bP?bP[j]:null;

// N-of-M over child result sets via DP: f(i,k) = OR( AND(c_i, f(i+1,k-1)), f(i+1,k) )

// ── Tree walk ─────────────────────────────────────────────────────────────
function findTree(project,name){return(project.faultTrees||[]).find(t=>t.treeName===name)||null;}
function findGateAnywhere(project,name){for(const t of project.faultTrees||[]){const walk=n=>{if(!n||n.type==='EVENT'||n.temp)return null;if(n.name===name)return{node:n,tree:t};for(const c of n.children||[]){const r=walk(c);if(r)return r;}return null;};const r=walk(t.rootNode);if(r)return r;}return null;}

function solveNode(node,negate,tree,ctx,stack){

  if(node.temp)return IGNORE;   // temporary placeholder (not yet edited) — ignored
  if(node.type==='EVENT'){
    const comp=node.name.startsWith('/');const base=comp?node.name.slice(1):node.name;
    const info=ctx.eventInfo[base];const f=flagOf(info);

    const lit=(comp!==negate)?'/'+base:base;return[[lit]];

    if(t&&t.rootNode){tnode=t.rootNode;ttree=t;}
    else{const g=findGateAnywhere(ctx.project,target);if(g){tnode=g.node;ttree=g.tree;}}
    if(!tnode){ctx.stats.warnings.push(`Transfer gate "${node.name}" \u2192 "${target}" is unresolved; treated as FALSE (no cut sets).`);return[];}
    if(tnode===node){return[];}

  const key=(tree?tree.treeName:'')+SEP+node.name+SEP+(negate?'1':'0');
  if(ctx.memo.has(key))return ctx.memo.get(key);
  if(stack.has(key))throw new Error(`Circular logic detected at gate "${node.name}" in fault tree "${tree?tree.treeName:'?'}".`);

  else if(type==='OR'&&negate)type='AND';

                const v = e.getAttributeNS(OOXML_NS.w, 'val');
                if (remap[v]) e.setAttributeNS(OOXML_NS.w, 'w:val', remap[v]);
            })));
        }
        // Makes every style ID the report uses resolvable in the template's styles.xml: matched by ID,
        // then by style name (templates with renamed/localized IDs), else a definition is copied from the
        // first source that has one (fallbacks, then docx.js defaults) along with its basedOn/next/link chain.
        // Returns { reportStyleId: templateStyleId } for IDs that must be rewritten in the report body.
        function tplReconcileStyles(targetDoc, sourceDocs, usedIds) {
            const index = d => { const m = {}; tplEls(d, 'style').forEach(s => { m[s.getAttributeNS(OOXML_NS.w, 'styleId')] = s; }); return m; };
            const nameOf = s => { const n = tplEls(s, 'name')[0]; return n ? (n.getAttributeNS(OOXML_NS.w, 'val') || '').toLowerCase() : ''; };
            const target = index(targetDoc);
            const targetByName = {};
            Object.keys(target).forEach(id => { const nm = nameOf(target[id]); if (nm && !(nm in targetByName)) targetByName[nm] = id; });
            const sources = sourceDocs.filter(Boolean).map(index);
            const root = tplEls(targetDoc, 'styles')[0];
            const remap = {}, copied = [];
            const ensure = (id) => {
                if (!id || target[id] || remap[id]) return;
                const src = sources.map(s => s[id]).find(Boolean);
                if (!src) return;
                const nm = nameOf(src);
                if (nm && targetByName[nm]) { remap[id] = targetByName[nm]; return; }
                const copy = targetDoc.importNode(src, true);
                root.appendChild(copy);
                target[id] = copy;
                copied.push(copy);
                ['basedOn', 'next', 'link'].forEach(tag => tplEls(copy, tag).forEach(e => ensure(e.getAttributeNS(OOXML_NS.w, 'val'))));
            };
            usedIds.forEach(ensure);
            copied.forEach(copy => ['basedOn', 'next', 'link'].forEach(tag => tplEls(copy, tag).forEach(e => {
                const v = e.getAttributeNS(OOXML_NS.w, 'val');
                if (remap[v]) e.setAttributeNS(OOXML_NS.w, 'w:val', remap[v]);
            })));
            return remap;
        }

        /* ---- text placeholders (tokens may be split across runs; run formatting is kept) ---- */
        function tplReplaceTokens(xmlDoc, values) {
            let changed = false;
            tplEls(xmlDoc, 'p').forEach(p => {
                const ts = tplParagraphTexts(p);
                if (!ts.length || tplParagraphText(p).indexOf('{{') < 0) return;
                Object.keys(values).forEach(token => {
                    const value = String(values[token]);
                    for (let guard = 0; guard < 50; guard++) {
                        const texts = ts.map(t => t.textContent);
                        const start = texts.join('').indexOf(token);
                        if (start < 0) break;
                        const end = start + token.length;
                        let pos = 0;
                        ts.forEach((t, i) => {
                            const s = pos, e = pos + texts[i].length; pos = e;
                            if (e <= start || s >= end) return;
                            const a = Math.max(start, s) - s, b = Math.min(end, e) - s;
                            t.textContent = texts[i].slice(0, a) + (start >= s && start < e ? value : '') + texts[i].slice(b);
                            t.setAttributeNS(OOXML_NS.xml, 'xml:space', 'preserve');
                        });
                        changed = true;
                        if (value.indexOf(token) >= 0) break;
                    }
                });
            });
            return changed;
        }

        // Adds <w:updateFields w:val="true"/> (so Word refreshes the TOC on open) in schema order.
        function tplEnsureUpdateFields(settingsDoc) {
            const root = settingsDoc.documentElement;
            if (tplEls(settingsDoc, 'updateFields').length) return;
            const after = ['hdrShapeDefaults', 'footnotePr', 'endnotePr', 'compat', 'docVars', 'rsids', 'mathPr', 'attachedSchema', 'themeFontLang', 'clrSchemeMapping',
                           'doNotIncludeSubdocsInStats', 'doNotAutoCompressPictures', 'forceUpgrade', 'captions', 'readModeInkLockDown', 'smartTagType', 'schemaLibrary',
                           'shapeDefaults', 'doNotEmbedSmartTags', 'decimalSymbol', 'listSeparator'];
            const before = tplChildEls(root).find(n => after.indexOf(n.localName) >= 0) || null;
            const el = settingsDoc.createElementNS(OOXML_NS.w, 'w:updateFields');
            el.setAttributeNS(OOXML_NS.w, 'w:val', 'true');
            root.insertBefore(el, before);
        }

        // Gives every bookmark in `roots` a unique w:id (document order, starting after `startAfter`), pairing each
        // bookmarkEnd with the most recent open bookmarkStart of the same original id. docx.js 8.5 writes id="1" for
        // every Bookmark, which breaks REF cross-references.
        function tplRenumberBookmarks(roots, startAfter) {
            let next = startAfter || 0;
            const open = {};
            roots.forEach(root => [root].concat(Array.from(root.getElementsByTagName('*'))).forEach(e => {
                if (e.namespaceURI !== OOXML_NS.w || (e.localName !== 'bookmarkStart' && e.localName !== 'bookmarkEnd')) return;
                const old = e.getAttributeNS(OOXML_NS.w, 'id');
                if (e.localName === 'bookmarkStart') {
                    const id = String(++next);
                    (open[old] = open[old] || []).push(id);
                    e.setAttributeNS(OOXML_NS.w, 'w:id', id);
                } else if (open[old] && open[old].length) {
                    e.setAttributeNS(OOXML_NS.w, 'w:id', open[old].pop());
                }
            }));
            return next;
        }

        // No-template output: fix docx.js id quirks (duplicate drawing ids and bookmark ids).
        async function finalizeReportDocx(reportBlob) {
            const out = await JSZip.loadAsync(reportBlob);
            const doc = await tplReadXml(out, 'word/document.xml');
            tplEls(doc, 'docPr', OOXML_NS.wp).forEach((e, i) => e.setAttribute('id', String(i + 1)));
            tplRenumberBookmarks([doc.documentElement], 0);
            out.file('word/document.xml', tplSerializeXml(doc));
            return out.generateAsync({ type: 'blob', mimeType: DOCX_MIME });
        }

        // A Word template can be kept inside the .KNOW_FTL so the project carries its own
        // house style. The cap keeps a project file from being dominated by a template that
        // was never meant to travel with it -- a template is styles, not content.
        const TEMPLATE_MAX_BYTES = 1000 * 1024;   // 1,000 KB

        /** ArrayBuffer -> base64, chunked so a large buffer cannot blow the call stack. */
        function templateBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let bin = '';
            const CHUNK = 0x8000;
            for (let i = 0; i < bytes.length; i += CHUNK) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
            }
            return btoa(bin);
        }

        function templateBase64ToBuffer(b64) {
            const bin = atob(b64 || '');
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        }

        /** Human-readable size for the template notices. */
        function templateSizeLabel(bytes) {
            const kb = (bytes || 0) / 1024;
            return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB';
        }

        /* ---- public API ---- */
        // Reads a user-selected Word document/template. Returns what both modes need; the file bytes are kept
        // so each report generation starts from an unmodified copy.
        async function loadWordTemplate(file) {
            if (!window.JSZip) throw new Error('Template library failed to load. Check your network connection.');
            if (!/\.(docx|dotx)$/i.test(file.name)) throw new Error('Select a Word document (.docx) or template (.dotx). Macro-enabled files are not supported.');
            const buffer = await file.arrayBuffer();
            let zip;
            try { zip = await JSZip.loadAsync(buffer); } catch (e) { throw new Error('"' + file.name + '" could not be opened as a Word file.'); }
            const doc = await tplReadXml(zip, 'word/document.xml');
            if (!doc || !zip.file('word/styles.xml')) throw new Error('"' + file.name + '" is not a valid Word document or template.');

            let page = null;
            const sects = tplEls(doc, 'sectPr');
            const sect = sects[sects.length - 1]; // body-level section = last sectPr
            if (sect) {
                const num = (el, a) => { const v = el && el.getAttributeNS(OOXML_NS.w, a); return v ? parseInt(v, 10) : undefined; };
                const sz = tplEls(sect, 'pgSz')[0], mar = tplEls(sect, 'pgMar')[0];
                page = {
                    size: { width: num(sz, 'w'), height: num(sz, 'h') },
                    margin: { top: num(mar, 'top'), right: num(mar, 'right'), bottom: num(mar, 'bottom'), left: num(mar, 'left'), header: num(mar, 'header'), footer: num(mar, 'footer') }
                };
            }

            const tokens = new Set();
            const scan = (xmlDoc) => tplEls(xmlDoc, 'p').forEach(p => { const txt = tplParagraphText(p); REPORT_TEMPLATE_TOKENS.forEach(t => { if (txt.indexOf(t) >= 0) tokens.add(t); }); });
            scan(doc);
            const hasBodyToken = tokens.has('{{REPORT_BODY}}');
            for (const path of tplHeaderFooterPaths(zip)) scan(await tplReadXml(zip, path));
            return { name: file.name, buffer, page, tokens: Array.from(tokens), hasBodyToken };
        }

        // Import Format: apply the template's styles, theme, numbering to the docx.js report.
        async function applyTemplateFormat(reportBlob, tpl) {
            const out = await JSZip.loadAsync(reportBlob), src = await JSZip.loadAsync(tpl.buffer);
            const doc = await tplReadXml(out, 'word/document.xml');
            const styles = await tplReadXml(src, 'word/styles.xml');
            const remap = tplReconcileStyles(styles, [tplParseXml(TPL_FALLBACK_STYLES_XML), await tplReadXml(out, 'word/styles.xml')], tplCollectStyleIds([doc.documentElement]));
            tplApplyStyleRemap([doc.documentElement], remap);
            tplEls(doc, 'docPr', OOXML_NS.wp).forEach((e, i) => e.setAttribute('id', String(i + 1))); // docx.js repeats id="1" for every image
            tplRenumberBookmarks([doc.documentElement], 0);
            out.file('word/styles.xml', tplSerializeXml(styles));
            out.file('word/document.xml', tplSerializeXml(doc));

            const ct = await tplReadXml(out, '[Content_Types].xml'), rels = await tplReadRels(out, 'word/document.xml');
            await tplCopyPartByRelType(src, out, ct, rels, 'theme', 'word/theme/theme1.xml', 'application/vnd.openxmlformats-officedocument.theme+xml');
            await tplCopyPartByRelType(src, out, ct, rels, 'numbering', 'word/numbering.xml', 'application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml');
            out.file('[Content_Types].xml', tplSerializeXml(ct));
            out.file(tplRelsPath('word/document.xml'), tplSerializeXml(rels));
            return out.generateAsync({ type: 'blob', mimeType: DOCX_MIME });
        }

        // Merge into Template: insert the docx.js report body into the template package.
        async function mergeReportIntoTemplate(reportBlob, tpl, tokenValues) {
            const gen = await JSZip.loadAsync(reportBlob), out = await JSZip.loadAsync(tpl.buffer);
            const genDoc = await tplReadXml(gen, 'word/document.xml'), doc = await tplReadXml(out, 'word/document.xml');
            const body = tplEls(doc, 'body')[0];
            const nodes = tplChildEls(tplEls(genDoc, 'body')[0]).filter(n => !tplIsW(n, 'sectPr'));

            // 1. Fill text placeholders in the template body, headers, footers; note the largest drawing id in use.
            let maxDrawingId = 0;
            const trackIds = (xmlDoc) => tplEls(xmlDoc, 'docPr', OOXML_NS.wp).forEach(e => { maxDrawingId = Math.max(maxDrawingId, parseInt(e.getAttribute('id'), 10) || 0); });
            tplReplaceTokens(doc, tokenValues);
            trackIds(doc);
            for (const path of tplHeaderFooterPaths(out)) {
                const part = await tplReadXml(out, path);
                trackIds(part);
                if (tplReplaceTokens(part, tokenValues)) out.file(path, tplSerializeXml(part));
            }

            // 2. Styles used by the report body.
            const styles = await tplReadXml(out, 'word/styles.xml');
            const remap = tplReconcileStyles(styles, [tplParseXml(TPL_FALLBACK_STYLES_XML), await tplReadXml(gen, 'word/styles.xml')], tplCollectStyleIds(nodes));
            tplApplyStyleRemap(nodes, remap);
            out.file('word/styles.xml', tplSerializeXml(styles));

            // 3. Relationships referenced by the report body (chart images): copy media, re-key rIds.
            const genRels = tplRelList(await tplReadRels(gen, 'word/document.xml'));
            const rels = await tplReadRels(out, 'word/document.xml');
            const ct = await tplReadXml(out, '[Content_Types].xml');
            const relIdMap = {};
            let mediaN = 0;
            for (const el of nodes.flatMap(n => [n].concat(Array.from(n.getElementsByTagName('*'))))) {
                for (const attr of Array.from(el.attributes)) {
                    if (attr.namespaceURI !== OOXML_NS.r) continue;
                    const oldId = attr.value;
                    if (!(oldId in relIdMap)) {
                        relIdMap[oldId] = null;
                        const gRel = genRels.find(r => r.getAttribute('Id') === oldId);
                        if (gRel) {
                            const type = gRel.getAttribute('Type').replace(OOXML_REL, '');
                            const target = gRel.getAttribute('Target');
                            if (gRel.getAttribute('TargetMode') === 'External') {
                                relIdMap[oldId] = tplAddRel(rels, type, target, true);
                            } else {
                                const srcPath = tplResolveTarget('word/document.xml', target);
                                const ext = (srcPath.split('.').pop() || 'bin').toLowerCase();
                                let dest;
                                do { mediaN++; dest = 'word/media/kureas_report_' + mediaN + '.' + ext; } while (out.file(dest));
                                out.file(dest, await gen.file(srcPath).async('uint8array'));
                                tplEnsureContentType(ct, 'Default', ext, TPL_IMAGE_TYPES[ext] || 'application/octet-stream');
                                relIdMap[oldId] = tplAddRel(rels, type, dest.replace(/^word\//, ''));
                            }

                    }
                    if (relIdMap[oldId]) el.setAttributeNS(attr.namespaceURI, attr.name, relIdMap[oldId]);
                }
            }
            out.file(tplRelsPath('word/document.xml'), tplSerializeXml(rels));

            // 4. Unique drawing ids (duplicates make Word report unreadable content).
            nodes.forEach(n => tplEls(n, 'docPr', OOXML_NS.wp).forEach(e => e.setAttribute('id', String(++maxDrawingId))));
            // Unique bookmark ids (report caption bookmarks must not collide with template bookmarks).
            let maxBookmarkId = 0;
            tplEls(doc, 'bookmarkStart').forEach(e => { maxBookmarkId = Math.max(maxBookmarkId, parseInt(e.getAttributeNS(OOXML_NS.w, 'id'), 10) || 0); });
            tplRenumberBookmarks(nodes, maxBookmarkId);

            // 5. Insert the report body.
            const imported = nodes.map(n => doc.importNode(n, true));
            const placeholder = tplEls(doc, 'p').find(p => tplParagraphText(p).indexOf('{{REPORT_BODY}}') >= 0);
            if (placeholder) {
                const parent = placeholder.parentNode;
                const pPr = tplChildEls(placeholder).find(n => tplIsW(n, 'pPr'));
                if (pPr && tplChildEls(pPr).some(n => tplIsW(n, 'sectPr'))) {
                    // Placeholder paragraph carries a section break: keep it (without its text) and insert after it.
                    tplChildEls(placeholder).filter(n => n !== pPr).forEach(n => placeholder.removeChild(n));
                    const next = placeholder.nextSibling;
                    imported.forEach(n => parent.insertBefore(n, next));
                } else {
                    imported.forEach(n => parent.insertBefore(n, placeholder));
                    parent.removeChild(placeholder);
                    const last = tplChildEls(parent).pop();
                    if (tplIsW(parent, 'tc') && !tplIsW(last, 'p')) parent.appendChild(doc.createElementNS(OOXML_NS.w, 'w:p')); // a table cell must end with a paragraph
                }
            } else {
                const sect = tplChildEls(body).filter(n => tplIsW(n, 'sectPr')).pop() || null;
                imported.forEach(n => body.insertBefore(n, sect));
            }
            out.file('word/document.xml', tplSerializeXml(doc));

            // 6. Refresh a table of contents on open.
            const hasToc = tplEls(doc, 'instrText').some(e => /\bTOC\b/.test(e.textContent)) ||
                           tplEls(doc, 'fldSimple').some(e => /\bTOC\b/.test(e.getAttributeNS(OOXML_NS.w, 'instr') || ''));
            const settingsRel = tplRelsByType(rels, 'settings')[0];
            if (hasToc && settingsRel) {
                const settingsPath = tplResolveTarget('word/document.xml', settingsRel.getAttribute('Target'));
                const settings = await tplReadXml(out, settingsPath);
                if (settings) { tplEnsureUpdateFields(settings); out.file(settingsPath, tplSerializeXml(settings)); }
            }

            // 7. A .dotx main part must be retyped for a .docx output.
            tplEls(ct, 'Override', OOXML_NS.ct).forEach(o => {
                if (/wordprocessingml\.template\.main\+xml$/.test(o.getAttribute('ContentType') || ''))
                    o.setAttribute('ContentType', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml');
            });
            out.file('[Content_Types].xml', tplSerializeXml(ct));
            return out.generateAsync({ type: 'blob', mimeType: DOCX_MIME });
        }
        const REPORT_TABLE_BOOKMARK = (num) => '_RefKbTable' + num;
        const REPORT_FIGURE_BOOKMARK = (num) => '_RefKbFigure' + num;
        // US Letter, 1 in margins (twips): used when no template supplies a page size
        const REPORT_DEFAULT_PAGE = { size: { width: 12240, height: 15840 }, margin: { top: 1440, right: 1440, bottom: 1440, left: 1440, header: 720, footer: 720 } };
        // PNG data URL -> { bytes, width, height } read from the IHDR chunk; null for anything else
        function reportPngFromDataUrl(dataUrl) {
            if (typeof dataUrl !== 'string' || dataUrl.indexOf('data:image/png;base64,') !== 0) return null;
            const bin = atob(dataUrl.slice(dataUrl.indexOf(',') + 1));
            if (bin.length < 24) return null;
            const bytes = new Uint8Array(bin.length);
            for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
            const dv = new DataView(bytes.buffer);
            return { bytes, width: dv.getUint32(16), height: dv.getUint32(20) };
        }
        //   { kind: 'heading2', text }
        //   { kind: 'html', html }                                     rich text (Extended Description)
        //   { kind: 'code', text }                                     monospace, one paragraph per line
        //   { kind: 'table', id, title, headers, rows, colWidths }     colWidths in percent per column
        //   { kind: 'groupedTable', id, title, headers, colWidths, groups: [{ header, cells }] }
        //                                                              each group: one shaded full-width row, then a row of cells
        //   { kind: 'references', entries: [{ key, text }] }
        //   { kind: 'image', id, dataUrl, title, widthPct? }           PNG data URL; widthPct of the usable width
        // Tables and images carry num / uid / label / sec assigned by numberReportSections (ReportModal).
        // templateOpts: { mode: 'none' | 'format' | 'merge', template, bySection, numberHeadings, firstSection }
        //   -- template from loadWordTemplate(); the numbering options mirror the Report dialog.
        async function generateFtlReportDocx(reportTitle, showDateTime, sections, filename, templateOpts) {
            const d = window.docx;
            if (!d) return { ok: false, message: 'Report library failed to load. Check your network connection.' };
            const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, ImageRun, AlignmentType, SimpleField, TableLayoutType, Bookmark, ShadingType, LevelFormat } = d;

            const tpl = templateOpts && templateOpts.mode !== 'none' ? templateOpts.template : null;
            const tplMode = tpl ? templateOpts.mode : 'none';
            if (tpl && !window.JSZip) return { ok: false, message: 'Template library failed to load. Check your network connection.' };

            // Caption numbering. With bySection on, a caption is written the way Word's
            // own chapter-numbered captions are:
            //     Table { STYLEREF 1 \s }-{ SEQ Table \* ARABIC \s 1 }
            // STYLEREF picks up the number of the enclosing Heading 1 and the \s switch
            // restarts the SEQ counter there, so inserting a section renumbers both parts.
            const bySection = !!(templateOpts && templateOpts.bySection);
            const firstSection = Math.max(1, parseInt(templateOpts && templateOpts.firstSection, 10) || 1);
            // STYLEREF only yields a number when the headings are numbered. In 'format'
            // and 'merge' modes the template's numbering.xml wins, so the template must
            // supply that; we only number the headings ourselves in the standalone case.
            const HEADING_NUM_REF = 'kb-report-headings';
            const numberHeadings = !!(templateOpts && templateOpts.numberHeadings) && tplMode === 'none';
            // Appendices use a second outline list: "Appendix A", "A.1", ... The letter in an appendix
            // caption is fixed text (STYLEREF would read back "Appendix A"), with SEQ restarting per section.
            const APPENDIX_NUM_REF = 'kb-report-appendices';
            const headingNum = (level, appendix) => numberHeadings
                ? { numbering: { reference: appendix ? APPENDIX_NUM_REF : HEADING_NUM_REF, level } } : {};
            /* parts after the first repeat the figure number (SEQ \c) and all parts add their letter */
            const captionField = (word, b) => b && b.part ? captionFieldBase(word, b, b.part !== 'a').concat([new TextRun(b.part)]) : captionFieldBase(word, b, false);
            const captionFieldBase = (word, b, rep) => bySection
                ? (b.appendix
                    ? [new TextRun(word + ' ' + String(b.sec !== undefined ? b.sec : '') + '-'),
                       new SimpleField('SEQ ' + word + ' \\* ARABIC \\s 1' + (rep ? ' \\c' : ''), String(b.num))]
                    : [new TextRun(word + ' '),
                       new SimpleField('STYLEREF 1 \\s', String(b.sec !== undefined ? b.sec : '')),
                       new TextRun('-'),
                       new SimpleField('SEQ ' + word + ' \\* ARABIC \\s 1' + (rep ? ' \\c' : ''), String(b.num))])
                : [new TextRun(word + ' '),
                   new SimpleField('SEQ ' + word + ' \\* ARABIC' + (rep ? ' \\c' : ''), String(b.num))];
            const pg = tpl && tpl.page;
            const pgOk = !!(pg && pg.size && pg.size.width && pg.size.height && pg.margin && [pg.margin.top, pg.margin.right, pg.margin.bottom, pg.margin.left].every(v => v != null));
            const layoutPage = pgOk ? pg : REPORT_DEFAULT_PAGE;
            const usableW = layoutPage.size.width - layoutPage.margin.left - layoutPage.margin.right;
            const usableH = layoutPage.size.height - layoutPage.margin.top - layoutPage.margin.bottom;
            const maxWpx = Math.round(usableW / 15);          // twips -> px at 96 dpi
            const maxHpx = Math.round(usableH / 15 * 0.85);   // leave room for the caption

            // Table and figure numbers come from the section builder (numberReportSections), so the
            // cached SEQ/REF results match the Preview and Word's own count. The bookmark uses the
            // never-restarting uid: with numbering by section, two captions could otherwise share a
            // bookmark name and send every cross-reference to the first of them.
            const pngOf = new Map(), refs = {};
            sections.forEach(s => s.blocks.forEach(b => {
                if (b.kind === 'table' || b.kind === 'groupedTable') {
                    if (b.id) refs[b.id] = { type: 'table', uid: b.uid, label: b.label };
                } else if (b.kind === 'image') {
                    const png = reportPngFromDataUrl(b.dataUrl);
                    if (png && png.width && png.height) pngOf.set(b, png);
                    if (b.id) refs[b.id] = { type: 'figure', uid: b.uid, label: b.label };
                }
            }));
            // In-text cross reference: a REF field to the caption's bookmark, so the number in the
            // sentence tracks the caption when sections are added or moved.
            const refField = (id) => {
                const r = refs[id];
                if (!r) return null;
                return r.type === 'table' ? new SimpleField(`REF ${REPORT_TABLE_BOOKMARK(r.uid)} \\h`, 'Table ' + r.label)
                                          : new SimpleField(`REF ${REPORT_FIGURE_BOOKMARK(r.uid)} \\h`, 'Figure ' + r.label);
            };

            // Word table caption above the table: Caption style + (STYLEREF-)SEQ Table field, kept with the table
            const tableCaption = (b) => new Paragraph({ style: 'Caption', keepNext: true, spacing: { before: 120, after: 60 }, children: [
                new Bookmark({ id: REPORT_TABLE_BOOKMARK(b.uid), children: captionField('Table', b) }),
                new TextRun(`. ${b.title}.`)] });

            const children = [];
            // In merge mode a template that places {{PROJECT_NAME}} supplies its own title block.

// Captures the fault tree canvas for one tree (the editor shows it, the image is trimmed of white space)
function ftlCaptureTreeImage(treeIndex, setSelectedTreeIndex, firstWaitMs) {
  return new Promise(resolve => {
    setSelectedTreeIndex(treeIndex);
    const attempt = k => setTimeout(() => {
      try {
        const cv = document.querySelector('main canvas') || document.querySelector('canvas');
        if (!cv || !cv.width || !cv.height) {
          if (k < 3) return attempt(k + 1);
          return resolve(null);
        }
        const cx = cv.getContext('2d', {
          willReadFrequently: true
        });
        const data = cx.getImageData(0, 0, cv.width, cv.height).data;
        let minX = cv.width,
          minY = cv.height,
          maxX = 0,
          maxY = 0,
          has = false;
        for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2) {
          const i = (y * cv.width + x) * 4;
          if (data[i + 3] > 0 && (data[i] < 245 || data[i + 1] < 245 || data[i + 2] < 245)) {
            has = true;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
        if (!has) {
          if (k < 3) return attempt(k + 1);
          return resolve(null);
        }
        const pad = 30;
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(cv.width, maxX + pad);
        maxY = Math.min(cv.height, maxY + pad);
        const w = maxX - minX,
          h = maxY - minY,
          sc = 2,
          c = document.createElement('canvas');
        c.width = w * sc;
        c.height = h * sc;
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff';
        g.fillRect(0, 0, c.width, c.height);
        g.scale(sc, sc);
        g.drawImage(cv, minX, minY, w, h, 0, 0, w, h);
        resolve(c.toDataURL('image/png'));
      } catch (e) {
        if (k < 3) attempt(k + 1);else resolve(null);
      }
    }, k === 1 ? firstWaitMs : 500);
    attempt(1);
  });
}

   the figure it continues on). A part starts with a "FROM" triangle naming the figure it comes from, so every part

const IMPORT_FORMATS = {

function impEmptySource(format, fileLabel) {
  return {
    format,
    fileLabel,
    projectName: '',
    faultTrees: [],
    eventInfo: {},
    eventDescriptions: {},
    gateDescriptions: {},
    cutSets: {},
    warnings: []
  };
}
function impCleanName(s) {
  return String(s == null ? '' : s).trim().replace(/\s+/g, '_').replace(/\//g, '_');
}
function impTreeName(s) {
  return impCleanName(s).toUpperCase() || 'TREE';
}
// Normalise raw SAPHIRE T/F/I flags (FdT) into the KUREAS flag model (same rule as loadProject)
function impNormalizeFlags(eventInfo) {
  Object.values(eventInfo || {}).forEach(ev => {
    if (ev && !ev.FailureModel) {
      const f = String(ev.FdT || '').toUpperCase();
      if (f === 'T' || f === 'F' || f === 'I') {
        ev.FailureModel = '5';
        ev.LogicFlag = f;
      }
    }
  });
}
function impFlagInfo(name, flag, note) {
  return {
    Name: name,
    FdT: flag,
    FailureModel: '5',
    LogicFlag: flag,
    Prob: flag === 'T' ? 1 : 0,
    Calc_Prob: flag === 'T' ? 1 : 0,
    Notes: note || ''
  };
}

// ── SAPHIRE: .FTL (+ .BED/.GTD/.BEI/.FTC) ────────────────────────────
function importReadSaphire(files) {
  const src = impEmptySource('saphire', files.map(f => f.name).join(', '));
  const seen = new Set();
  files.forEach(f => {
    const ext = f.name.toLowerCase().split('.').pop();
    if (ext === 'ftl' || ext === 'txt') {
      const parsed = parseFTLStructure(f.text);
      if (!src.projectName && parsed.projectName) src.projectName = parsed.projectName;
      (parsed.faultTrees || []).forEach(t => {
        if (seen.has(t.treeName)) {
          src.warnings.push(`Fault tree ${t.treeName} appears more than once; the first definition is used.`);
          return;
        }
        seen.add(t.treeName);
        src.faultTrees.push({
          treeName: t.treeName,
          rootNode: t.rootNode
        });
      });
    } else if (ext === 'bed') Object.assign(src.eventDescriptions, parseEventDescriptions(f.text));else if (ext === 'gtd') Object.assign(src.gateDescriptions, parseGateDescriptions(f.text));else if (ext === 'bei') Object.assign(src.eventInfo, parseBEI(f.text));else if (ext === 'ftc') Object.assign(src.cutSets, parseFTC(f.text));else src.warnings.push(`${f.name}: file type not recognised; ignored.`);
  });
  if (src.faultTrees.length === 0) throw new Error('No fault tree logic found. Select at least one SAPHIRE .FTL file.');
  if (!files.some(f => /\.bei$/i.test(f.name))) src.warnings.push('No .BEI file was selected, so the imported basic events carry no probability data.');
  impNormalizeFlags(src.eventInfo);
  return src;
}
