    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;

        }

        }
        .modal-overlay {

            align-items: center;

            max-height: 90vh;
            overflow-y: auto;

            padding: 12px;
            font-size: 11pt;

        .rich-text-editor h1 {

            font-weight: bold;

        }
        .rich-text-editor h2 {

            margin: 0.75em 0;
        }
        .rich-text-editor h3 {
            font-size: 1.17em;
            font-weight: bold;
            margin: 0.83em 0;
        }
        .rich-text-editor p {
            margin: 1em 0;
        }
        .rich-text-editor ul {
            list-style-type: disc;
            margin: 1em 0;
            padding-left: 40px;
        }
        .rich-text-editor ol {
            list-style-type: decimal;
            margin: 1em 0;
            padding-left: 40px;
        }
        .rich-text-editor li {
            margin: 0.5em 0;
        }
        .rich-text-editor strong {
            font-weight: bold;
        }
        .rich-text-editor em {
            font-style: italic;
        }
        .rich-text-editor u {
            text-decoration: underline;
        }
        .rich-text-editor table {
            border-collapse: collapse;
            margin: 0.6em 0;
        }
        .rich-text-editor table td, .rich-text-editor table th {
            border: 1px solid #9ca3af;
            padding: 4px 8px;
        }
        /* Click-to-edit display box for rich text fields */
        .rt-display p:first-child { margin-top: 0; }
        .rt-display p:last-child { margin-bottom: 0; }
        .hazard-editor-modal {
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            min-height: 70vh;
            height: 85vh;
            overflow-y: auto;
        }
        .rich-text-toolbar {
            border-bottom: 1px solid #d1d5db;
            padding: 8px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .toolbar-button {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }
        .toolbar-button:hover {
            background: #f3f4f6;
        }
        .toolbar-button.active {
            background: #e5e7eb;
        }
        .tree-node {
            cursor: pointer;
            user-select: none;
            padding: 2px 8px;
        }
        .tree-node:hover {
            background-color: #f3f4f6;
        }
        .hazard-button {
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #d1d5db;
            font-weight: 500;
        }
        .hazard-button.unanalyzed {

        }

        }
        .hazard-button.included {

        }

            text-align: center;
            line-height: 30px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        // Rich Text Editor Component
        // Insert Table dialog, opened from the rich text editor toolbar.
        function InsertTableModal({ onInsert, onClose }) {
            const [rows, setRows] = useState(2);
            const [cols, setCols] = useState(2);
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2200 }} onClick={onClose}>
                    <div className="bg-white rounded-lg shadow-xl max-w-xs w-full m-4" onClick={e => e.stopPropagation()}>
                        <div className="p-5">
                            <h3 className="text-base font-bold text-gray-800 mb-3">Insert Table</h3>
                            <div className="grid grid-cols-2 gap-3 mb-4">
                                <div>
                                    <label className="block text-xs mb-1 text-gray-600">Rows</label>
                                    <input type="number" min="1" max="20" className="w-full px-2 py-1.5 border rounded text-sm" value={rows} onChange={e => setRows(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs mb-1 text-gray-600">Columns</label>
                                    <input type="number" min="1" max="20" className="w-full px-2 py-1.5 border rounded text-sm" value={cols} onChange={e => setCols(e.target.value)} />
                                </div>
                            </div>
                            <div className="flex justify-end gap-2">
                                <button onClick={onClose} className="px-3 py-1.5 border rounded text-sm hover:bg-gray-100">Cancel</button>
                                <button onClick={() => { onInsert(parseInt(rows, 10) || 0, parseInt(cols, 10) || 0); onClose(); }} className="px-3 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">Insert</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ====================================================================
           RICH TEXT EDITOR MODAL
           Used for the facility Extended Description and for hazard Supporting
           Information. The editable div is uncontrolled: its HTML is seeded
           once on mount and read back on Save, so typing never re-renders it
           and the caret never jumps.
           z-index sits above .modal-overlay (1000) so the editor opens on top
           of the hazard editor.
           ==================================================================== */
        function RichTextEditor({ value, onChange, onClose, title }) {
            const editorRef = useRef(null);
            const [showTableModal, setShowTableModal] = useState(false);

            useEffect(() => { if (editorRef.current) editorRef.current.innerHTML = value || ''; }, []);

            const exec = (cmd, val) => { document.execCommand(cmd, false, val || null); editorRef.current && editorRef.current.focus(); };
            const handleSave = () => { onChange(editorRef.current ? editorRef.current.innerHTML : ''); onClose(); };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2100 }} onClick={onClose}>
                    <div className="bg-white rounded-lg shadow-xl max-w-2xl w-full m-4 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="p-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-bold text-gray-800">{title || 'Edit Extended Description'}</h2>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                            </div>
                            <div className="rich-text-toolbar">
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('bold')}><b>B</b></button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('italic')}><i>I</i></button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('underline')}><u>U</u></button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('insertUnorderedList')}>&bull; List</button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('insertOrderedList')}>1. List</button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('formatBlock', 'h1')}>H1</button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('formatBlock', 'h2')}>H2</button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('formatBlock', 'h3')}>H3</button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('formatBlock', 'p')}>P</button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => setShowTableModal(true)}>Table</button>
                                <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('removeFormat')}>Clear</button>
                            </div>
                            <div ref={editorRef} className="rich-text-editor" contentEditable={true} suppressContentEditableWarning={true}></div>
                            <div className="flex justify-end gap-2 mt-4">
                                <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                            </div>
                        </div>
                    </div>
                    {showTableModal && (
                        <InsertTableModal onClose={() => setShowTableModal(false)} onInsert={(rows, cols) => {
                            if (rows > 0 && cols > 0) {
                                let html = '<table>';
                                for (let r = 0; r < rows; r++) { html += '<tr>'; for (let c = 0; c < cols; c++) html += '<td>&nbsp;</td>'; html += '</tr>'; }

                        }} />

        // Operating Schedule Editor Component
        function OperatingScheduleEditor({ schedule, onSave, onClose, operatingStates }) {
            const defaultStateId = operatingStates.length > 0 ? operatingStates[0].id : 'FOS-1';
            const [periodYears, setPeriodYears] = useState(schedule.periodYears || 1);
            const [periods, setPeriods] = useState(schedule.periods || [
                { stateId: defaultStateId, startDay: 0, endDay: 365 }
            ]);

            const totalDays = periodYears * 365;

            const handleAddPeriod = () => {
                // Add a new period with default values
                const newPeriod = {
                    stateId: defaultStateId,
                    startDay: 0,
                    endDay: Math.min(30, totalDays)
                };
                setPeriods([...periods, newPeriod]);
            };

            const handleRemovePeriod = (index) => {
                if (periods.length > 1) {
                    setPeriods(periods.filter((_, i) => i !== index));
                }
            };

            const handlePeriodChange = (index, field, value) => {
                const newPeriods = [...periods];
                if (field === 'startDay' || field === 'endDay') {
                    value = Math.max(0, Math.min(totalDays, parseInt(value) || 0));
                }
                newPeriods[index] = { ...newPeriods[index], [field]: value };
                setPeriods(newPeriods);
            };

            const reconstructSchedule = () => {
                const totalDays = periodYears * 365;
                
                // If no periods, return default
                if (periods.length === 0) {
                    return [{ stateId: defaultStateId, startDay: 0, endDay: totalDays }];
                }
                
                // Create a timeline array where each day has a state
                const timeline = new Array(totalDays);
                
                // Initialize with first operating state
                for (let i = 0; i < totalDays; i++) {
                    timeline[i] = defaultStateId;
                }
                
                // Apply each period (later periods override earlier ones if they overlap)
                for (const period of periods) {
                    const start = Math.max(0, Math.min(totalDays, Math.floor(period.startDay)));
                    const end = Math.max(0, Math.min(totalDays, Math.floor(period.endDay)));
                    
                    if (start < end) {
                        for (let i = start; i < end; i++) {
                            timeline[i] = period.stateId;
                        }
                    }
                }
                
                // Convert timeline array back to periods
                const result = [];
                let currentState = timeline[0];
                let currentStart = 0;
                
                for (let i = 1; i < totalDays; i++) {
                    if (timeline[i] !== currentState) {
                        result.push({
                            stateId: currentState,
                            startDay: currentStart,
                            endDay: i
                        });
                        currentState = timeline[i];
                        currentStart = i;
                    }
                }
                
                // Add the final period
                result.push({
                    stateId: currentState,
                    startDay: currentStart,
                    endDay: totalDays
                });
                
                return result;
            };

            const handleSave = () => {
                const reconstructed = reconstructSchedule();
                const newSchedule = {
                    periodYears,
                    periods: reconstructed
                };
                onSave(newSchedule);
                onClose();
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-content" style={{ 
                        maxWidth: '800px',
                        backgroundColor: '#ffffff',
                        color: '#111827'
                    }}>
                        <div className="p-4">

                            <div className="mb-4">
                                <label className="block text-sm font-medium mb-2">
                                    Time Period (Years):
                                </label>
                                <input
                                    type="number"
                                    min="0.1"
                                    step="0.1"
                                    value={periodYears}
                                    onChange={(e) => setPeriodYears(parseFloat(e.target.value) || 1)}
                                    className="border rounded px-3 py-2 w-32"
                                />
                                <span className="ml-2 text-sm text-gray-600">
                                    ({totalDays} days)
                                </span>
                            </div>

                            <div className="mb-4">
                                <div className="flex justify-between items-center mb-2">
                                    <label className="block text-sm font-medium">Operating Periods:</label>
                                    <button
                                        onClick={handleAddPeriod}
                                        className="px-3 py-1 bg-blue-600 text-white text-sm rounded hover:bg-blue-700"
                                    >
                                        Add Period
                                    </button>
                                </div>
                                
                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {periods.map((period, index) => (
                                        <div key={index} className="flex gap-2 items-center border p-2 rounded">
                                            <select
                                                value={period.stateId}
                                                onChange={(e) => handlePeriodChange(index, 'stateId', e.target.value)}
                                                className="border rounded px-2 py-1 flex-1"
                                            >
                                                {operatingStates.map(state => (
                                                    <option key={state.id} value={state.id}>
                                                        {state.id}: {state.name}
                                                    </option>
                                                ))}
                                            </select>
                                            <input
                                                type="number"
                                                min="0"
                                                max={totalDays}
                                                value={period.startDay}
                                                onChange={(e) => handlePeriodChange(index, 'startDay', e.target.value)}
                                                className="border rounded px-2 py-1 w-24"
                                                placeholder="Start"
                                            />
                                            <span>to</span>
                                            <input
                                                type="number"
                                                min="0"
                                                max={totalDays}
                                                value={period.endDay}
                                                onChange={(e) => handlePeriodChange(index, 'endDay', e.target.value)}
                                                className="border rounded px-2 py-1 w-24"
                                                placeholder="End"
                                            />
                                            <span className="text-sm text-gray-600 w-20">
                                                ({period.endDay - period.startDay} d)
                                            </span>
                                            <button
                                                onClick={() => handleRemovePeriod(index)}
                                                className="px-2 py-1 bg-red-600 text-white text-sm rounded hover:bg-red-700"
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="mt-3 p-3 bg-blue-50 rounded text-sm">
                                    <strong>Note:</strong> Overlapping periods will be merged. Gaps will be filled with {defaultStateId}. 
                                    Periods are automatically sorted by start time when saved.
                                </div>
                            </div>

                            <div className="flex gap-3 justify-end mt-4">
                                <button
                                    onClick={onClose}
                                    className="px-4 py-2 border rounded hover:bg-gray-100"
                                >
                                    Cancel

                                <button
                                    onClick={handleSave}

                                >
                                    Save
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Operating Schedule Display Component
        function OperatingScheduleDisplay({ schedule, stateColors, operatingStates }) {
            const totalDays = (schedule.periodYears || 1) * 365;
            const periods = schedule.periods || [];

            const getStateColor = (stateId) => {
                if (stateColors && stateColors[stateId]) {
                    return stateColors[stateId];
                }
                const state = operatingStates.find(s => s.id === stateId);
                return state ? state.color : '#e5e7eb';
            };

            const getStateName = (stateId) => {
                const state = operatingStates.find(s => s.id === stateId);
                return state ? state.id : stateId;
            };

            const getStateDescription = (stateId) => {
                const state = operatingStates.find(s => s.id === stateId);
                return state ? state.description : '';
            };

            // Generate day labels at regular intervals
            const generateDayLabels = () => {
                const labels = [];
                const interval = totalDays <= 365 ? 30 : Math.ceil(totalDays / 12);
                
                for (let day = 0; day <= totalDays; day += interval) {
                    if (day === totalDays) {
                        labels.push({ day, position: 100 });
                    } else {
                        labels.push({ day, position: (day / totalDays) * 100 });
                    }
                }
                
                return labels;
            };

            const dayLabels = generateDayLabels();

            return (

                    <div className="flex" style={{ height: '30px', border: '1px solid #333', position: 'relative' }}>

        function HazardPlotModal({ createHazardPlot, getAvailableHazards, onClose }) {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [scale, setScale] = useState(1);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [baseImage, setBaseImage] = useState(null);
            const [containerSize, setContainerSize] = useState({ width: 0, height: 0 });
            const [plotType, setPlotType] = useState('individual'); // 'individual' or 'total'
            const [availableHazards, setAvailableHazards] = useState([]);
            const [selectedHazards, setSelectedHazards] = useState(new Set());
            const [showSidebar, setShowSidebar] = useState(true);

            // Get available hazards on mount
            useEffect(() => {
                const hazards = getAvailableHazards();
                setAvailableHazards(hazards);
                // Initially select all hazards
                setSelectedHazards(new Set(hazards.map(h => h.name)));
            }, []);

            useEffect(() => {
                // Measure container size
                const updateSize = () => {
                    if (containerRef.current) {
                        const rect = containerRef.current.getBoundingClientRect();
                        setContainerSize({ width: rect.width, height: rect.height });
                    }
                };
                
                updateSize();
                window.addEventListener('resize', updateSize);
                
                return () => window.removeEventListener('resize', updateSize);
            }, []);

            useEffect(() => {
                // Create the base plot image
                if (containerSize.width > 0) {
                    const img = new Image();
                    img.onload = () => {
                        setBaseImage(img);
                        drawCanvas(img, scale, offset);
                    };
                    img.src = createHazardPlot(plotType, selectedHazards);
                }
            }, [containerSize, plotType, selectedHazards]);

            useEffect(() => {
                if (baseImage) {
                    drawCanvas(baseImage, scale, offset);
                }
            }, [scale, offset, baseImage, containerSize]);

            const drawCanvas = (img, currentScale, currentOffset) => {
                const canvas = canvasRef.current;
                if (!canvas || !img || containerSize.width === 0) return;

                const ctx = canvas.getContext('2d');
                
                // Set display size (CSS pixels) to container size
                canvas.style.width = containerSize.width + 'px';
                canvas.style.height = containerSize.height + 'px';
                
                // Set actual size in memory (scaled for retina displays)
                const dpr = window.devicePixelRatio || 1;
                canvas.width = containerSize.width * dpr;
                canvas.height = containerSize.height * dpr;
                
                // Scale context for retina displays
                ctx.scale(dpr, dpr);

                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Fill with white background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, containerSize.width, containerSize.height);

                // Save context state
                ctx.save();

                // Apply transformations
                ctx.translate(currentOffset.x, currentOffset.y);
                ctx.scale(currentScale, currentScale);

                // Draw the image scaled to fit container width
                const imgAspect = img.width / img.height;
                const containerAspect = containerSize.width / containerSize.height;
                
                let drawWidth, drawHeight;
                if (imgAspect > containerAspect) {
                    // Image is wider, fit to width
                    drawWidth = containerSize.width;
                    drawHeight = containerSize.width / imgAspect;
                } else {
                    // Image is taller, fit to height
                    drawHeight = containerSize.height;
                    drawWidth = containerSize.height * imgAspect;
                }
                
                ctx.drawImage(img, 0, 0, drawWidth, drawHeight);

                // Restore context state
                ctx.restore();
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.max(0.5, Math.min(5, scale * delta));
                setScale(newScale);
            };

            const handleMouseDown = (e) => {
                setIsDragging(true);
                setDragStart({ x: e.clientX - offset.x, y: e.clientY - offset.y });
            };

            const handleMouseMove = (e) => {
                if (isDragging) {
                    setOffset({
                        x: e.clientX - dragStart.x,
                        y: e.clientY - dragStart.y
                    });
                }
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const handleReset = () => {
                setScale(1);
                setOffset({ x: 0, y: 0 });
            };

            const handleZoomIn = () => {
                const newScale = Math.min(5, scale * 1.2);
                setScale(newScale);
            };

            const handleZoomOut = () => {
                const newScale = Math.max(0.5, scale / 1.2);
                setScale(newScale);
            };

            const toggleHazard = (hazardName) => {
                setSelectedHazards(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(hazardName)) {
                        newSet.delete(hazardName);
                    } else {
                        newSet.add(hazardName);
                    }
                    return newSet;
                });

            const selectAll = () => {

            // Define colors to match the plot

            return (
                <div className="modal-overlay">
                    <div className="modal-content" style={{ 
                        maxWidth: '95vw',
                        width: '95vw',
                        maxHeight: '95vh',
                        height: '95vh',
                        backgroundColor: '#ffffff',
                        color: '#111827',
                        display: 'flex',
                        flexDirection: 'column'
                    }}>
                        <div className="p-4 border-b flex justify-between items-start">
                            <div>
                                <h2 className="text-xl font-bold">Hazard Frequency Plot</h2>
                                <div className="text-sm text-gray-600 mt-1">
                                    Use mouse wheel to zoom, click and drag to pan
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button
                                    onClick={() => setPlotType('individual')}
                                    className={`px-3 py-1 text-sm rounded ${plotType === 'individual' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                >
                                    Individual Hazards
                                </button>
                                <button
                                    onClick={() => setPlotType('total')}
                                    className={`px-3 py-1 text-sm rounded ${plotType === 'total' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                >
                                    Total Hazard Frequency
                                </button>
                                <span className="mx-2 text-gray-300">|</span>
                                <button
                                    onClick={() => setShowSidebar(!showSidebar)}
                                    className={`px-3 py-1 text-sm rounded ${showSidebar ? 'bg-gray-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                >
                                    {showSidebar ? 'Hide' : 'Show'} Hazard List
                                </button>
                            </div>
                        </div>
                        <div className="flex-1 flex overflow-hidden">
                            {/* Main plot area */}
                            <div 
                                ref={containerRef}
                                className="flex-1 overflow-hidden"
                                style={{ 
                                    cursor: isDragging ? 'grabbing' : 'grab',
                                    position: 'relative',
                                    backgroundColor: '#f3f4f6',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center'
                                }}
                            >
                                <canvas
                                    ref={canvasRef}
                                    onWheel={handleWheel}
                                    onMouseDown={handleMouseDown}
                                    onMouseMove={handleMouseMove}
                                    onMouseUp={handleMouseUp}
                                    onMouseLeave={handleMouseUp}
                                    style={{
                                        display: 'block'
                                    }}
                                />
                            </div>
                            
                            {/* Hazard selection sidebar */}
                            {showSidebar && (
                                <div className="w-64 border-l bg-white flex flex-col" style={{ minWidth: '250px' }}>
                                    <div className="p-3 border-b bg-gray-50">
                                        <div className="font-semibold text-sm mb-2">Select Hazards to Display</div>

                                            >
                                                Select All
                                            </button>
                                            <button
                                                onClick={selectNone}
                                                className="px-2 py-1 text-xs bg-gray-100 text-gray-700 rounded hover:bg-gray-200"
                                            >
                                                Select None
                                            </button>
                                        </div>
                                        <div className="text-xs text-gray-500 mt-2">
                                            {selectedHazards.size} of {availableHazards.length} selected
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-2">
                                        {availableHazards.length === 0 ? (
                                            <div className="text-sm text-gray-500 text-center py-4">
                                                No hazards with frequency data
                                            </div>
                                        ) : (
                                            availableHazards.map((hazard, index) => (
                                                <label
