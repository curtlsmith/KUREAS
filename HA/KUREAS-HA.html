                                                                    <div className="border rounded p-3 bg-gray-100">
                                                                        <div className="font-medium text-sm mb-2">Restoration Model</div>
                                                                        <div className="text-xs">
                                                                            <strong>Model:</strong> {event.restorationModel || 'none'}
                                                                        </div>
                                                                    </div>
                                                                    
                                                                    {/* Supporting Information Preview */}
                                                                    {event.description && (
                                                                        <div className="border rounded p-3 bg-white">
                                                                            <div className="font-medium text-sm mb-2">Supporting Information</div>
                                                                            <div 
                                                                                className="text-xs rich-text-editor"
                                                                                style={{ minHeight: 'auto', maxHeight: '200px', overflowY: 'auto', padding: '8px', border: '1px solid #e5e7eb', borderRadius: '4px' }}
                                                                                dangerouslySetInnerHTML={{ __html: event.description }}
                                                                            />
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <div className="text-sm text-gray-500 text-center py-4">
                                            No applicable events added yet.
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Status */}
                            <div className="mb-4 flex-shrink-0">
                                <label className="block text-sm font-medium mb-2">Evaluation Status:</label>
                                <select
                                    value={status}
                                    onChange={(e) => setStatus(e.target.value)}
                                    className="w-full border rounded px-3 py-2"
                                    disabled={isReadOnly || isEditingEvent}
                                >
                                    <option value="unanalyzed">Unanalyzed</option>
                                    <option value="included">Included in Scope</option>
                                    <option value="screened">Screened</option>
                                </select>
                                {operatingStates.length > 1 && (
                                    <label className="flex items-center gap-2 mt-2 cursor-pointer select-none" style={{ fontSize: '0.85rem' }}>
                                        <input
                                            type="checkbox"
                                            checked={setForAllFOS}
                                            onChange={(e) => setSetForAllFOS(e.target.checked)}
                                            disabled={isEditingEvent}
                                            className="w-4 h-4 accent-blue-600"
                                        />
                                        <span>Set for all Facility Operating States?</span>
                                        {setForAllFOS && (
                                            <span className="text-xs text-blue-600 ml-1">
                                                — other FOS will reference this state&apos;s data
                                            </span>
                                        )}
                                    </label>
                                )}
                            </div>

                            {/* Action Buttons */}
                            <div className="flex gap-3 justify-end border-t pt-3 flex-shrink-0">
                                <button
                                    onClick={onClose}
                                    className="px-4 py-2 border rounded hover:bg-gray-100 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed disabled:hover:bg-gray-200"
                                    disabled={isEditingEvent}
                                >
                                    Cancel
                                </button>
                                <button
                                    onClick={handleSave}
                                    className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
                                    disabled={isEditingEvent}
                                >
                                    Save
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Description Editor Modal */}
                    {editingDescription !== null && (
                        <RichTextEditor
                            value={applicableEvents[editingDescription].description}
                            onChange={(html) => {
                                handleEventChange(editingDescription, 'description', html);
                                setEditingDescription(null);
                            }}
                            onClose={() => setEditingDescription(null)}
                            title={`Edit Supporting Information for ${hazardName}`}
                        />
                    )}
                </div>
            );
        }

        // Modify Hazard List Component
        function ModifyHazardListModal({ hazardList, onSave, onClose }) {
            const [localList, setLocalList] = useState(JSON.parse(JSON.stringify(hazardList))); // Deep clone
            const [editingNode, setEditingNode] = useState(null);
            const [expandedNodes, setExpandedNodes] = useState(new Set());
            const [showAddForm, setShowAddForm] = useState(hazardList.length === 0); // Auto-show if starting fresh
            const [newHazard, setNewHazard] = useState({ level1: '', level2: '', level3: '', level4: '' });
            // Full-path editor: { nodeId, level, path: [l1name, l2name, l3name, l4name] }
            const [editingFullPath, setEditingFullPath] = useState(null);

            const toggleExpand = (nodeId) => {
                const newExpanded = new Set(expandedNodes);
                if (newExpanded.has(nodeId)) {
                    newExpanded.delete(nodeId);
                } else {
                    newExpanded.add(nodeId);
                }
                setExpandedNodes(newExpanded);
            };

            const findNodeById = (nodes, id) => {
                for (const node of nodes) {
                    if (node.id === id) return node;
                    if (node.children) {
                        const found = findNodeById(node.children, id);
                        if (found) return found;
                    }
                }
                return null;
            };

            const removeNode = (nodes, id) => {
                return nodes.filter(node => {
                    if (node.id === id) return false;
                    if (node.children) {
                        node.children = removeNode(node.children, id);
                    }
                    return true;
                });
            };

            const toggleHideNode = (nodes, id) => {
                return nodes.map(node => {
                    if (node.id === id) {
                        return { ...node, hidden: !node.hidden };
                    }
                    if (node.children) {
                        return { ...node, children: toggleHideNode(node.children, id) };
                    }
                    return node;
                });
            };

            const updateNodeName = (nodes, id, newName) => {
                return nodes.map(node => {
                    if (node.id === id) {
                        return { ...node, name: newName };
                    }
                    if (node.children) {
                        return { ...node, children: updateNodeName(node.children, id, newName) };
                    }
                    return node;
                });
            };

            // Resolve the full ancestor path of a node as [l1name, l2name, l3name, l4name]
            const getNodePath = (targetId) => {
                const walk = (nodes, path) => {
                    for (const n of nodes) {
                        const p = [...path, n.name];
                        if (n.id === targetId) return p;
                        if (n.children) { const r = walk(n.children, p); if (r) return r; }
                    }
                    return null;
                };
                const result = walk(localList, []);
                const padded = [...(result || [])];
                while (padded.length < 4) padded.push('');
                return padded; // always 4 elements
            };

            // Get the level (0-3) of a node
            const getNodeLevel = (targetId) => {
                const walk = (nodes, depth) => {
                    for (const n of nodes) {
                        if (n.id === targetId) return depth;
                        if (n.children) { const r = walk(n.children, depth + 1); if (r !== -1) return r; }
                    }
                    return -1;
                };
                return walk(localList, 0);
            };

            // Apply a full-path rename: renames the node at nodeId and reparents it if ancestors changed
            const handleSaveFullPath = () => {
                if (!editingFullPath) return;
                const { nodeId, level } = editingFullPath;
                const fp = editingFullPath.path;
                const l1 = fp[0].trim(); const l2 = fp[1].trim();
                const l3 = fp[2].trim(); const l4 = fp[3].trim();

                if (!l1) { alert('Level 1 (Category) is required.'); return; }
                if (level >= 1 && !l2) { alert('Level 2 (Group) is required for this node.'); return; }
                if (level >= 2 && !l3) { alert('Level 3 (Type) is required for this node.'); return; }
                if (level >= 3 && !l4) { alert('Level 4 (Event) is required for this node.'); return; }

                // Step 1: remove the node from its current position
                const nodeToMove = findNodeById(localList, nodeId);
                if (!nodeToMove) { setEditingFullPath(null); return; }
                let workingList = removeNode(JSON.parse(JSON.stringify(localList)), nodeId);

                // Step 2: re-insert under the correct ancestor chain, creating nodes as needed
                let nextId = getNextHazId(workingList) + 100; // avoid collisions
                const mk = (name) => ({ id: `HAZ-${nextId++}`, name, children: [] });

                if (level === 0) {
                    // Rename the category itself (l1) - check for existing
                    const existing = workingList.find(n => n.name.toLowerCase() === l1.toLowerCase());
                    if (existing) {
                        // Merge children into existing
                        (nodeToMove.children || []).forEach(c => existing.children.push(c));
                    } else {
                        workingList.push({ ...nodeToMove, name: l1 });
                    }
                } else if (level === 1) {
                    let p1 = workingList.find(n => n.name.toLowerCase() === l1.toLowerCase());
                    if (!p1) { p1 = mk(l1); workingList.push(p1); }
                    if (!p1.children) p1.children = [];
                    const existing = p1.children.find(n => n.name.toLowerCase() === l2.toLowerCase());
                    if (existing) {
                        (nodeToMove.children || []).forEach(c => existing.children.push(c));
                    } else {
                        p1.children.push({ ...nodeToMove, name: l2 });
                    }
                } else if (level === 2) {
                    let p1 = workingList.find(n => n.name.toLowerCase() === l1.toLowerCase());
                    if (!p1) { p1 = mk(l1); workingList.push(p1); }
                    if (!p1.children) p1.children = [];
                    let p2 = p1.children.find(n => n.name.toLowerCase() === l2.toLowerCase());
                    if (!p2) { p2 = mk(l2); p1.children.push(p2); }
                    if (!p2.children) p2.children = [];
                    const existing = p2.children.find(n => n.name.toLowerCase() === l3.toLowerCase());
                    if (existing) {
                        (nodeToMove.children || []).forEach(c => existing.children.push(c));
                    } else {
                        p2.children.push({ ...nodeToMove, name: l3 });
                    }
                } else {
                    // Level 3 (leaf event)
                    let p1 = workingList.find(n => n.name.toLowerCase() === l1.toLowerCase());
                    if (!p1) { p1 = mk(l1); workingList.push(p1); }
                    if (!p1.children) p1.children = [];
                    let p2 = p1.children.find(n => n.name.toLowerCase() === l2.toLowerCase());
                    if (!p2) { p2 = mk(l2); p1.children.push(p2); }
                    if (!p2.children) p2.children = [];
                    let p3 = p2.children.find(n => n.name.toLowerCase() === l3.toLowerCase());
                    if (!p3) { p3 = mk(l3); p2.children.push(p3); }
                    if (!p3.children) p3.children = [];
                    const existing = p3.children.find(n => n.name.toLowerCase() === l4.toLowerCase());
                    if (!existing) {
                        p3.children.push({ ...nodeToMove, name: l4, children: [] });
                    }
                }

                // Prune empty group nodes
                const pruneEmpty = (nodes) => nodes.filter(n => {
                    if (n.children && n.children.length > 0) { n.children = pruneEmpty(n.children); }
                    return true;
                });
                pruneEmpty(workingList);

                setLocalList(workingList);
                setEditingFullPath(null);
            };

            const handleRemove = (nodeId) => {
                if (confirm('Remove this hazard and all its children?')) {
                    setLocalList(removeNode(localList, nodeId));
                }
            };

            const handleToggleHide = (nodeId) => {
                setLocalList(toggleHideNode(localList, nodeId));
            };

            const handleEdit = (nodeId) => {
                const node = findNodeById(localList, nodeId);
                if (node) {
                    setEditingNode({ id: nodeId, name: node.name });
                }
            };

            const handleSaveEdit = () => {
                if (editingNode && editingNode.name.trim()) {
                    setLocalList(updateNodeName(localList, editingNode.id, editingNode.name.trim()));
                    setEditingNode(null);
                }
            };

            // Get the next available HAZ-N id across the entire tree
            const getNextHazId = (nodes) => {
                let maxId = 0;
                const walk = (list) => {
                    list.forEach(n => {
                        const m = n.id.match(/^HAZ-(\d+)$/);
                        if (m) { const v = parseInt(m[1], 10); if (v > maxId) maxId = v; }
                        if (n.children) walk(n.children);
                    });
                };
                walk(nodes);
                return maxId + 1;
            };

            // Add a new hazard using the 4-level quick entry form
            const handleAddHazard = () => {
                const l1 = newHazard.level1.trim();
                const l2 = newHazard.level2.trim();
                const l3 = newHazard.level3.trim();
                const l4 = newHazard.level4.trim();

                if (!l1) { alert('Please enter at least a Level 1 (General Hazard Category).'); return; }

                let nextId = getNextHazId(localList);
                const updatedList = JSON.parse(JSON.stringify(localList));

                // Find or create Level 1
                let level1Node = updatedList.find(n => n.name.toLowerCase() === l1.toLowerCase());
                if (!level1Node) {
                    level1Node = { id: `HAZ-${nextId++}`, name: l1, children: [] };
                    updatedList.push(level1Node);
                }
                if (!level1Node.children) level1Node.children = [];

                if (l2) {
                    // Find or create Level 2
                    let level2Node = level1Node.children.find(n => n.name.toLowerCase() === l2.toLowerCase());
                    if (!level2Node) {
                        level2Node = { id: `HAZ-${nextId++}`, name: l2, children: [] };
                        level1Node.children.push(level2Node);
                    }
                    if (!level2Node.children) level2Node.children = [];

                    if (l3) {
                        // Find or create Level 3
                        let level3Node = level2Node.children.find(n => n.name.toLowerCase() === l3.toLowerCase());
                        if (!level3Node) {
                            level3Node = { id: `HAZ-${nextId++}`, name: l3, children: [] };
                            level2Node.children.push(level3Node);
                        }
                        if (!level3Node.children) level3Node.children = [];

                        if (l4) {
                            // Check for duplicate Level 4
                            const exists = level3Node.children.find(n => n.name.toLowerCase() === l4.toLowerCase());
                            if (!exists) {
                                level3Node.children.push({ id: `HAZ-${nextId++}`, name: l4, children: [] });
                            }
                        }
                    }
                }

                setLocalList(updatedList);

                // Expand the newly added path so it's visible
                const newExpanded = new Set(expandedNodes);
                if (level1Node) newExpanded.add(level1Node.id);
                updatedList.forEach(n => {
                    if (n.name.toLowerCase() === l1.toLowerCase()) {
                        newExpanded.add(n.id);
                        if (l2 && n.children) {
                            n.children.forEach(c => {
                                if (c.name.toLowerCase() === l2.toLowerCase()) {
                                    newExpanded.add(c.id);
                                    if (l3 && c.children) {
                                        c.children.forEach(d => {
                                            if (d.name.toLowerCase() === l3.toLowerCase()) {
                                                newExpanded.add(d.id);
                                            }
                                        });
                                    }
                                }
                            });
                        }
                    }
                });
                setExpandedNodes(newExpanded);

                // Clear only the lowest levels so the user can keep adding under the same category
                setNewHazard(prev => ({ ...prev, level3: '', level4: '' }));
            };

            const handleSave = () => {
                onSave(localList);
                onClose();
            };

            const renderNode = (node, level) => {
                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = expandedNodes.has(node.id);
                const isEditing = editingNode && editingNode.id === node.id;
                const levelLabels = ['Category', 'Group', 'Type', 'Event'];
                const levelLabel = level < levelLabels.length ? levelLabels[level] : '';

                return (
                    <div key={node.id}>
                        <div 
                            className="flex items-center gap-2 py-1 px-2 hover:bg-gray-100"
                            style={{ paddingLeft: `${level * 20 + 8}px`, opacity: node.hidden ? 0.5 : 1 }}
                        >
                            {hasChildren && (
                                <span 
                                    onClick={() => toggleExpand(node.id)}
                                    className="cursor-pointer select-none w-4"
                                >
                                    {isExpanded ? '\u25BC' : '\u25B6'}
                                </span>
                            )}
                            {!hasChildren && <span className="w-4"></span>}
                            
                            {isEditing ? (
                                <input
                                    type="text"
                                    value={editingNode.name}
                                    onChange={(e) => setEditingNode({ ...editingNode, name: e.target.value })}
                                    onKeyDown={(e) => { if (e.key === 'Enter') handleSaveEdit(); if (e.key === 'Escape') setEditingNode(null); }}
                                    className="flex-1 border rounded px-2 py-1 text-sm"
                                    autoFocus
                                />
                            ) : (
                                <span
                                    className="flex-1 cursor-pointer hover:text-blue-700 hover:underline"
                                    title="Click to rename"
                                    onClick={() => handleEdit(node.id)}
                                >
                                    {node.name}
                                    {levelLabel && <span className="ml-2 text-xs text-gray-400 no-underline" style={{ textDecoration: 'none' }}>({levelLabel})</span>}
                                </span>
                            )}
                            
                            <div className="flex gap-1">
                                {isEditing ? (
                                    <>
                                        <button
                                            onClick={handleSaveEdit}
                                            className="px-2 py-1 bg-green-600 text-white text-xs rounded hover:bg-green-700"
                                        >
                                            Save
                                        </button>
                                        <button
                                            onClick={() => setEditingNode(null)}
                                            className="px-2 py-1 bg-gray-600 text-white text-xs rounded hover:bg-gray-700"
                                        >
                                            Cancel
                                        </button>
                                    </>
                                ) : (
                                    <>
                                        <button
                                            onClick={() => {
                                                const path = getNodePath(node.id);
                                                setEditingFullPath({ nodeId: node.id, level, path });
                                            }}
                                            className="px-2 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700"
                                            title="Edit full path (all ancestor levels)"
                                        >
                                            Edit
                                        </button>
                                        <button
                                            onClick={() => handleToggleHide(node.id)}
                                            className="px-2 py-1 bg-yellow-600 text-white text-xs rounded hover:bg-yellow-700"
                                            title={node.hidden ? "Show" : "Hide"}
                                        >
                                            {node.hidden ? 'Show' : 'Hide'}
                                        </button>
                                        <button
                                            onClick={() => handleRemove(node.id)}
                                            className="px-2 py-1 bg-red-600 text-white text-xs rounded hover:bg-red-700"
                                            title="Remove"
                                        >
                                            Remove
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                        {hasChildren && isExpanded && (
                            <div>
                                {node.children.map(child => renderNode(child, level + 1))}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-content" style={{ maxWidth: '900px', backgroundColor: '#ffffff', color: '#111827', maxHeight: '90vh', display: 'flex', flexDirection: 'column' }}>
                        <div className="p-4 flex flex-col flex-1 overflow-hidden">
                            <h2 className="text-xl font-bold mb-3">{localList.length === 0 && hazardList.length === 0 ? 'Start Hazard List' : 'Modify Hazard List'}</h2>
                            
                            <div className="mb-3 p-3 bg-blue-50 border border-blue-200 rounded text-sm">
                                <p className="font-semibold mb-1">Hazard List Hierarchy</p>
                                <p className="text-gray-700 mb-2">The hazard list is organized into four levels:</p>
                                <div className="ml-2 text-gray-600" style={{ lineHeight: '1.6' }}>
                                    <div><strong>Level 1:</strong> General Hazard Category <span className="text-gray-400 italic">(e.g., Internal Hazards)</span></div>
                                    <div style={{ paddingLeft: '20px' }}><strong>Level 2:</strong> Hazard Group <span className="text-gray-400 italic">(e.g., Internal Fire)</span></div>
                                    <div style={{ paddingLeft: '40px' }}><strong>Level 3:</strong> Hazard Type <span className="text-gray-400 italic">(e.g., Building X Fires)</span></div>
                                    <div style={{ paddingLeft: '60px' }}><strong>Level 4:</strong> Hazard Event <span className="text-gray-400 italic">(e.g., Fire in Electrical Cabinet #1)</span></div>
                                </div>
                            </div>

                            {/* Add Hazard Form */}
                            <div className="mb-3 p-3 bg-gray-50 border rounded">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-semibold text-sm">Add Hazard</span>
                                    {!showAddForm && (
                                        <button
                                            onClick={() => setShowAddForm(true)}
                                            className="px-3 py-1 bg-green-600 text-white text-xs rounded hover:bg-green-700"
                                        >
                                            + Add Hazard
                                        </button>
                                    )}
                                </div>
                                {showAddForm && (
                                    <div>
                                        <div className="grid grid-cols-2 gap-2 mb-2">
                                            {/* Build suggestion lists from the current localList */}
                                            {(() => {
                                                const l1Opts = [...new Set(localList.map(n => n.name))];
                                                const matchedL1 = localList.find(n => n.name.toLowerCase() === newHazard.level1.trim().toLowerCase());
                                                const l2Opts = matchedL1 ? [...new Set((matchedL1.children || []).map(n => n.name))] : [...new Set(localList.flatMap(n => (n.children || []).map(c => c.name)))];
                                                const matchedL2 = matchedL1 && (matchedL1.children || []).find(n => n.name.toLowerCase() === newHazard.level2.trim().toLowerCase());
                                                const l3Opts = matchedL2 ? [...new Set((matchedL2.children || []).map(n => n.name))] : [];
                                                const matchedL3 = matchedL2 && (matchedL2.children || []).find(n => n.name.toLowerCase() === newHazard.level3.trim().toLowerCase());
                                                const l4Opts = matchedL3 ? [...new Set((matchedL3.children || []).map(n => n.name))] : [];
                                                return (
                                                    <>
                                                        <datalist id="hz-l1-opts">{l1Opts.map(o => <option key={o} value={o}/>)}</datalist>
                                                        <datalist id="hz-l2-opts">{l2Opts.map(o => <option key={o} value={o}/>)}</datalist>
                                                        <datalist id="hz-l3-opts">{l3Opts.map(o => <option key={o} value={o}/>)}</datalist>
                                                        <datalist id="hz-l4-opts">{l4Opts.map(o => <option key={o} value={o}/>)}</datalist>
                                                        <div>
                                                            <label className="block text-xs text-gray-500 mb-0.5">Level 1: General Hazard Category *</label>
                                                            <input
                                                                type="text"
                                                                list="hz-l1-opts"
                                                                value={newHazard.level1}
                                                                onChange={(e) => setNewHazard(prev => ({ ...prev, level1: e.target.value, level2: '', level3: '', level4: '' }))}
                                                                className="w-full border rounded px-2 py-1.5 text-sm"
                                                                placeholder="e.g., Internal Hazards"
                                                                autoComplete="off"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs text-gray-500 mb-0.5">Level 2: Hazard Group</label>
                                                            <input
                                                                type="text"
                                                                list="hz-l2-opts"
                                                                value={newHazard.level2}
                                                                onChange={(e) => setNewHazard(prev => ({ ...prev, level2: e.target.value, level3: '', level4: '' }))}
                                                                className="w-full border rounded px-2 py-1.5 text-sm"
                                                                placeholder="e.g., Internal Fire"
                                                                autoComplete="off"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs text-gray-500 mb-0.5">Level 3: Hazard Type</label>
                                                            <input
                                                                type="text"
                                                                list="hz-l3-opts"
                                                                value={newHazard.level3}
                                                                onChange={(e) => setNewHazard(prev => ({ ...prev, level3: e.target.value, level4: '' }))}
                                                                className="w-full border rounded px-2 py-1.5 text-sm"
                                                                placeholder="e.g., Building X Fires"
                                                                autoComplete="off"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs text-gray-500 mb-0.5">Level 4: Hazard Event</label>
                                                            <input
                                                                type="text"
                                                                list="hz-l4-opts"
                                                                value={newHazard.level4}
                                                                onChange={(e) => setNewHazard(prev => ({ ...prev, level4: e.target.value }))}
                                                                className="w-full border rounded px-2 py-1.5 text-sm"
                                                                placeholder="e.g., Fire in Electrical Cabinet #1"
                                                                onKeyDown={(e) => { if (e.key === 'Enter') handleAddHazard(); }}
                                                                autoComplete="off"
                                                            />
                                                        </div>
                                                    </>
                                                );
                                            })()}
                                        </div>

        // Fundamental Safety Hazard Type Editor
        const FUNDAMENTAL_HAZARD_TREE = [
            {
                id: 'kinetic',
                label: 'Kinetic Energy',
                abbr: 'KE',
                children: [
                    { id: 'kinetic-electrical',      label: 'Electrical',      tooltip: 'Electrical KE is energy in motion. Electrical KE exists when a charge moves through a conductor. Example: Electrons moving through a wire, lightning.' },
                    { id: 'kinetic-electromagnetic', label: 'Electromagnetic', tooltip: 'Electromagnetic KE is the energy carried by moving electromagnetic waves resulting from the oscillation of electric and magnetic fields. Example: Radiation such as X-rays and gamma rays.' },
                    { id: 'kinetic-motion',          label: 'Motion',          tooltip: 'Motion KE is the energy an object possesses due to its motion. Example: A falling object, a flying aircraft, a neutron.' },
                    { id: 'kinetic-sound',           label: 'Sound',           tooltip: 'Sound KE is the mechanical energy resulting from vibratory movement of atoms and molecules as sound waves travel through a substance like air, water, or solids. Example: Sound through air.' },
                    { id: 'kinetic-thermal',         label: 'Thermal',         tooltip: 'Thermal KE is the internal energy of an object due to the motion of its atoms and molecules. It represents the energy of microscopic particle movement which is proportional to the substance\u2019s temperature and mass. Example: A high-temperature core, boiling water, a fire.' }
                ]
            },
            {
                id: 'potential',
                label: 'Potential Energy',
                abbr: 'PE',
                children: [
                    { id: 'potential-chemical',     label: 'Chemical',     tooltip: 'Chemical PE is the energy stored within the chemical bonds of atoms and molecules. It is a form of potential energy released or absorbed during chemical reactions, converting into heat, light, or work. Example: Gasoline, hydrogen, a charged battery.' },
                    { id: 'potential-electrical',   label: 'Electrical',   tooltip: 'Electrical PE is stored energy. Electrical PE arises from the relative position of charges (e.g., separated charges on capacitor plates). Example: A charged capacitor.' },
                    { id: 'potential-gravitational',label: 'Gravitational', tooltip: 'Gravitational PE is the energy stored in an object due to its height within a gravitational field. It represents the work done against gravity to lift an object. Example: A crane at the top of a building, water behind a dam.' },
                    { id: 'potential-magnetic',     label: 'Magnetic',     tooltip: 'Magnetic PE is the energy stored within a magnetic field or by a magnetic dipole due to its orientation and position within an external magnetic field. It represents the work required to align the magnetic moment with the field. Example: A magnet, an electric motor, an inductor.' },
                    { id: 'potential-mechanical',   label: 'Mechanical',   tooltip: 'Mechanical PE is the energy stored in an object due to its position, height, or physical configuration (like tension or compression) relative to a force, such as gravity or a spring. It is energy that can be converted into motion. Example: A spring.' },
                    { id: 'potential-nuclear',      label: 'Nuclear',      tooltip: 'Nuclear PE is the energy stored within an atomic nucleus, holding protons and neutrons together. It represents the potential for energy release or absorption during nuclear reactions. Example: Fission, fusion, radioactive decay.' }
                ]
            }
        ];

        function FundamentalHazardTypeEditor({ hazardName, hazardId, selected, info, onSave, onClose }) {
            // selected is an array of strings like "Kinetic Energy > Electrical"
            // info is { threatOrCause, worstCaseConsequences, hazardousEventAndEffects }
            const [localSelected, setLocalSelected] = React.useState(new Set(selected || []));
            const [threatOrCause, setThreatOrCause] = React.useState(info?.threatOrCause || '');
            const [worstCaseConsequences, setWorstCaseConsequences] = React.useState(info?.worstCaseConsequences || '');
            const [hazardousEventAndEffects, setHazardousEventAndEffects] = React.useState(info?.hazardousEventAndEffects || '');

            const toggle = (parentLabel, childLabel) => {
                const key = `${parentLabel} > ${childLabel}`;
                setLocalSelected(prev => {
                    const next = new Set(prev);
                    if (next.has(key)) next.delete(key);
                    else next.add(key);
                    return next;
                });
            };

            const handleSave = () => {
                onSave([...localSelected], { threatOrCause: threatOrCause.trim(), worstCaseConsequences: worstCaseConsequences.trim(), hazardousEventAndEffects: hazardousEventAndEffects.trim() });
                onClose();
            };

            const handleClear = () => {
                setLocalSelected(new Set());
            };

            const textareaStyle = { width: '100%', border: '1px solid #d1d5db', borderRadius: '4px', padding: '6px 8px', fontSize: '0.8rem', resize: 'vertical', minHeight: '54px', lineHeight: '1.4', boxSizing: 'border-box' };

            return (
                <div className="modal-overlay">
                    <div className="modal-content" style={{ maxWidth: '540px', backgroundColor: '#ffffff', color: '#111827' }}>
                        <div className="p-4">
                            <div className="mb-3 pb-3 border-b">
                                <h2 className="text-xl font-bold">Safety Hazard Information</h2>
                                <div className="mt-1 text-sm text-gray-600">
                                    <strong style={{ backgroundColor: '#fef9c3', padding: '1px 5px', borderRadius: '3px', border: '1px solid #fde047' }}>{hazardName}</strong>
                                </div>
                            </div>

                            {/* Three text fields for identification table */}
                            <div className="space-y-3 mb-4">
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 mb-1">Threat or Cause</label>
                                    <textarea
                                        value={threatOrCause}
                                        onChange={e => setThreatOrCause(e.target.value)}
                                        placeholder="Describe the threat or cause..."
                                        style={textareaStyle}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 mb-1">Worst Case Consequences</label>
                                    <textarea
                                        value={worstCaseConsequences}
                                        onChange={e => setWorstCaseConsequences(e.target.value)}
                                        placeholder="Describe the worst case consequences..."
                                        style={textareaStyle}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 mb-1">Hazardous Event and Effects</label>
                                    <textarea
                                        value={hazardousEventAndEffects}
                                        onChange={e => setHazardousEventAndEffects(e.target.value)}
                                        placeholder="Describe the hazardous event and its effects..."
                                        style={textareaStyle}
                                    />
                                </div>
                            </div>

                            {/* Fundamental hazard type checkboxes */}
                            <div className="mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wide">Fundamental Safety Hazard Types</div>
                            <div className="space-y-2">
                                {FUNDAMENTAL_HAZARD_TREE.map(parent => {
                                    const parentColor = parent.id === 'kinetic' ? '#fef3c7' : '#ede9fe';
                                    const parentBorder = parent.id === 'kinetic' ? '#fbbf24' : '#a78bfa';
                                    const parentText = parent.id === 'kinetic' ? '#92400e' : '#5b21b6';
                                    const childCheckedCount = parent.children.filter(c => localSelected.has(`${parent.label} > ${c.label}`)).length;
                                    return (
                                        <div key={parent.id} className="border rounded overflow-hidden">
                                            <div className="px-3 py-1.5 font-semibold text-sm flex items-center justify-between"
                                                style={{ backgroundColor: parentColor, borderBottom: `1px solid ${parentBorder}`, color: parentText }}>
                                                <span>{parent.label}{parent.abbr && <span style={{ fontWeight: 'normal', marginLeft: '4px', fontSize: '0.75rem', opacity: 0.75 }}>({parent.abbr})</span>}</span>
                                                {childCheckedCount > 0 && (
                                                    <span style={{ fontSize: '0.7rem', backgroundColor: parentBorder, color: '#fff', borderRadius: '9999px', padding: '0 6px', fontWeight: 'bold' }}>
                                                        {childCheckedCount}
                                                    </span>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-0">
                                                {parent.children.map((child, ci) => {
                                                    const key = `${parent.label} > ${child.label}`;
                                                    const checked = localSelected.has(key);
                                                    return (
                                                        <label key={child.id}
                                                            className="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-gray-50 select-none"
                                                            style={{ borderTop: ci > 0 && ci % 2 === 0 ? '1px solid #f3f4f6' : undefined,
                                                                     borderLeft: ci % 2 === 1 ? '1px solid #f3f4f6' : undefined }}
                                                        >
                                                            <input
                                                                type="checkbox"
                                                                checked={checked}
                                                                onChange={() => toggle(parent.label, child.label)}
                                                                className="w-4 h-4 accent-violet-600"
                                                            />
                                                            <span className="text-sm flex-1">{child.label}</span>
                                                            {child.tooltip && (
                                                                <span
                                                                    title={child.tooltip}
                                                                    style={{ flexShrink: 0, cursor: 'help', fontSize: '0.7rem', color: '#9ca3af', lineHeight: 1 }}
                                                                    onClick={e => e.preventDefault()}
                                                                >&#9432;</span>
                                                            )}
                                                        </label>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex gap-3 justify-between mt-5">
                                <button onClick={handleClear} className="px-3 py-2 text-sm text-red-600 border border-red-200 rounded hover:bg-red-50">
                                    Clear Types
                                </button>
                                <div className="flex gap-2">
                                    <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                                    <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

                // Hazard Notes Dialog - shows all notes/events for a hazard
        function HazardNotesDialog({ hazardName, notesEntries, onClose }) {
            // Helper: strip HTML tags for plain text summary
            const stripHtml = (html) => {
                if (!html) return '';
                const d = document.createElement('div');
                d.innerHTML = html.replace(/<\/(h1|h2|h3|h4|h5|h6|p|div|li|br)>/gi, ' ').replace(/<br\s*\/?>/gi, ' ');
                return (d.textContent || d.innerText || '').replace(/\s+/g, ' ').trim();
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-content" style={{ maxWidth: '700px', backgroundColor: '#ffffff', color: '#111827' }}>
                        <div className="p-4">
                            <div className="mb-4 pb-3 border-b">
                                <h2 className="text-xl font-bold">Hazard Notes</h2>
                                <div className="mt-1 text-sm">
                                    <strong style={{ backgroundColor: '#fef9c3', padding: '1px 5px', borderRadius: '3px', border: '1px solid #fde047' }}>{hazardName}</strong>
                                </div>
                            </div>

                            {notesEntries.length === 0 ? (
                                <div className="text-sm text-gray-500 italic p-4 text-center">No analysis notes recorded for this hazard yet.</div>
                            ) : (
                                <div className="space-y-4 overflow-y-auto" style={{ maxHeight: '60vh' }}>
                                    {notesEntries.map((entry, ei) => (
                                        <div key={ei} className="border rounded p-3">
                                            <div className="font-semibold text-sm mb-2">
                                                <span style={{ backgroundColor: entry.stateColor, padding: '1px 6px', borderRadius: '3px' }}>{entry.stateId} &ndash; {entry.stateName}</span>
                                                <span className={`ml-2 text-xs px-2 py-0.5 rounded ${entry.status === 'included' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-700'}`}>
                                                    {entry.status === 'included' ? 'Included' : 'Screened'}
                                                </span>
                                            </div>
                                            {entry.events.map((ev, evi) => {
                                                const desc = stripHtml(ev.description);
                                                const evDesc = ev.eventDescription || '';
                                                return (
                                                    <div key={evi} className="ml-2 mb-2 text-sm border-l-2 border-gray-200 pl-3">
                                                        <div className="font-medium">{ev.name}{evDesc ? <span className="font-normal text-gray-600"> &mdash; {evDesc}</span> : ''}</div>
                                                        {desc && <div className="text-gray-700 text-xs mt-1">{desc}</div>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="flex justify-end mt-4">
                                <button onClick={onClose} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Edit Safety Function Dialog
        function EditSafetyFunctionDialog({ sf, onSave, onClose }) {
            const editorRef = useRef(null);
            const [localId, setLocalId] = useState(sf ? sf.id : '');
            const [name, setName] = useState(sf ? sf.name : '');
            const [description, setDescription] = useState(sf ? sf.description : '');
            const [color, setColor] = useState(sf ? sf.color : '#bbf7d0');
            const [extendedDescription, setExtendedDescription] = useState(sf ? (sf.extendedDescription || '') : '');

            useEffect(() => {
                if (editorRef.current) {
                    editorRef.current.innerHTML = extendedDescription;
                }
            }, []);

            const execCommand = (command, value = null) => {
                if (editorRef.current) editorRef.current.focus();
                if (command === 'formatBlock') document.execCommand('formatBlock', false, value);
                else document.execCommand(command, false, value);
                if (editorRef.current) setExtendedDescription(editorRef.current.innerHTML);
            };

            const handleSave = () => {
                const newId = localId.trim();
                if (!newId) { alert('Safety Function ID cannot be empty.'); return; }
                if (!name.trim()) { alert('Safety Function Name cannot be empty.'); return; }
                const editorContent = editorRef.current ? editorRef.current.innerHTML : extendedDescription;
                onSave({ id: newId, name: name.trim(), description, color, extendedDescription: editorContent }, sf ? sf.id : null);
                onClose();
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-content" style={{ maxWidth: '700px', backgroundColor: '#ffffff', color: '#111827' }}>
                        <div className="p-4">
                            <h2 className="text-xl font-bold mb-4">{sf ? 'Edit Safety Function' : 'Add Safety Function'}</h2>
                            <div className="space-y-4">
                                <div className="flex gap-4">
                                    <div style={{ width: '130px' }}>
                                        <label className="block text-sm font-medium mb-1">Safety Function ID</label>
                                        <input type="text" value={localId} onChange={e => setLocalId(e.target.value)}
                                            className="w-full border rounded px-3 py-2" placeholder="e.g., SF-RC" />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-sm font-medium mb-1">Name</label>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)}
                                            className="w-full border rounded px-3 py-2" placeholder="Safety function name" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Color</label>
                                        <input type="color" value={color} onChange={e => setColor(e.target.value)}
                                            className="w-16 h-10 border rounded cursor-pointer" title="Column header color" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Description</label>
                                    <textarea value={description} onChange={e => setDescription(e.target.value)}
                                        className="w-full border rounded px-3 py-2" rows={2}
                                        placeholder="Brief description of this safety function" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Extended Description</label>
                                    <div className="border rounded">
                                        <div className="rich-text-toolbar">
                                            <button className="toolbar-button" onClick={() => execCommand('bold')} title="Bold"><strong>B</strong></button>
                                            <button className="toolbar-button" onClick={() => execCommand('italic')} title="Italic"><em>I</em></button>
                                            <button className="toolbar-button" onClick={() => execCommand('underline')} title="Underline"><u>U</u></button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'h1')} title="Heading 1">H1</button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'h2')} title="Heading 2">H2</button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'p')} title="Paragraph">P</button>
                                            <button className="toolbar-button" onClick={() => execCommand('insertUnorderedList')} title="Bullet List">&#8226; List</button>
                                            <button className="toolbar-button" onClick={() => execCommand('insertOrderedList')} title="Numbered List">1. List</button>
                                        </div>
                                        <div ref={editorRef} contentEditable className="rich-text-editor"
                                            style={{ minHeight: '150px', maxHeight: '250px', overflowY: 'auto' }}
                                            onInput={e => setExtendedDescription(e.target.innerHTML)} />
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-3 justify-end mt-6">
                                <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function EditSscActionDialog({ ssc, onSave, onClose }) {
            const editorRef = useRef(null);
            const [localId, setLocalId] = useState(ssc ? ssc.id : '');
            const [name, setName] = useState(ssc ? ssc.name : '');
            const [description, setDescription] = useState(ssc ? ssc.description : '');
            const [color, setColor] = useState(ssc ? ssc.color : '#e0f2fe');
            const [extendedDescription, setExtendedDescription] = useState(ssc ? (ssc.extendedDescription || '') : '');

            useEffect(() => {
                if (editorRef.current) editorRef.current.innerHTML = extendedDescription;
            }, []);

            const execCommand = (command, value = null) => {
                if (editorRef.current) editorRef.current.focus();
                if (command === 'formatBlock') document.execCommand('formatBlock', false, value);
                else document.execCommand(command, false, value);
                if (editorRef.current) setExtendedDescription(editorRef.current.innerHTML);

            const handleSave = () => {
                const newId = localId.trim();
                if (!newId) { alert('SSC/Action ID cannot be empty.'); return; }
                if (!name.trim()) { alert('SSC/Action Name cannot be empty.'); return; }
                const editorContent = editorRef.current ? editorRef.current.innerHTML : extendedDescription;
                onSave({ id: newId, name: name.trim(), description, color, extendedDescription: editorContent }, ssc ? ssc.id : null);

                                    <div style={{ width: '130px' }}>

                                    <div>
                                        <label className="block text-sm font-medium mb-1">Color</label>
                                        <input type="color" value={color} onChange={e => setColor(e.target.value)}
                                            className="w-16 h-10 border rounded cursor-pointer" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Description</label>

                                        placeholder="Brief description" />

                                <div>
                                    <label className="block text-sm font-medium mb-1">Extended Description</label>
                                    <div className="border rounded">
                                        <div className="rich-text-toolbar">
                                            <button className="toolbar-button" onClick={() => execCommand('bold')}><strong>B</strong></button>
                                            <button className="toolbar-button" onClick={() => execCommand('italic')}><em>I</em></button>
                                            <button className="toolbar-button" onClick={() => execCommand('underline')}><u>U</u></button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'p')}>P</button>
                                            <button className="toolbar-button" onClick={() => execCommand('insertUnorderedList')}>&#8226; List</button>
