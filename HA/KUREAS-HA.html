                                                endDay: period.endDay,
                                                stateId: state.id
                                            });
                                        }
                                    });
                                }
                            });
                        }
                    });
                });
                
                if (hazardData.length === 0) {
                    // No data to plot
                    ctx.fillStyle = '#000000';
                    ctx.font = '33px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('No frequency data available for plotting', canvas.width / 2, canvas.height / 2);
                    return canvas.toDataURL('image/png');
                }
                
                // For total plot, aggregate frequencies by period
                let plotData = hazardData;
                if (plotType === 'total') {
                    // Group by period (startDay, endDay)
                    const periodTotals = {};
                    hazardData.forEach(point => {
                        const periodKey = `${point.startDay}_${point.endDay}_${point.stateId}`;
                        if (!periodTotals[periodKey]) {
                            periodTotals[periodKey] = {
                                name: 'Total Hazard Frequency',
                                fullName: 'Sum of all hazard frequencies',
                                frequency: 0,
                                startDay: point.startDay,
                                endDay: point.endDay,
                                stateId: point.stateId
                            };
                        }
                        periodTotals[periodKey].frequency += point.frequency;
                    });
                    plotData = Object.values(periodTotals);
                }
                
                // Check if plotData is empty after aggregation
                if (plotData.length === 0) {
                    ctx.fillStyle = '#000000';
                    ctx.font = '33px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('No frequency data available for plotting', canvas.width / 2, canvas.height / 2);
                    if (plotType === 'total') {
                        ctx.font = '24px Arial';
                        ctx.fillText(`(hazardData had ${hazardData.length} entries)`, canvas.width / 2, canvas.height / 2 + 40);
                    }
                    return canvas.toDataURL('image/png');
                }
                
                // Use settings for y-axis range
                const minFreqSetting = projectSettings.hazardPlot?.minFrequency ?? settings.hazardPlot?.minFrequency ?? 1e-7;
                const maxFreqSetting = projectSettings.hazardPlot?.maxFrequency ?? settings.hazardPlot?.maxFrequency ?? 1e0;
                const logMin = Math.log10(minFreqSetting);
                const logMax = Math.log10(maxFreqSetting);
                
                // Draw axes
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(margin.left, margin.top);
                ctx.lineTo(margin.left, margin.top + plotHeight);
                ctx.lineTo(margin.left + plotWidth, margin.top + plotHeight);
                ctx.stroke();
                
                // Y-axis labels (logarithmic)
                ctx.fillStyle = '#000000';
                ctx.font = '21px Arial';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                
                const logRange = logMax - logMin;
                const numTicks = Math.abs(logRange) + 1;
                for (let i = 0; i < numTicks; i++) {
                    const logValue = logMin + i;
                    const freq = Math.pow(10, logValue);
                    const y = margin.top + plotHeight - (i / (numTicks - 1)) * plotHeight;
                    
                    ctx.fillText(freq.toExponential(0), margin.left - 20, y);
                    
                    // Grid line
                    ctx.strokeStyle = '#e0e0e0';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(margin.left, y);
                    ctx.lineTo(margin.left + plotWidth, y);
                    ctx.stroke();
                }
                
                // Y-axis label
                ctx.save();
                ctx.translate(40, margin.top + plotHeight / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.textAlign = 'center';
                ctx.font = 'bold 25px Arial';
                ctx.fillStyle = '#000000';
                ctx.fillText('Hazard Frequency (/yr)', 0, 0);
                ctx.restore();
                
                // X-axis labels at period boundaries
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.font = '21px Arial';
                ctx.fillStyle = '#000000';
                
                // Get unique start days from periods
                const periodBoundaries = new Set();
                operatingSchedule.periods.forEach(period => {
                    periodBoundaries.add(Math.floor(period.startDay));
                    periodBoundaries.add(Math.floor(period.endDay));
                });
                
                const sortedBoundaries = Array.from(periodBoundaries).sort((a, b) => a - b);
                sortedBoundaries.forEach(day => {
                    const x = margin.left + (day / totalDays) * plotWidth;
                    ctx.fillText(`Day ${day}`, x, margin.top + plotHeight + 20);
                    
                    // Vertical grid line
                    ctx.strokeStyle = '#e0e0e0';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, margin.top);
                    ctx.lineTo(x, margin.top + plotHeight);
                    ctx.stroke();
                });
                
                // X-axis label
                ctx.font = 'bold 25px Arial';
                ctx.fillStyle = '#000000';
                ctx.fillText('Anticipated Schedule (Days)', margin.left + plotWidth / 2, canvas.height - 40);
                
                // Draw operating state labels above x-axis
                ctx.font = '21px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                
                // Get operating state colors
                const getStateColor = (stateId) => {
                    if (settings.stateColors && settings.stateColors[stateId]) {
                        return settings.stateColors[stateId];
                    }
                    const state = operatingStates.find(s => s.id === stateId);
                    return state ? state.color : '#e5e7eb';
                };
                
                // Draw colored boxes for each operating period
                operatingSchedule.periods.forEach(period => {
                    const x1 = margin.left + (period.startDay / totalDays) * plotWidth;
                    const x2 = margin.left + (period.endDay / totalDays) * plotWidth;
                    const boxWidth = x2 - x1;
                    const boxHeight = 40;
                    const boxY = margin.top + plotHeight + 60;
                    
                    // Draw colored box
                    ctx.fillStyle = getStateColor(period.stateId);
                    ctx.fillRect(x1, boxY, boxWidth, boxHeight);
                    
                    // Draw border
                    ctx.strokeStyle = '#333333';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x1, boxY, boxWidth, boxHeight);
                    
                    // Draw state label if there's enough space
                    if (boxWidth > 60) {
                        ctx.fillStyle = '#000000';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(period.stateId, x1 + boxWidth / 2, boxY + boxHeight / 2);
                    }
                });
                
                // Add title for total plot
                if (plotType === 'total') {
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 30px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText('Total Hazard Frequency (Sum of All Hazards)', canvas.width / 2, 20);
                }
                
                // Group hazards by name and add small random offset to overlapping frequencies
                const hazardGroups = {};
                plotData.forEach(point => {
                    if (!hazardGroups[point.name]) {
                        hazardGroups[point.name] = [];
                    }
                    hazardGroups[point.name].push(point);
                });
                
                // Create offset map for overlapping frequencies
                const offsetMap = new Map();
                const offsetRange = 0.03; // 3% of log range
                
                Object.keys(hazardGroups).forEach((hazardName) => {
                    hazardGroups[hazardName].forEach(point => {
                        const logFreq = Math.log10(point.frequency);
                        const key = `${logFreq.toFixed(3)}_${point.startDay}_${point.endDay}`;
                        
                        if (!offsetMap.has(key)) {
                            offsetMap.set(key, []);
                        }
                        offsetMap.get(key).push({ hazardName, point });
                    });
                });
                
                // Assign offsets to overlapping lines
                offsetMap.forEach((overlapping) => {
                    if (overlapping.length > 1) {
                        overlapping.forEach((item, index) => {
                            const offset = ((index - (overlapping.length - 1) / 2) * offsetRange * (logMax - logMin)) / overlapping.length;
                            item.offset = offset;
                        });
                    } else {
                        overlapping[0].offset = 0;
                    }
                });
                
                // Plot hazard lines
                const colors = plotType === 'total' ? ['#2563eb'] : ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];
                const lineStyles = ['solid', 'dashed', 'dotted'];
                const uniqueHazards = Object.keys(hazardGroups);
                
                // Track rightmost point for each hazard for label placement
                const hazardLabelPositions = {};
                
                uniqueHazards.forEach((hazardName, index) => {
                    const color = colors[index % colors.length];
                    const lineStyle = plotType === 'total' ? 'solid' : lineStyles[Math.floor(index / colors.length) % lineStyles.length];
                    const hazardPoints = hazardGroups[hazardName];
                    
                    let maxX2 = -Infinity;
                    let labelY = 0;
                    
                    hazardPoints.forEach(point => {
                        const logFreq = Math.log10(point.frequency);
                        const key = `${logFreq.toFixed(3)}_${point.startDay}_${point.endDay}`;
                        const offsetItems = offsetMap.get(key);
                        const offsetItem = offsetItems ? offsetItems.find(item => item.hazardName === hazardName) : null;
                        const offset = offsetItem ? offsetItem.offset : 0;
                        
                        // Calculate y position, clamping to plot area
                        const yNorm = (logFreq + offset - logMin) / (logMax - logMin);
                        const yNormClamped = Math.max(0, Math.min(1, yNorm));
                        const y = margin.top + plotHeight - yNormClamped * plotHeight;
                        const x1 = margin.left + (point.startDay / totalDays) * plotWidth;
                        const x2 = margin.left + (point.endDay / totalDays) * plotWidth;
                        
                        // Track rightmost position
                        if (x2 > maxX2) {
                            maxX2 = x2;
                            labelY = y;
                        }
                        
                        ctx.strokeStyle = color;
                        ctx.lineWidth = plotType === 'total' ? 6 : 4;
                        
                        if (lineStyle === 'dashed') {
                            ctx.setLineDash([10, 10]);
                        } else if (lineStyle === 'dotted') {
                            ctx.setLineDash([4, 4]);
                        } else {
                            ctx.setLineDash([]);
                        }
                        
                        ctx.beginPath();
                        ctx.moveTo(x1, y);
                        ctx.lineTo(x2, y);
                        ctx.stroke();
                        
                        // If frequency is outside visible range, add indicator
                        if (yNorm > 1) {
                            // Frequency above max - draw arrow at top
                            ctx.fillStyle = color;
                            ctx.beginPath();
                            ctx.moveTo((x1 + x2) / 2, margin.top + 5);
                            ctx.lineTo((x1 + x2) / 2 - 8, margin.top + 20);
                            ctx.lineTo((x1 + x2) / 2 + 8, margin.top + 20);
                            ctx.closePath();
                            ctx.fill();
                        } else if (yNorm < 0) {
                            // Frequency below min - draw arrow at bottom
                            ctx.fillStyle = color;
                            ctx.beginPath();
                            ctx.moveTo((x1 + x2) / 2, margin.top + plotHeight - 5);
                            ctx.lineTo((x1 + x2) / 2 - 8, margin.top + plotHeight - 20);
                            ctx.lineTo((x1 + x2) / 2 + 8, margin.top + plotHeight - 20);
                            ctx.closePath();
                            ctx.fill();
                        }
                    });
                    
                    // Store label position
                    if (maxX2 > -Infinity) {
                        hazardLabelPositions[hazardName] = { x: maxX2, y: labelY, color, lineStyle };
                    }
                });
                
                // Draw labels at the end of lines
                ctx.setLineDash([]);
                ctx.font = plotType === 'total' ? 'bold 21px Arial' : '19px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                
                Object.keys(hazardLabelPositions).forEach(hazardName => {
                    const pos = hazardLabelPositions[hazardName];
                    
                    // Draw label text with extended space to the right
                    ctx.fillStyle = pos.color;
                    ctx.fillText(hazardName, pos.x + 10, pos.y);
                });
                
                
                return canvas.toDataURL('image/png');
            };

            // Returns { html, title, sections, footer }. sectionPrefs is the ordered
            // [{ key, enabled }] list from the Report dialog; omit it for every section.
            const buildReportHTML = async (sectionPrefs) => {

                // Helper function to strip font-family styles from HTML content
                const stripFontFamily = (html) => {
                    if (!html) return html;
                    // Remove font-family from inline styles
                    return html.replace(/font-family\s*:\s*[^;"']+[;]?/gi, '');
                };

                // Helper: extract plain text from HTML, preserving paragraph breaks
                const stripToPlainText = (html) => {
                    if (!html) return '';
                    const withBreaks = html
                        .replace(/<\/(p|div|h[1-6]|li|tr)>/gi, '\n')
                        .replace(/<br\s*\/?>/gi, '\n')
                        .replace(/<[^>]+>/g, '')
                        .replace(/&nbsp;/gi, ' ')
                        .replace(/&amp;/gi, '&')
                        .replace(/&lt;/gi, '<')
                        .replace(/&gt;/gi, '>')
                        .replace(/&quot;/gi, '"')
                        .replace(/&#39;/gi, "'")
                        .replace(/&[a-z]+;/gi, ' ')
                        .replace(/[ \t]+/g, ' ')
                        .replace(/\n[ \t]+/g, '\n')
                        .replace(/[ \t]+\n/g, '\n')
                        .replace(/\n{3,}/g, '\n\n')
                        .trim();
                    return withBreaks;
                };

                // Helper function to create operating state information section
                const createOperatingStateInfoHTML = () => {
                    let stateInfoHTML = '<div style="margin: 6px 0;">';
                    
                    operatingStates.forEach(state => {
                        const customData = operatingStateData[state.id];
                        const displayName = customData?.name || state.name;
                        const displayDescription = customData?.description || state.description;
                        const displayExtended = stripFontFamily(customData?.extendedDescription || '');
                        const stateColor = settings.stateColors?.[state.id] || state.color;
                        
                        stateInfoHTML += `<div style="margin-bottom: 15px; padding: 10px; border-left: 4px solid ${stateColor}; background-color: #f9fafb;">`;
                        stateInfoHTML += `<h3 style="margin: 0 0 5px 0;">${state.id}: ${displayName}</h3>`;
                        stateInfoHTML += `<p style="margin: 0 0 5px 0;"><strong>Description:</strong> ${displayDescription}</p>`;
                        if (displayExtended) {
                            const plainExt = stripToPlainText(displayExtended);
                            if (plainExt) stateInfoHTML += `<div style="margin-top: 6px;"><strong>Extended Description:</strong><br><pre style="font-family:inherit;white-space:pre-wrap;font-size:9pt;line-height:1.5;margin:4px 0 0 0;">${plainExt}</pre></div>`;
                        }
                        stateInfoHTML += `</div>`;
                    });
                    
                    stateInfoHTML += '</div>';
                    return stateInfoHTML;
                };

                // Helper function to create timeline visualization
                const createTimelineHTML = () => {
                    const totalDays = operatingSchedule.periodYears * 365;
                    let timelineHTML = '<div style="margin: 6px 0; line-height: 1.8;">';
                    
                    operatingSchedule.periods.forEach((period, index) => {
                        const state = operatingStates.find(s => s.id === period.stateId);
                        const startDay = Math.floor(period.startDay);
                        const endDay = Math.floor(period.endDay);
                        
                        timelineHTML += `<div style="margin: 5px 0; padding: 8px; background-color: ${tColor}; border: 1px solid #999; border-radius: 3px;">`;
                        const tCustom = operatingStateData[period.stateId];
                        const tName = tCustom?.name || state?.name || period.stateId;
                        const tDesc = tCustom?.description || state?.description || '';
                        const tColor = settings.stateColors?.[period.stateId] || state?.color || '#e5e7eb';
                        timelineHTML += `<strong>Day ${startDay} - Day ${endDay}:</strong> ${period.stateId} -- ${tName}: ${tDesc}`;
                        timelineHTML += '</div>';
                    });
                    
                    timelineHTML += '</div>';
                    return timelineHTML;
                };

                // Helper function to lighten a color for table cells
                const lightenColor = (color, percent = 40) => {
                    // Convert hex to RGB
                    const hex = color.replace('#', '');
                    const r = parseInt(hex.substr(0, 2), 16);
                    const g = parseInt(hex.substr(2, 2), 16);
                    const b = parseInt(hex.substr(4, 2), 16);
                    
                    // Lighten by moving towards white
                    const newR = Math.round(r + (255 - r) * (percent / 100));
                    const newG = Math.round(g + (255 - g) * (percent / 100));
                    const newB = Math.round(b + (255 - b) * (percent / 100));
                    
                    // Convert back to hex
                    return '#' + [newR, newG, newB].map(x => {
                        const hex = x.toString(16);
                        return hex.length === 1 ? '0' + hex : hex;
                    }).join('');
                };

                // Helper function to create hazard summary table
                const createHazardTableHTML = () => {
                    // Helper function to get category for a frequency
                    const getHazardCategory = (frequency) => {
                        if (frequency === null || frequency === undefined) return '';
                        // Handle range objects from hazard curves - use max frequency for categorization
                        let freq = frequency;
                        if (typeof frequency === 'object' && frequency.isRange) {
                            freq = frequency.max;
                        }
                        if (typeof freq !== 'number' || isNaN(freq)) return '';
                        const categories = effectiveHazardCategories || [];
                        for (const cat of categories) {
                            const low = cat.lowBound || 0;
                            // Infinity becomes null after JSON.stringify/parse, so treat null as Infinity
                            const high = (cat.highBound === Infinity || cat.highBound === null || cat.highBound === undefined) ? Number.MAX_VALUE : (cat.highBound || 0);
                            if (freq >= low && freq <= high) {
                                return cat.name;
                            }
                        }
                        return '';
                    };

                    let tableHTML = '<table><thead><tr>';
                    tableHTML += '<th>Potential Hazards</th>';
                    tableHTML += '<th>Frequency</th>';
                    if (effectiveShowHazardCategorization) {
                        tableHTML += '<th>Categorization</th>';
                    }
                    operatingStates.forEach(state => {
                        const customData = operatingStateData[state.id];
                        const displayName = customData?.name || state.name;
                        tableHTML += `<th>${state.id}<br><span style="font-weight:normal;font-size:8pt;">${displayName}</span></th>`;
                    });
                    tableHTML += '</tr></thead><tbody>';

                    const collectLeafHazards = (nodes, list = []) => {
                        nodes.forEach(node => {
                            if (node.hidden) return; // Skip hidden hazards
                            if (node.children && node.children.length > 0) {
                                collectLeafHazards(node.children, list);
                            } else {
                                list.push(node);
                            }
                        });
                        return list;
                    };

                    const leafHazards = collectLeafHazards(hazardList);
                    
                    leafHazards.forEach(hazard => {
                        let hasIncluded = false;
                        operatingStates.forEach(state => {
                            const key = `${hazard.id}_${state.id}`;
                            if (hazardStates[key] === 'included') {
                                hasIncluded = true;
                            }
                        });

                        if (hasIncluded) {
                            // Check if any event has hazard curve
                            let hasHazardCurve = false;
                            let hazardCurveHTML = '';
                            
                            operatingStates.forEach(state => {
                                const key = `${hazard.id}_${state.id}`;
                                const analysisData = hazardAnalysisData[key];
                                
                                if (analysisData && analysisData.applicableEvents) {
                                    analysisData.applicableEvents.forEach(event => {
                                        if (event.occurrenceModel === 'hazard-curve' && event.hazardCurveData && event.hazardCurveData.length > 0) {
                                            hasHazardCurve = true;
                                            if (!hazardCurveHTML) {
                                                // Create embedded hazard curve table
                                                hazardCurveHTML = '<table style="width: 90%; font-size: 8pt; margin: 0;"><thead><tr><th style="padding: 2px; text-align: center;">Magnitude</th><th style="padding: 2px; text-align: center;">Frequency (/yr)</th></tr></thead><tbody>';
                                                event.hazardCurveData.forEach(row => {
                                                    if (row.magnitude || row.frequency) {
                                                        hazardCurveHTML += `<tr><td style="padding: 2px;">${row.magnitude || ''}</td><td style="padding: 2px;">${row.frequency || ''}</td></tr>`;
                                                    }
                                                });
                                                hazardCurveHTML += '</tbody></table>';
                                            }
                                        }
                                    });
                                }
                            });
                            
                            const frequency = calculateHazardFrequency(hazard.id);
                            tableHTML += '<tr>';
                            tableHTML += `<td>${hazard.name}</td>`;
                            
                            // Insert hazard curve table or frequency
                            if (hasHazardCurve) {
                                tableHTML += `<td style="padding: 2px; text-align: center;">${hazardCurveHTML}</td>`;
                                // For hazard curves, show categorization based on highest frequency if enabled
                                if (effectiveShowHazardCategorization) {
                                    let maxFreq = 0;
                                    operatingStates.forEach(state => {
                                        const key = `${hazard.id}_${state.id}`;
                                        const analysisData = hazardAnalysisData[key];
                                        if (analysisData && analysisData.applicableEvents) {
                                            analysisData.applicableEvents.forEach(event => {
                                                if (event.occurrenceModel === 'hazard-curve' && event.hazardCurveData) {
                                                    event.hazardCurveData.forEach(row => {
                                                        const freq = parseFloat(row.frequency);
                                                        if (!isNaN(freq) && freq > maxFreq) maxFreq = freq;
                                                    });
                                                }
                                            });
                                        }
                                    });
                                    tableHTML += `<td style="text-align: center;">${getHazardCategory(maxFreq)}</td>`;
                                }
                            } else {
                                // Determine frequency units from events
                                let freqUnits = '/yr';
                                operatingStates.forEach(state => {
                                    const key = `${hazard.id}_${state.id}`;
                                    const ad = hazardAnalysisData[key];
                                    if (ad && ad.applicableEvents) {
                                        ad.applicableEvents.forEach(ev => {
                                            if (ev.occurrenceModel === 'frequency' && ev.frequencyUnits) freqUnits = ev.frequencyUnits;
                                        });
                                    }
                                });
                                tableHTML += `<td style="text-align: center;">${frequency !== null ? (formatFrequency(frequency) + ' ' + freqUnits) : ''}</td>`;
                                // Add categorization column if enabled
                                if (effectiveShowHazardCategorization) {
                                    const category = getHazardCategory(frequency);
                                    tableHTML += `<td style="text-align: center;">${category}</td>`;
                                }
                            }
                            
                            operatingStates.forEach(state => {
                                const key = `${hazard.id}_${state.id}`;
                                const stateValue = hazardStates[key] || 'unanalyzed';
                                
                                // Use GUI button colors
                                let baseColor;
                                if (stateValue === 'screened') {
                                    baseColor = '#6b7280'; // gray
                                } else if (stateValue === 'unanalyzed') {
                                    baseColor = '#3b82f6'; // blue
                                } else if (stateValue === 'included') {
                                    baseColor = '#10b981'; // green
                                } else {
                                    baseColor = '#cccccc';
                                }
                                
                                const lighterColor = lightenColor(baseColor, 40);
                                tableHTML += `<td style="background-color: ${lighterColor}; text-align: center;">${stateValue}</td>`;
                            });
                            tableHTML += '</tr>';
                        }
                    });

                    tableHTML += '</tbody></table>';
                    return tableHTML;
                };

                // Helper function to create hazard hierarchy section (non-screened hazards as indented tree)
                const createHazardHierarchyHTML = () => {
                    const renderHierarchyNode = (node, level) => {
                        let html = '';
                        const indent = level * 20;
                        const hasChildren = node.children && node.children.length > 0;

                        if (hasChildren) {
                            const allDescScreened = (n) => {
                                if (!n.children || n.children.length === 0) {
                                    return operatingStates.every(s => (hazardStates[`${n.id}_${s.id}`] || 'unanalyzed') === 'screened');
                                }
                                return n.children.every(c => allDescScreened(c));
                            };
                            if (allDescScreened(node)) return '';
                            const bg = level === 0 ? '#dbeafe' : level === 1 ? '#ede9fe' : level === 2 ? '#fef9c3' : '#f3f4f6';
                            const fw = level <= 1 ? 'bold' : 'normal';
                            html += `<div style="margin: 2px 0; padding: 3px 6px; margin-left: ${indent}px; background: ${bg}; font-weight: ${fw}; font-size: 9pt;">${node.name}</div>`;
                            node.children.forEach(child => { html += renderHierarchyNode(child, level + 1); });
                        } else {
                            const allScreened = operatingStates.every(s => (hazardStates[`${node.id}_${s.id}`] || 'unanalyzed') === 'screened');
                            if (allScreened) return '';

                            // Fundamental hazard types — list as "(1) X, (2) Y Hazard"
                            const types = (hazardTypes[node.id] || []);
                            let bulletLines = '';
                            if (types.length > 0) {
                                const typeList = types.map((t, i) => {
                                    const parts = t.split(' > ');
                                    return `(${i + 1}) ${parts[1] || parts[0]} Hazard`;
                                }).join(', ');
                                bulletLines += `<div style="font-size:8pt;margin-top:2px;color:#374151;">&bull; Fundamental hazard type: ${typeList}</div>`;
                            }

                            // FOS applicability — group into included / not-applicable (screened/unanalyzed)
                            const included = operatingStates.filter(s => (hazardStates[`${node.id}_${s.id}`] || 'unanalyzed') === 'included');
                            const notApplicable = operatingStates.filter(s => (hazardStates[`${node.id}_${s.id}`] || 'unanalyzed') === 'screened');
                            const unanalyzed = operatingStates.filter(s => (hazardStates[`${node.id}_${s.id}`] || 'unanalyzed') === 'unanalyzed');

                            const fmtIds = (arr) => arr.map(s => s.id).join(', ');
                            if (included.length > 0)
                                bulletLines += `<div style="font-size:8pt;color:#065f46;">&bull; Applicable in: ${fmtIds(included)}</div>`;
                            if (notApplicable.length > 0)
                                bulletLines += `<div style="font-size:8pt;color:#6b7280;">&bull; Not applicable in: ${fmtIds(notApplicable)}</div>`;
                            if (unanalyzed.length > 0)
                                bulletLines += `<div style="font-size:8pt;color:#3b82f6;">&bull; Unanalyzed in: ${fmtIds(unanalyzed)}</div>`;

                            html += `<div style="margin: 3px 0; padding: 3px 6px; margin-left: ${indent}px; border-left: 2px solid #d1d5db; font-size: 9pt;">`;
                            html += `<strong>${node.name}</strong>`;
                            if (bulletLines) html += `<div style="margin-left:6px;margin-top:1px;">${bulletLines}</div>`;
                            html += '</div>';
                        }
                        return html;
                    };

                    let html = '<div style="margin: 6px 0; font-family: inherit;">';
                    hazardList.filter(n => !n.hidden).forEach(node => { html += renderHierarchyNode(node, 0); });
                    html += '</div>';
                    return html;
                };
                // Helper to create Safety Functions section
                const createSafetyFunctionsHTML = () => {
                    if (!projectSettings.showSafetyFunctions || safetyFunctions.length === 0) return '<p><em>No safety functions defined.</em></p>';

                    const collectLeafHazards = (nodes, list = [], path = []) => {
                        nodes.forEach(node => {
                            if (node.hidden) return;
                            const newPath = [...path, node.name];
                            if (node.children && node.children.length > 0) collectLeafHazards(node.children, list, newPath);
                            else list.push({ hazard: node, path: newPath });
                        });
                        return list;
                    };
                    const leafHazards = collectLeafHazards(hazardList);

                    const thS = 'padding:5px 7px;text-align:left;background:#1e3a5f;color:#fff;font-weight:bold;font-size:8.5pt;border:1px solid #0f2340;';
                    const tdS = 'padding:4px 7px;font-size:8.5pt;border:1px solid #ddd;vertical-align:top;';

                    let html = '<table style="border-collapse:collapse;width:100%;margin:0 0 16px 0;">';
                    html += '<thead><tr>';
                    html += `<th style="${thS}width:35%;">Safety Function</th>`;
                    html += `<th style="${thS}width:65%;">SSCs / Actions</th>`;
                    html += '</tr></thead><tbody>';

                    safetyFunctions.forEach((sf, sfIdx) => {
                        const rowBg = sfIdx % 2 === 0 ? '#ffffff' : '#f8fafc';
                        const sfCell = `<strong>${sf.name}</strong>${sf.description ? `<div style="font-size:7.5pt;color:#555;margin-top:2px;font-style:italic;">${sf.description}</div>` : ''}`;

                        // Collect unique supporting SSCs across all included hazards
                        const seenSscIds = new Set();
                        const uniqueSscs = [];
                        leafHazards.forEach(({ hazard }) => {
                            const sfKey = `${hazard.id}_${sf.id}`;
                            const sfData = safetyFunctionAnalysisData[sfKey];
                            if (!sfData || sfData.status !== 'included') return;
                            (sfData.sscEntries || []).filter(e => e.supports).forEach(e => {
                                if (!seenSscIds.has(e.sscId)) {
                                    seenSscIds.add(e.sscId);
                                    uniqueSscs.push(e);
                                }
                            });
                        });
                        uniqueSscs.sort((a, b) => {
                            const sa = sscActions.find(s => s.id === a.sscId);
                            const sb = sscActions.find(s => s.id === b.sscId);
                            return (sa ? sa.id : a.sscId).localeCompare(sb ? sb.id : b.sscId, undefined, { numeric: true, sensitivity: 'base' });
                        });

                        const hasIncluded = leafHazards.some(({ hazard }) => {
                            const d = safetyFunctionAnalysisData[`${hazard.id}_${sf.id}`];
                            return d && d.status === 'included';
                        });

                        const sscText = !hasIncluded
                            ? '<span style="color:#9ca3af;font-style:italic;">No included hazards</span>'
                            : uniqueSscs.length === 0
                                ? '<span style="color:#9ca3af;font-style:italic;">None designated</span>'
                                : uniqueSscs.map(e => {
                                    const ssc = sscActions.find(s => s.id === e.sscId);
                                    const label = ssc ? `${ssc.id}: ${ssc.name}` : e.sscId;
                                    return `<div style="margin-bottom:1px;">${label}</div>`;
                                }).join('');

                        html += `<tr style="background:${rowBg};">`;
                        html += `<td style="${tdS}border-left:3px solid ${sf.color || '#6366f1'};">${sfCell}</td>`;
                        html += `<td style="${tdS}">${sscText}</td>`;
                        html += '</tr>';
                    });

                    html += '</tbody></table>';
                    return html;
                };

                // ── Helper: collect leaf hazards with path (shared utility) ──
                const collectLeafHazardsWithPath = (nodes, list = [], path = []) => {
                    nodes.forEach(node => {
                        if (node.hidden) return;
                        const newPath = [...path, node.name];
                        if (node.children && node.children.length > 0) collectLeafHazardsWithPath(node.children, list, newPath);
                        else list.push({ hazard: node, path: newPath, level1: path[0] || node.name });
                    });
                    return list;
                };

                // ── Helper: derive likelihood label from frequency using effectiveHazardCategories ──
                const getLikelihoodLabel = (frequency) => {
                    if (frequency === null || frequency === undefined) return '';
                    let freq = frequency;
                    if (typeof frequency === 'object' && frequency.isRange) freq = frequency.max;
                    if (typeof freq !== 'number' || isNaN(freq)) return '';
                    const cats = effectiveHazardCategories || [];
                    for (const cat of cats) {
                        const low = cat.lowBound || 0;
                        const high = (cat.highBound === Infinity || cat.highBound === null || cat.highBound === undefined) ? Number.MAX_VALUE : (cat.highBound || 0);
                        if (freq >= low && freq <= high) return cat.name;
                    }
                    return '';
                };

                // ── Table 1: Hazard Identification ──
                const createHazardIdentificationHTML = () => {
                    const leaves = collectLeafHazardsWithPath(hazardList);
                    if (leaves.length === 0) return '<p><em>No hazards defined.</em></p>';

                    const thStyle = 'padding:4px 6px;text-align:center;background:#667eea;color:#fff;font-weight:bold;font-size:8.5pt;border:1px solid #5a67d8;';
                    const tdStyle = (screened) => `padding:3px 5px;font-size:8.5pt;border:1px solid #ddd;vertical-align:top;color:${screened ? '#6b7280' : '#111827'};`;

                    // Group leaves by Level 1
                    const groups = {};
                    const groupOrder = [];
                    leaves.forEach(item => {
                        if (!groups[item.level1]) { groups[item.level1] = []; groupOrder.push(item.level1); }
                        groups[item.level1].push(item);
                    });

                    let html = '';
                    groupOrder.forEach(l1 => {
                        html += `<h3 style="color:#2c3e50;margin-top:18px;margin-bottom:6px;">${l1} Identification Table</h3>`;
                        html += '<table style="border-collapse:collapse;width:100%;margin:0 0 12px 0;">';
                        html += '<thead><tr>';
                        html += `<th style="${thStyle}width:14%;">Hazard</th>`;
                        html += `<th style="${thStyle}width:15%;">Threat or Cause</th>`;
                        html += `<th style="${thStyle}width:15%;">Worst Case Consequences</th>`;
                        html += `<th style="${thStyle}width:19%;">Hazardous Event and Effects</th>`;
                        html += `<th style="${thStyle}width:33%;">Design / Safeguard / Mitigation</th>`;
                        html += `<th style="${thStyle}width:6%;">Screened?</th>`;
                        html += '</tr></thead><tbody>';

                        groups[l1].forEach(({ hazard, path }) => {
                            const info = hazardInfo[hazard.id] || {};
                            const allScreened = operatingStates.every(s => (hazardStates[`${hazard.id}_${s.id}`] || 'unanalyzed') === 'screened');
                            const td = tdStyle(allScreened);

                            // Design/Safeguard/Mitigation from SF SSC entries (with notes)
                            const mitigations = [];
                            safetyFunctions.forEach(sf => {
                                const sfData = safetyFunctionAnalysisData[`${hazard.id}_${sf.id}`];
                                if (sfData && sfData.status === 'included' && sfData.sscEntries) {
                                    sfData.sscEntries.forEach(e => {
                                        if (e.supports) {
                                            const ssc = sscActions.find(s => s.id === e.sscId);
                                            if (ssc) mitigations.push({ label: `${ssc.id}: ${ssc.name}`, notes: (e.notes || '').trim() });
                                        }
                                    });
                                }
                            });
                            const mitigationText = mitigations.length > 0
                                ? mitigations.map(m => {
                                    const notesHTML = m.notes ? `<div style="margin-left:10px;font-size:7.5pt;color:#555;font-style:italic;">${m.notes}</div>` : '';
                                    return `<div style="margin:2px 0;">• ${m.label}${notesHTML}</div>`;
                                }).join('')
                                : `<span style="color:#9ca3af;font-style:italic;">None identified</span>`;

                            // Level 4 name only
                            const leafName = path[path.length - 1];

                            html += '<tr>';
                            html += `<td style="${td}">${leafName}</td>`;
                            html += `<td style="${td}">${info.threatOrCause || ''}</td>`;
                            html += `<td style="${td}">${info.worstCaseConsequences || ''}</td>`;
                            html += `<td style="${td}">${info.hazardousEventAndEffects || ''}</td>`;
                            html += `<td style="${td}">${mitigationText}</td>`;
                            // Screened cell: "Yes" in red, "No" in green
                            const screenedCellColor = allScreened ? '#dc2626' : '#059669';
                            html += `<td style="${td}text-align:center;font-weight:bold;color:${screenedCellColor};">${allScreened ? 'Yes' : 'No'}</td>`;
                            html += '</tr>';
                        });

                        html += '</tbody></table>';
                    });
                    return html;
                };
                // ── Table 2: Hazard Qualitative Likelihood Classification ──
                const createHazardQualitativeHTML = () => {
                    const leaves = collectLeafHazardsWithPath(hazardList);
                    if (leaves.length === 0) return '<p><em>No hazards defined.</em></p>';

                    const thStyle = 'padding:4px 6px;text-align:center;background:#667eea;color:#fff;font-weight:bold;font-size:8.5pt;border:1px solid #5a67d8;';
                    const th2Style = 'padding:3px 5px;text-align:center;background:#818cf8;color:#fff;font-weight:bold;font-size:8pt;border:1px solid #6366f1;';
                    const tdStyle = (screened) => `padding:3px 5px;font-size:8.5pt;border:1px solid #ddd;vertical-align:top;color:${screened ? '#6b7280' : '#111827'};`;

                    // Likelihood color map — keyed by lowercase category name (partial match)
                    const getLikelihoodColor = (label) => {
                        if (!label) return null;
                        const l = label.toLowerCase();
                        if (l.includes('beyond extremely unlikely') || l.includes('beyond ext')) return { bg: '#dbeafe', color: '#1d4ed8', border: '#93c5fd' };
                        if (l.includes('extremely unlikely') || l.includes('ext. unlikely')) return { bg: '#dcfce7', color: '#15803d', border: '#86efac' };
                        if (l.includes('unlikely')) return { bg: '#fef9c3', color: '#854d0e', border: '#fde047' };
                        if (l.includes('anticipated') || l.includes('frequent') || l.includes('probable')) return { bg: '#fee2e2', color: '#b91c1c', border: '#fca5a5' };
                        return null;
                    };

                    // Returns { cellStyle, innerHTML } so caller can shade the <td> itself
                    const likelihoodCell = (label, allScreened) => {
                        if (allScreened) return { extra: '', html: '<span style="color:#9ca3af;">—</span>' };
                        if (!label) return { extra: '', html: '<span style="color:#9ca3af;font-style:italic;">—</span>' };
                        const colors = getLikelihoodColor(label);
                        if (colors) {
                            return {
                                extra: `background-color:${colors.bg};`,
                                html: `<span style="color:${colors.color};font-weight:bold;font-size:8pt;">${label}</span>`
                            };
                        }
                        return { extra: '', html: label };
                    };

                    // Group by Level 1
                    const groups = {};
                    const groupOrder = [];
                    leaves.forEach(item => {
                        if (!groups[item.level1]) { groups[item.level1] = []; groupOrder.push(item.level1); }
                        groups[item.level1].push(item);
                    });

                    let html = '';
                    groupOrder.forEach(l1 => {
                        const visibleHazards = groups[l1].filter(({ hazard }) =>
                            !operatingStates.every(s => (hazardStates[`${hazard.id}_${s.id}`] || 'unanalyzed') === 'screened')
                        );
                        if (visibleHazards.length === 0) return; // skip heading and table entirely if all screened

                        html += `<h3 style="color:#2c3e50;margin-top:18px;margin-bottom:6px;">${l1} Qualitative Likelihood Classification Table</h3>`;
                        html += '<table style="border-collapse:collapse;width:100%;margin:0 0 12px 0;">';
                        html += '<thead>';
                        html += '<tr>';
                        html += `<th rowspan="2" style="${thStyle}width:16%;">Hazard</th>`;
                        html += `<th colspan="2" style="${thStyle}width:14%;">Public</th>`;
                        html += `<th colspan="2" style="${thStyle}width:14%;">Co-located Worker</th>`;
                        html += `<th colspan="2" style="${thStyle}width:14%;">Facility Worker</th>`;
                        html += `<th rowspan="2" style="${thStyle}width:10%;">Ref.</th>`;
                        html += '</tr>';
                        html += '<tr>';
                        ['Public','Co-located Worker','Facility Worker'].forEach(() => {
                            html += `<th style="${th2Style}">Consequences</th><th style="${th2Style}">Likelihood</th>`;
                        });
                        html += '</tr>';
                        html += '</thead><tbody>'

                        visibleHazards.forEach(({ hazard, path }) => {
                            const qual = hazardQualitative[hazard.id] || {};
                            const td = tdStyle(false);

                            const frequency = calculateHazardFrequency(hazard.id);
                            const likelihood = getLikelihoodLabel(frequency);
                            const lCell = likelihoodCell(likelihood, false);

                            const leafName = path[path.length - 1];
                            const anchorId = `hazard-detail-${hazard.id}`;

                            html += '<tr>';
                            html += `<td style="${td}">${leafName}</td>`;
                            html += `<td style="${td}">${qual.publicConsequences || 'TBD'}</td>`;
                            html += `<td style="${td}text-align:center;${lCell.extra}">${lCell.html}</td>`;
                            html += `<td style="${td}">${qual.colocatedWorkerConsequences || 'TBD'}</td>`;
                            html += `<td style="${td}text-align:center;${lCell.extra}">${lCell.html}</td>`;
                            html += `<td style="${td}">${qual.facilityWorkerConsequences || 'TBD'}</td>`;
                            html += `<td style="${td}text-align:center;${lCell.extra}">${lCell.html}</td>`;
                            html += `<td style="${td}text-align:center;"><a href="#${anchorId}" style="color:#4f46e5;font-size:8pt;">Detail ↓</a></td>`;
                            html += '</tr>';
                        });

                        html += '</tbody></table>';
                    });
                    return html;
                };
                // ── Table 3: SSCs/Actions and Associated Safety Functions ──
                const createSscSafetyFunctionTableHTML = () => {
                    if (!projectSettings.showSafetyFunctions || safetyFunctions.length === 0 || sscActions.length === 0) return '<p><em>No safety function or SSC/Action data available.</em></p>';

                    // Collect all leaf hazards with their path
                    const collectLeaves = (nodes, path = []) => {
                        const list = [];
                        nodes.forEach(node => {
                            if (node.hidden) return;
                            const newPath = [...path, node.name];
                            if (node.children && node.children.length > 0) list.push(...collectLeaves(node.children, newPath));
                            else list.push({ hazard: node, path: newPath });
                        });
                        return list;
                    };
                    const leafHazards = collectLeaves(hazardList);

                    // Build map: sscId -> Set of { sfId, sfName, sfColor, hazardPath }
                    const sscSfMap = new Map(); // sscId -> [ { sf, hazardPath } ]
                    safetyFunctions.forEach(sf => {
                        leafHazards.forEach(({ hazard, path }) => {
                            const sfKey = `${hazard.id}_${sf.id}`;
                            const sfData = safetyFunctionAnalysisData[sfKey];
                            if (!sfData || sfData.status !== 'included') return;
                            (sfData.sscEntries || []).forEach(e => {
                                if (!e.supports) return;
                                if (!sscSfMap.has(e.sscId)) sscSfMap.set(e.sscId, []);
                                sscSfMap.get(e.sscId).push({ sf, hazardPath: path[path.length - 1] });
                            });
                        });
                    });

                    // Only include SSCs that support at least one SF
                    const activeSscs = sscActions
                        .filter(s => sscSfMap.has(s.id))
                        .sort((a, b) => (a.label || a.id).localeCompare(b.label || b.id, undefined, { numeric: true, sensitivity: 'base' }));

                    if (activeSscs.length === 0) return '<p><em>No SSC/Actions are currently marked as supporting any safety function.</em></p>';

                    const thStyle = 'padding:5px 7px;text-align:left;background:#2d3748;color:#fff;font-weight:bold;font-size:8.5pt;border:1px solid #1a202c;';
                    const tdStyle = 'padding:4px 7px;font-size:8.5pt;border:1px solid #ddd;vertical-align:top;';

                    let html = '<table style="border-collapse:collapse;width:100%;margin:0 0 16px 0;">';
                    html += '<thead><tr>';
                    html += `<th style="${thStyle}width:18%;">SSC / Action</th>`;
                    html += `<th style="${thStyle}width:20%;">Safety Function</th>`;
                    html += `<th style="${thStyle}width:62%;">Associated Hazard(s)</th>`;
                    html += '</tr></thead><tbody>';

                    activeSscs.forEach((ssc, idx) => {
                        const entries = sscSfMap.get(ssc.id) || [];
                        const rowBg = idx % 2 === 0 ? '#ffffff' : '#f8fafc';

                        // Group entries by SF so we can merge duplicate SF rows
                        const bySf = new Map();
                        entries.forEach(({ sf, hazardPath }) => {
                            if (!bySf.has(sf.id)) bySf.set(sf.id, { sf, hazards: [] });
                            // Avoid duplicate hazard paths within a SF
                            if (!bySf.get(sf.id).hazards.includes(hazardPath))
                                bySf.get(sf.id).hazards.push(hazardPath);
                        });
                        const sfEntries = Array.from(bySf.values())
                            .sort((a, b) => a.sf.id.localeCompare(b.sf.id, undefined, { numeric: true, sensitivity: 'base' }));

                        const sscLabel = ssc.id ? `<strong>${ssc.id}</strong>` : '';
                        const sscName = ssc.name ? `<span style="display:block;margin-top:1px;">${ssc.name}</span>` : '';
                        const sscDesc = ssc.description ? `<span style="display:block;font-size:7.5pt;color:#6b7280;margin-top:1px;">${ssc.description}</span>` : '';

                        sfEntries.forEach((sfEntry, sfIdx) => {
                            html += `<tr style="background:${rowBg};">`;
                            // SSC cell — only on first SF row for this SSC
                            if (sfIdx === 0) {
                                html += `<td rowspan="${sfEntries.length}" style="${tdStyle}border-right:2px solid #cbd5e1;">${sscLabel}${sscName}${sscDesc}</td>`;
                            }
                            // SF cell
                            html += `<td style="${tdStyle}">`;
                            html += `<span style="display:inline-block;background:${sfEntry.sf.color || '#e0e7ff'};padding:1px 5px;border-radius:3px;font-size:7.5pt;font-weight:bold;margin-bottom:2px;">${sfEntry.sf.id}</span>`;
                            html += `<span style="display:block;font-size:8pt;">${sfEntry.sf.name}</span>`;
                            html += '</td>';
                            // Hazards cell — group by shared parent path
                            html += `<td style="${tdStyle}">`;
                            if (sfEntry.hazards.length === 1) {
                                html += sfEntry.hazards[0];
                            } else {
                                // Group by everything except the last segment
                                const grouped = new Map();
                                sfEntry.hazards.forEach(h => {
                                    const parts = h.split(' > ');
                                    const parent = parts.length > 1 ? parts.slice(0, -1).join(' > ') : null;
                                    const leaf = parts[parts.length - 1];
                                    const key = parent || '__root__';
                                    if (!grouped.has(key)) grouped.set(key, { parent, leaves: [] });
                                    grouped.get(key).leaves.push(leaf);
                                });
                                if (grouped.size === 1) {
                                    // All share same parent — compact format
                                    const [{ parent, leaves }] = grouped.values();
                                    if (parent) {
                                        html += `${parent}: ${leaves.join('; ')}`;
                                    } else {
                                        html += leaves.join('; ');
                                    }
                                } else {
                                    // Multiple parents — one line per group
                                    html += '<ul style="margin:0;padding-left:14px;">';
                                    grouped.forEach(({ parent, leaves }) => {
                                        if (parent) {
                                            html += `<li>${parent}: ${leaves.join('; ')}</li>`;
                                        } else {
                                            leaves.forEach(l => { html += `<li>${l}</li>`; });
                                        }
                                    });
                                    html += '</ul>';
                                }
                            }
                            html += '</td>';
                            html += '</tr>';
                        });
                    });

                    html += '</tbody></table>';
                    return html;
                };

                // Helper function to create hazard details section
                const createHazardDetailsHTML = () => {
                    const collectLeafHazards = (nodes, list = [], path = []) => {
                        nodes.forEach(node => {
                            if (node.hidden) return;
                            const newPath = [...path, node.name];
                            if (node.children && node.children.length > 0) collectLeafHazards(node.children, list, newPath);
                            else list.push({ hazard: node, path: newPath });
                        });
                        return list;
                    };
                    const leafHazards = collectLeafHazards(hazardList);

                    // Helper: format occurrence for a single event
                    const fmtOccurrence = (event) => {
                        if (event.occurrenceModel === 'frequency') {
                            if (event.frequencyDistribution === 'point' && event.pointEstimate)
                                return `${formatFrequency(parseFloat(event.pointEstimate))} ${event.frequencyUnits || '/yr'}`;
                            if (event.frequencyDistribution === 'gamma' && event.gammaShape && event.gammaScale) {
                                const mean = parseFloat(event.gammaShape) * parseFloat(event.gammaScale);
                                return `${formatFrequency(mean)} ${event.frequencyUnits || '/yr'} (Gamma: α=${event.gammaShape}, θ=${event.gammaScale})`;
                            }
                            if (event.frequencyDistribution === 'lognormal' && event.lognormalMean)
                                return `${formatFrequency(parseFloat(event.lognormalMean))} ${event.frequencyUnits || '/yr'} (Lognormal: Mean=${event.lognormalMean}, EF=${event.lognormalEF || 'N/A'})`;
                            if (event.frequencyDistribution === 'cni' && event.cniMean)
                                return `${formatFrequency(parseFloat(event.cniMean))} ${event.frequencyUnits || '/yr'} (CNI: Mean=${event.cniMean})`;
                            return '—';
                        }
                        if (event.occurrenceModel === 'nureg-2169-fire') {
                            const selections = event.fireIgnitionSelections || {};
                            const selectedItems = NUREG2169_FIRE_IGNITION_DATA.filter(item => selections[item.bin]);
                            const totalTableMean = selectedItems.reduce((sum, item) => sum + item.mean, 0);
                            const componentCount = event.fireIgnitionComponentCount || 1;
                            const propagationFactor = parseFloat(event.fireIgnitionPropagationFactor) || 1;
                            const finalMean = (totalTableMean / componentCount) * propagationFactor;
                            const componentInfo = componentCount > 1 ? `, ${componentCount} components` : '';
                            const propInfo = propagationFactor !== 1 ? `, prop. factor ${propagationFactor}` : '';
                            return `NUREG-2169 Fire: ${formatFrequency(finalMean)} /yr (${selectedItems.length} sources${componentInfo}${propInfo})`;
                        }
                        if (event.occurrenceModel === 'hazard-curve') return 'Hazard Curve';
                        if (event.occurrenceModel === 'prob-per-opportunity') {
                            if (event.probabilityDistribution === 'point' && event.probPointEstimate)
                                return `${event.probPointEstimate} per opportunity`;
                            if (event.probabilityDistribution === 'cni' && event.probCniMean)
                                return `${event.probCniMean} per opportunity (CNI)`;
                            return 'Probability per opportunity';
                        }
                        if (event.occurrenceModel && event.occurrenceModel.startsWith('screened'))
                            return event.occurrenceModel.replace('screened-', 'Screened: ');
                        return event.occurrenceModel || '—';
                    };

                    const thS = 'padding:4px 6px;background:#374151;color:#fff;font-weight:bold;font-size:8pt;border:1px solid #1f2937;text-align:left;';
                    const tdS = 'padding:3px 6px;font-size:8pt;border:1px solid #e5e7eb;vertical-align:top;';

                    // Group leaf hazards by Level 1
                    const groups = new Map();
                    const groupOrder = [];
                    leafHazards.forEach(item => {
                        const l1 = item.path[0] || 'Other';
                        if (!groups.has(l1)) { groups.set(l1, []); groupOrder.push(l1); }
                        groups.get(l1).push(item);
                    });

                    let detailsHTML = '<div class="hazard-details">';
                    groupOrder.forEach(l1 => {
                        detailsHTML += `<h3 id="hazard-detail-${l1.replace(/[^a-z0-9]/gi,'_')}" style="color:#1e3a5f;margin-top:18px;margin-bottom:6px;">${l1}</h3>`;
                        detailsHTML += '<table style="border-collapse:collapse;width:100%;margin:0 0 16px 0;">';
                        detailsHTML += '<thead><tr>';
                        detailsHTML += `<th style="${thS}width:18%;">Hazard Type</th>`;
                        detailsHTML += `<th style="${thS}width:13%;">Fundamental Hazard Type</th>`;
                        detailsHTML += `<th style="${thS}width:12%;">Applicable Operating States</th>`;
                        detailsHTML += `<th style="${thS}width:15%;">Initiating Event</th>`;
                        detailsHTML += `<th style="${thS}width:18%;">Occurrence</th>`;
                        detailsHTML += `<th style="${thS}width:24%;">Notes</th>`;
                        detailsHTML += '</tr></thead><tbody>';

                        groups.get(l1).forEach(({ hazard, path }, hIdx) => {
                            // Collect all included operating state groups
                            const infoGroups = {};
                            operatingStates.forEach(state => {
                                const key = `${hazard.id}_${state.id}`;
                                const stateValue = hazardStates[key];
                                const analysisData = hazardAnalysisData[key];
                                if (stateValue === 'included' && analysisData) {
                                    const sourceStateId = analysisData.useInfoFrom || state.id;
                                    if (!infoGroups[sourceStateId]) {
                                        let sourceData = analysisData;
                                        if (analysisData.useInfoFrom) {
                                            const sourceKey = `${hazard.id}_${analysisData.useInfoFrom}`;
                                            sourceData = hazardAnalysisData[sourceKey] || analysisData;
                                        }
                                        infoGroups[sourceStateId] = { stateIds: [], analysisData: sourceData };
                                    }
                                    infoGroups[sourceStateId].stateIds.push(state.id);
                                }
                            });

                            const groups2 = Object.values(infoGroups);
                            const rowBg = hIdx % 2 === 0 ? '#ffffff' : '#f8fafc';

                            // Fundamental hazard type text (no color)
                            const hTypes = (hazardTypes[hazard.id] || []);
                            const typeText = hTypes.length > 0
                                ? hTypes.map((t, i) => { const p = t.split(' > '); return `(${i+1}) ${p[1] || p[0]} Hazard`; }).join(', ')
                                : '—';

                            // Hazard path: Level2 > Level3 > Level4 (strip Level1)
                            const subPath = path.slice(1).join(' > ') || path[0];

                            if (groups2.length === 0) {
                                // Not included in any FOS — single row
                                detailsHTML += `<tr style="background:${rowBg};">`;
                                detailsHTML += `<td style="${tdS}" id="hazard-detail-${hazard.id}"><strong>${subPath}</strong></td>`;
                                detailsHTML += `<td style="${tdS}">${typeText}</td>`;
                                detailsHTML += `<td style="${tdS}color:#9ca3af;font-style:italic;">None included</td>`;
                                detailsHTML += `<td style="${tdS}">—</td>`;
                                detailsHTML += `<td style="${tdS}">—</td>`;
                                detailsHTML += `<td style="${tdS}">—</td>`;
                                detailsHTML += '</tr>';
                            } else {
                                // Collect all rows: one per (group × event)
                                const rows = [];
                                groups2.forEach(({ stateIds, analysisData }) => {
                                    const stateNames = stateIds.map(sid => {
                                        const st = operatingStates.find(s => s.id === sid);
                                        const cd = operatingStateData[sid];
                                        return cd?.name || st?.name || sid;
                                    }).join(', ');
                                    const events = analysisData.applicableEvents || [];
                                    if (events.length === 0) {
                                        rows.push({ stateNames, eventName: '—', occurrence: '—', notes: '—' });
                                    } else {
                                        events.forEach(ev => {
                                            const hasDesc = (() => {
                                                if (!ev.description) return false;
                                                const d = document.createElement('div');
                                                d.innerHTML = ev.description;
                                                return (d.textContent || d.innerText || '').trim().length > 0;
                                            })();
                                            const notesText = hasDesc ? stripToPlainText(ev.description) : (ev.eventDescription || '—');
                                            rows.push({ stateNames, eventName: ev.name || '—', occurrence: fmtOccurrence(ev), notes: notesText });
                                        });
                                    }
                                });

                                rows.forEach((row, rIdx) => {
                                    detailsHTML += `<tr style="background:${rowBg};">`;
                                    if (rIdx === 0) {

                                            // Create canvas for the graph with higher resolution
