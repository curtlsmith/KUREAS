        // Safety Function Hazard Editor - for Unanalyzed/Screened/Included per hazard+SF
        function SafetyFunctionHazardEditor({ hazardId, hazardName, sf, existingData, sscActions, onSave, onClose, onAddSscAction, onEditSscAction, allSFAnalysisData }) {
            const key = `${hazardId}_${sf.id}`;
            const [status, setStatus] = React.useState(existingData ? (existingData.status || 'unanalyzed') : 'unanalyzed');
            const [sscEntries, setSscEntries] = React.useState(() => {
                if (existingData && existingData.sscEntries) return existingData.sscEntries;
                return sscActions.map(s => ({ sscId: s.id, supports: false, notes: '' }));
            });
            const [editingNewSsc, setEditingNewSsc] = React.useState(false);
            const [editingExistingSsc, setEditingExistingSsc] = React.useState(null);
            const [showCopyFrom, setShowCopyFrom] = React.useState(false);

            // Sync if sscActions changes (new ones added)
            React.useEffect(() => {
                setSscEntries(prev => {
                    const existing = new Map(prev.map(e => [e.sscId, e]));
                    return sscActions.map(s => existing.get(s.id) || { sscId: s.id, supports: false, notes: '' });
                });
            }, [sscActions]);

            const handleSscChange = (sscId, field, value) => {
                setSscEntries(prev => prev.map(e => e.sscId === sscId ? { ...e, [field]: value } : e));
            };

            const handleSave = () => {
                onSave(key, { status, sscEntries });
                onClose();
            };

            // Sorted SSC list: checked entries first, then unchecked
            const sortedSscActions = React.useMemo(() => {
                const entryMap = new Map(sscEntries.map(e => [e.sscId, e]));
                const alphaSort = (a, b) => (a.label || a.id).localeCompare(b.label || b.id, undefined, { numeric: true, sensitivity: 'base' });
                const checked = sscActions.filter(s => entryMap.get(s.id)?.supports).sort(alphaSort);
                const unchecked = sscActions.filter(s => !entryMap.get(s.id)?.supports).sort(alphaSort);
                return [...checked, ...unchecked];
            }, [sscActions, sscEntries]);

            // Find other hazards in the SAME safety function that are included or screened
            const copyFromCandidates = React.useMemo(() => {
                const candidates = [];
                const collectLeaves = (nodes) => {
                    nodes.forEach(n => {
                        if (n.hidden) return;
                        if (n.children && n.children.length > 0) collectLeaves(n.children);
                        else if (n.id !== hazardId) {
                            const d = allSFAnalysisData[`${n.id}_${sf.id}`];
                            if (d && d.status === 'included') {
                                candidates.push({ hazardId: n.id, hazardName: n.name, status: d.status });
                            }
                        }
                    });
                };
                collectLeaves(window.currentHazardList || []);
                return candidates;
            }, [allSFAnalysisData, hazardId, sf.id]);

            const handleCopyFrom = (fromHazardId) => {
                const srcData = allSFAnalysisData[`${fromHazardId}_${sf.id}`];
                if (!srcData || !srcData.sscEntries) return;
                const srcMap = new Map(srcData.sscEntries.map(e => [e.sscId, e]));
                setSscEntries(prev => prev.map(e => srcMap.has(e.sscId) ? { ...e, supports: srcMap.get(e.sscId).supports, notes: srcMap.get(e.sscId).notes } : e));
                if (srcData.status) setStatus(srcData.status);
                setShowCopyFrom(false);
            };

            // Get breadcrumb from window
            const getBreadcrumb = () => {
                const findPath = (nodes, targetId, path) => {
                    for (const node of nodes) {
                        const p = [...path, node.name];
                        if (node.id === targetId) return p;
                        if (node.children) { const r = findPath(node.children, targetId, p); if (r) return r; }
                    }
                    return null;
                };
                return findPath(window.currentHazardList || [], hazardId, []) || [];
            };
            const breadcrumb = getBreadcrumb();

            return (
                <div className="modal-overlay">
                    <div className="modal-content hazard-editor-modal" style={{ backgroundColor: '#ffffff', color: '#111827', display: 'flex', flexDirection: 'column' }}>
                        <div className="p-4 flex flex-col" style={{ height: '100%', overflow: 'hidden' }}>

                            {/* Header */}
                            <div className="mb-4 pb-3 border-b flex-shrink-0 flex items-start justify-between gap-4">
                                <div className="flex-1 min-w-0">
                                    <h2 className="text-xl font-bold">Safety Function Analysis</h2>
                                    <div className="mt-2 text-sm">
                                        {breadcrumb.length > 0 && (
                                            <div className="text-gray-600 mb-1">
                                                {breadcrumb.map((part, i) => (
                                                    <span key={i}>
                                                        {i > 0 && ' > '}
                                                        {i === breadcrumb.length - 1 ? (
                                                            <strong style={{ backgroundColor: '#fef9c3', padding: '1px 5px', borderRadius: '3px', border: '1px solid #fde047' }}>{part}</strong>
                                                        ) : part}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                        <div><strong>Safety Function:</strong>{' '}
                                            <span style={{ backgroundColor: sf.color, padding: '1px 6px', borderRadius: '3px' }}>{sf.id} &ndash; {sf.name}</span>
                                        </div>
                                        {sf.description && <div className="text-gray-600 mt-1 text-xs">{sf.description}</div>}
                                    </div>
                                </div>

                                {/* Copy From button — only when unanalyzed and candidates exist */}
                                {status === 'unanalyzed' && copyFromCandidates.length > 0 && (
                                    <div className="flex-shrink-0 relative">
                                        <button
                                            onClick={() => setShowCopyFrom(v => !v)}
                                            className="px-3 py-1.5 text-sm font-medium border border-indigo-400 text-indigo-700 rounded hover:bg-indigo-50"
                                            title="Copy SSC support entries from another hazard analyzed in this same Safety Function"
                                        >
                                            Copy From ▾
                                        </button>
                                        {showCopyFrom && (
                                            <div style={{ position: 'absolute', right: 0, top: '110%', zIndex: 50, background: '#fff', border: '1px solid #c7d2fe', borderRadius: '6px', boxShadow: '0 4px 12px rgba(0,0,0,0.12)', minWidth: '260px', maxHeight: '260px', overflowY: 'auto' }}>
                                                <div style={{ padding: '6px 10px', fontSize: '0.7rem', fontWeight: 600, color: '#6366f1', borderBottom: '1px solid #e0e7ff', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                                                    Copy from hazard:
                                                </div>
                                                {copyFromCandidates.map(cand => {
                                                    const statusColor = '#059669';
                                                    return (
                                                        <button
                                                            key={cand.hazardId}
                                                            onClick={() => handleCopyFrom(cand.hazardId)}
                                                            style={{ display: 'block', width: '100%', textAlign: 'left', padding: '7px 10px', background: 'none', border: 'none', cursor: 'pointer', borderBottom: '1px solid #f3f4f6', fontSize: '0.82rem' }}
                                                            className="hover:bg-indigo-50"
                                                        >
                                                            {cand.hazardName}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* SSCs or Actions */}
                            <div className="mb-4 flex-1 flex flex-col overflow-hidden">
                                <div className="flex justify-between items-center mb-2 flex-shrink-0">
                                    <label className="block text-sm font-medium">SSCs or Actions Supporting this Safety Function:</label>
                                    <button
                                        onClick={() => setEditingNewSsc(true)}
                                        className="px-3 py-1 bg-green-600 text-white text-sm rounded hover:bg-green-700"
                                    >
                                        Add SSC or Action
                                    </button>
                                </div>

                                {editingNewSsc && (
                                    <EditSscActionDialog
                                        ssc={null}
                                        onSave={(newSsc, _) => { onAddSscAction(newSsc); setEditingNewSsc(false); }}
                                        onClose={() => setEditingNewSsc(false)}
                                    />
                                )}

                                {editingExistingSsc && (
                                    <EditSscActionDialog
                                        ssc={editingExistingSsc}
                                        onSave={(updatedSsc, oldId) => { onEditSscAction(updatedSsc, oldId); setEditingExistingSsc(null); }}
                                        onClose={() => setEditingExistingSsc(null)}
                                    />
                                )}

                                <div className="flex-1 overflow-y-auto" style={{ minHeight: '100px' }}>
                                    {sscActions.length === 0 ? (
                                        <div className="text-sm text-gray-500 italic p-2">No SSCs or Actions defined. Click "Add SSC or Action" to add one to the project library.</div>
                                    ) : (
                                        <table className="w-full text-sm border-collapse">
                                            <thead className="sticky top-0 bg-white">
                                                <tr className="border-b">
                                                    <th className="text-left px-2 py-1" style={{ width: '38px' }}>Supp.</th>
                                                    <th className="text-left px-2 py-1" style={{ width: '45%' }}>SSC / Action</th>
                                                    <th className="text-left px-2 py-1">Notes on Support</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {sortedSscActions.map(ssc => {
                                                    const entry = sscEntries.find(e => e.sscId === ssc.id) || { sscId: ssc.id, supports: false, notes: '' };
                                                    const isChecked = !!entry.supports;
                                                    return (
                                                        <tr key={ssc.id} className="border-b hover:bg-gray-50" style={{ background: isChecked ? '#f0fdf4' : undefined }}>
                                                            <td className="px-2 py-1 text-center">
                                                                <input type="checkbox" checked={isChecked}
                                                                    onChange={e => handleSscChange(ssc.id, 'supports', e.target.checked)}
                                                                    className="w-4 h-4" />
                                                            </td>
                                                            <td className="px-2 py-1">
                                                                <button
                                                                    onClick={() => setEditingExistingSsc(ssc)}
                                                                    title="Click to edit this SSC/Action"
                                                                    style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', textAlign: 'left', width: '100%' }}
                                                                >
                                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '5px', flexWrap: 'wrap' }}>
                                                                        <span style={{ backgroundColor: ssc.color, padding: '1px 5px', borderRadius: '3px', fontSize: '0.75rem', textDecoration: 'underline dotted', whiteSpace: 'nowrap' }}>{ssc.id}</span>
                                                                        <span className="text-xs text-blue-600">{ssc.name}</span>
                                                                    </div>
                                                                    {ssc.description && <div className="text-xs text-gray-400 mt-0.5">{ssc.description}</div>}
                                                                </button>
                                                            </td>
                                                            <td className="px-2 py-1">
                                                                <textarea
                                                                    value={entry.notes}
                                                                    onChange={e => handleSscChange(ssc.id, 'notes', e.target.value)}
                                                                    className="w-full border rounded px-2 py-1 text-xs"
                                                                    rows={2}
                                                                    placeholder="How does this SSC/action support the safety function?"
                                                                />
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>

                            {/* Evaluation Status */}
                            <div className="mb-4 flex-shrink-0">
                                <label className="block text-sm font-medium mb-2">Evaluation Status:</label>
                                <select value={status} onChange={e => setStatus(e.target.value)} className="w-full border rounded px-3 py-2">
                                    <option value="unanalyzed">Unanalyzed</option>
                                    <option value="included">Included in Scope</option>
                                    <option value="screened">Screened</option>
                                </select>
                            </div>

                            <div className="flex gap-3 justify-end flex-shrink-0">
                                <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Tree Node Component
        function TreeNode({ node, level, hazardStates, onToggle, onStateChange }) {
            const [expanded, setExpanded] = useState(true);
            const hasChildren = node.children && node.children.length > 0;

            return (
                <div>
                    <div 
                        className="tree-node flex items-center"
                        style={{ paddingLeft: `${level * 20}px` }}
                    >
                        {hasChildren && (
                            <span 
                                onClick={() => setExpanded(!expanded)}
                                className="mr-2 cursor-pointer select-none"
                                style={{ width: '20px', display: 'inline-block' }}
                            >
                                {expanded ? '\u25BC' : '\u25B6'}
                            </span>
                        )}
                        {!hasChildren && <span style={{ width: '20px', display: 'inline-block' }}></span>}
                        <span className="font-medium">{node.name}</span>
                    </div>
                    
                    {expanded && hasChildren && (
                        <div>
                            {node.children.map((child, index) => (
                                <TreeNode
                                    key={index}
                                    node={child}
                                    level={level + 1}
                                    hazardStates={hazardStates}
                                    onToggle={onToggle}
                                    onStateChange={onStateChange}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Operating State Editor Modal Component
        function OperatingStateEditor({ stateId, stateData, defaultState, onSave, onClose, stateColor, onColorChange, onRenameState }) {
            const editorRef = useRef(null);
            const [localStateId, setLocalStateId] = useState(stateId);
            const [name, setName] = useState(stateData?.name || defaultState.name);
            const [description, setDescription] = useState(stateData?.description || defaultState.description);
            const [extendedDescription, setExtendedDescription] = useState(stateData?.extendedDescription || '');

            useEffect(() => {
                if (editorRef.current) {
                    editorRef.current.innerHTML = extendedDescription;
                }
            }, []);

            const execCommand = (command, value = null) => {
                if (editorRef.current) {
                    editorRef.current.focus();
                }
                
                if (command === 'formatBlock') {
                    document.execCommand('formatBlock', false, value);
                } else {
                    document.execCommand(command, false, value);
                }
                
                if (editorRef.current) {
                    setExtendedDescription(editorRef.current.innerHTML);
                }
            };

            const handleSave = () => {
                const editorContent = editorRef.current ? editorRef.current.innerHTML : extendedDescription;
                const newId = localStateId.trim();
                if (!newId) {
                    alert('Operating State ID cannot be empty.');
                    return;
                }
                // If ID changed, trigger rename
                if (newId !== stateId && onRenameState) {
                    onRenameState(stateId, newId);
                }
                onSave(newId, {
                    name,
                    description,
                    extendedDescription: editorContent
                });
                onClose();
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-content" style={{ maxWidth: '700px', backgroundColor: '#ffffff', color: '#111827' }}>

                            <div className="space-y-4">
                                <div className="flex gap-4">
                                    <div style={{ width: '120px' }}>
                                        <label className="block text-sm font-medium mb-1">State ID</label>
                                        <input
                                            type="text"
                                            value={localStateId}
                                            onChange={(e) => setLocalStateId(e.target.value)}
                                            className="w-full border rounded px-3 py-2"
                                            placeholder="e.g., FOS-1"
                                        />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-sm font-medium mb-1">Name</label>
                                        <input
                                            type="text"
                                            value={name}
                                            onChange={(e) => setName(e.target.value)}
                                            className="w-full border rounded px-3 py-2"
                                            placeholder="Operating state name"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Color</label>
                                        <input
                                            type="color"
                                            value={stateColor || defaultState?.color || '#93c5fd'}
                                            onChange={(e) => { if (onColorChange) onColorChange(stateId, e.target.value); }}
                                            className="w-16 h-10 border rounded cursor-pointer"
                                            title="Column header color"
                                        />
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium mb-1">Description</label>
                                    <textarea
                                        value={description}
                                        onChange={(e) => setDescription(e.target.value)}
                                        className="w-full border rounded px-3 py-2"
                                        rows={2}
                                        placeholder="Brief description of this operating state"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium mb-1">Extended Description</label>
                                    <div className="border rounded">
                                        <div className="rich-text-toolbar">
                                            <button className="toolbar-button" onClick={() => execCommand('bold')} title="Bold">
                                                <strong>B</strong>
                                            </button>
                                            <button className="toolbar-button" onClick={() => execCommand('italic')} title="Italic">
                                                <em>I</em>
                                            </button>
                                            <button className="toolbar-button" onClick={() => execCommand('underline')} title="Underline">
                                                <u>U</u>
                                            </button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'h1')} title="Heading 1">
                                                H1
                                            </button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'h2')} title="Heading 2">
                                                H2
                                            </button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'h3')} title="Heading 3">
                                                H3
                                            </button>
                                            <button className="toolbar-button" onClick={() => execCommand('formatBlock', 'p')} title="Paragraph">

                                            </button>
                                            <button className="toolbar-button" onClick={() => execCommand('insertUnorderedList')} title="Bullet List">

                                            </button>
                                        </div>
                                        <div
                                            ref={editorRef}

                                            className="rich-text-editor"
                                            style={{ minHeight: '200px', maxHeight: '300px', overflowY: 'auto' }}
                                            onInput={(e) => setExtendedDescription(e.target.innerHTML)}

                            </div>
                            
                            <div className="flex gap-3 justify-end mt-6">
                                <button
                                    onClick={onClose}

                                >
                                    Cancel

        // Main Application Component
/* ============================================================================
   WORD TEMPLATE SUPPORT (JSZip + DOMParser post-processing of the docx.js output)
   Two modes, selected in the Report dialog:
   - 'format' (Import Format): the generated report takes the template's styles, theme,
     heading numbering, and page size/margins. Nothing else from the template is copied.
   - 'merge' (Merge into Template): the template package is kept as-is (cover page,
     headers/footers, logos, TOC, boilerplate) and the generated report body is inserted at
     the {{REPORT_BODY}} placeholder paragraph (or appended at the end if absent). Text
     placeholders {{PROJECT_NAME}}, {{REPORT_DATE}}, {{GENERATED_BY}} are filled in the
     body, headers, and footers.
   ============================================================================ */
const OOXML_NS = {
    w: 'http://schemas.openxmlformats.org/wordprocessingml/2006/main',
    r: 'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
    rel: 'http://schemas.openxmlformats.org/package/2006/relationships',
    ct: 'http://schemas.openxmlformats.org/package/2006/content-types',
    wp: 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing',
    xml: 'http://www.w3.org/XML/1998/namespace'
};
const OOXML_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/';
const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const REPORT_TEMPLATE_TOKENS = ['{{REPORT_BODY}}', '{{PROJECT_NAME}}', '{{REPORT_DATE}}', '{{GENERATED_BY}}'];
const TPL_IMAGE_TYPES = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp' };

// Word-like definitions used only when the template does not define a style the report uses
// (Word omits unused built-in styles from styles.xml). Theme fonts/colors follow the template's theme.
const TPL_FALLBACK_STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="' + OOXML_NS.w + '">' +
    '<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:uiPriority w:val="10"/><w:qFormat/>' +
    '<w:pPr><w:spacing w:after="80" w:line="240" w:lineRule="auto"/><w:contextualSpacing/></w:pPr>' +
    '<w:rPr><w:rFonts w:asciiTheme="majorHAnsi" w:eastAsiaTheme="majorEastAsia" w:hAnsiTheme="majorHAnsi" w:cstheme="majorBidi"/><w:kern w:val="28"/><w:sz w:val="56"/><w:szCs w:val="56"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:uiPriority w:val="9"/><w:qFormat/>' +
    '<w:pPr><w:keepNext/><w:keepLines/><w:spacing w:before="360" w:after="80"/><w:outlineLvl w:val="0"/></w:pPr>' +
    '<w:rPr><w:rFonts w:asciiTheme="majorHAnsi" w:eastAsiaTheme="majorEastAsia" w:hAnsiTheme="majorHAnsi" w:cstheme="majorBidi"/><w:color w:val="2F5496" w:themeColor="accent1" w:themeShade="BF"/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:uiPriority w:val="9"/><w:unhideWhenUsed/><w:qFormat/>' +
    '<w:pPr><w:keepNext/><w:keepLines/><w:spacing w:before="160" w:after="80"/><w:outlineLvl w:val="1"/></w:pPr>' +
    '<w:rPr><w:rFonts w:asciiTheme="majorHAnsi" w:eastAsiaTheme="majorEastAsia" w:hAnsiTheme="majorHAnsi" w:cstheme="majorBidi"/><w:color w:val="2F5496" w:themeColor="accent1" w:themeShade="BF"/><w:sz w:val="26"/><w:szCs w:val="26"/></w:rPr></w:style>' +
    '</w:styles>';

function tplParseXml(str) {
    const doc = new DOMParser().parseFromString(str, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('The Word file contains an unreadable XML part.');
    return doc;
}
function tplSerializeXml(doc) {
    const s = new XMLSerializer().serializeToString(doc);
    return /^<\?xml/.test(s) ? s : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + s;
}
function tplEls(node, local, ns) { return Array.from(node.getElementsByTagNameNS(ns || OOXML_NS.w, local)); }
function tplIsW(node, local) { return !!node && node.nodeType === 1 && node.namespaceURI === OOXML_NS.w && node.localName === local; }
function tplChildEls(node) { return Array.from(node.childNodes).filter(n => n.nodeType === 1); }
function tplOwnParagraph(node) { let n = node.parentNode; while (n && !tplIsW(n, 'p')) n = n.parentNode; return n; }
// w:t nodes belonging to this paragraph (excludes paragraphs nested in text boxes)
function tplParagraphTexts(p) { return tplEls(p, 't').filter(t => tplOwnParagraph(t) === p); }
function tplParagraphText(p) { return tplParagraphTexts(p).map(t => t.textContent).join(''); }
async function tplReadXml(zip, path) { const f = zip.file(path); return f ? tplParseXml(await f.async('string')) : null; }
function tplHeaderFooterPaths(zip) { return Object.keys(zip.files).filter(p => /^word\/(header|footer)\d*\.xml$/.test(p)); }

/* ---- package relationships / content types ---- */
function tplRelsPath(partPath) { const i = partPath.lastIndexOf('/'); return partPath.slice(0, i + 1) + '_rels/' + partPath.slice(i + 1) + '.rels'; }
function tplResolveTarget(partPath, target) {
    if (target.charAt(0) === '/') return target.slice(1);
    const parts = partPath.split('/').slice(0, -1);
    target.split('/').forEach(seg => { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); });
    return parts.join('/');
}
async function tplReadRels(zip, partPath) {
    return (await tplReadXml(zip, tplRelsPath(partPath))) || tplParseXml('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + OOXML_NS.rel + '"/>');
}
function tplRelList(relsDoc) { return tplEls(relsDoc, 'Relationship', OOXML_NS.rel); }
function tplRelsByType(relsDoc, type) { return tplRelList(relsDoc).filter(r => r.getAttribute('Type') === OOXML_REL + type); }
function tplAddRel(relsDoc, type, target, external) {
    const ids = new Set(tplRelList(relsDoc).map(r => r.getAttribute('Id')));
    let n = 1; while (ids.has('rIdKb' + n)) n++;
    const el = relsDoc.createElementNS(OOXML_NS.rel, 'Relationship');
    el.setAttribute('Id', 'rIdKb' + n); el.setAttribute('Type', OOXML_REL + type); el.setAttribute('Target', target);
    if (external) el.setAttribute('TargetMode', 'External');
    relsDoc.documentElement.appendChild(el);
    return 'rIdKb' + n;
}
// kind 'Default' (key = file extension) or 'Override' (key = /part/name)
function tplEnsureContentType(ctDoc, kind, key, contentType) {
    const attr = kind === 'Default' ? 'Extension' : 'PartName';
    const existing = tplEls(ctDoc, kind, OOXML_NS.ct).find(e => (e.getAttribute(attr) || '').toLowerCase() === key.toLowerCase());
    if (existing) { if (kind === 'Override') existing.setAttribute('ContentType', contentType); return; }
    const el = ctDoc.createElementNS(OOXML_NS.ct, kind);
    el.setAttribute(attr, key); el.setAttribute('ContentType', contentType);
    ctDoc.documentElement.appendChild(el);
}
// Copies a document-level part (theme, numbering) from the template into the report package.
async function tplCopyPartByRelType(src, out, outCt, outDocRels, type, defaultPath, contentType) {
    const srcRel = tplRelsByType(await tplReadRels(src, 'word/document.xml'), type)[0];
    if (!srcRel) return false;
    const srcPath = tplResolveTarget('word/document.xml', srcRel.getAttribute('Target'));
    if (!src.file(srcPath) || src.file(tplRelsPath(srcPath))) return false; // missing, or has its own dependencies (e.g. picture bullets)
    const outRel = tplRelsByType(outDocRels, type)[0];
    const outPath = outRel ? tplResolveTarget('word/document.xml', outRel.getAttribute('Target')) : defaultPath;
    out.file(outPath, await src.file(srcPath).async('uint8array'));
    if (!outRel) tplAddRel(outDocRels, type, outPath.replace(/^word\//, ''));
    tplEnsureContentType(outCt, 'Override', '/' + outPath, contentType);
    return true;
}

/* ---- styles ---- */
function tplCollectStyleIds(nodes) {
    const ids = new Set();
    nodes.forEach(n => ['pStyle', 'rStyle', 'tblStyle'].forEach(tag => tplEls(n, tag).forEach(e => ids.add(e.getAttributeNS(OOXML_NS.w, 'val')))));
    return Array.from(ids).filter(Boolean);
}
function tplApplyStyleRemap(nodes, remap) {
    if (!Object.keys(remap).length) return;
    nodes.forEach(n => ['pStyle', 'rStyle', 'tblStyle'].forEach(tag => tplEls(n, tag).forEach(e => {
        const v = e.getAttributeNS(OOXML_NS.w, 'val');
        if (remap[v]) e.setAttributeNS(OOXML_NS.w, 'w:val', remap[v]);
    })));
}
// Makes every style ID the report uses resolvable in the template's styles.xml: matched by ID,
// then by style name (templates with renamed/localized IDs), else a definition is copied from the
// first source that has one (fallbacks, then docx.js defaults) along with its basedOn/next/link chain.
// Returns { reportStyleId: templateStyleId } for IDs that must be rewritten in the report body.
function tplReconcileStyles(targetDoc, sourceDocs, usedIds) {
    const index = d => { const m = {}; tplEls(d, 'style').forEach(s => { m[s.getAttributeNS(OOXML_NS.w, 'styleId')] = s; }); return m; };
    const nameOf = s => { const n = tplEls(s, 'name')[0]; return n ? (n.getAttributeNS(OOXML_NS.w, 'val') || '').toLowerCase() : ''; };
    const target = index(targetDoc);
    const targetByName = {};
    Object.keys(target).forEach(id => { const nm = nameOf(target[id]); if (nm && !(nm in targetByName)) targetByName[nm] = id; });
    const sources = sourceDocs.filter(Boolean).map(index);
    const root = tplEls(targetDoc, 'styles')[0];
    const remap = {}, copied = [];
    const ensure = (id) => {
        if (!id || target[id] || remap[id]) return;
        const src = sources.map(s => s[id]).find(Boolean);
        if (!src) return;
        const nm = nameOf(src);
        if (nm && targetByName[nm]) { remap[id] = targetByName[nm]; return; }
        const copy = targetDoc.importNode(src, true);
        root.appendChild(copy);
        target[id] = copy;
        copied.push(copy);
        ['basedOn', 'next', 'link'].forEach(tag => tplEls(copy, tag).forEach(e => ensure(e.getAttributeNS(OOXML_NS.w, 'val'))));
    };
    usedIds.forEach(ensure);
    copied.forEach(copy => ['basedOn', 'next', 'link'].forEach(tag => tplEls(copy, tag).forEach(e => {
        const v = e.getAttributeNS(OOXML_NS.w, 'val');
        if (remap[v]) e.setAttributeNS(OOXML_NS.w, 'w:val', remap[v]);
    })));
    return remap;
}

/* ---- text placeholders (tokens may be split across runs; run formatting is kept) ---- */
function tplReplaceTokens(xmlDoc, values) {
    let changed = false;
    tplEls(xmlDoc, 'p').forEach(p => {
        const ts = tplParagraphTexts(p);
        if (!ts.length || tplParagraphText(p).indexOf('{{') < 0) return;
        Object.keys(values).forEach(token => {
            const value = String(values[token]);
            for (let guard = 0; guard < 50; guard++) {
                const texts = ts.map(t => t.textContent);
                const start = texts.join('').indexOf(token);
                if (start < 0) break;
                const end = start + token.length;
                let pos = 0;
                ts.forEach((t, i) => {
                    const s = pos, e = pos + texts[i].length; pos = e;
                    if (e <= start || s >= end) return;
                    const a = Math.max(start, s) - s, b = Math.min(end, e) - s;
                    t.textContent = texts[i].slice(0, a) + (start >= s && start < e ? value : '') + texts[i].slice(b);
                    t.setAttributeNS(OOXML_NS.xml, 'xml:space', 'preserve');
                });
                changed = true;
                if (value.indexOf(token) >= 0) break;
            }
        });
    });
    return changed;
}

// Adds <w:updateFields w:val="true"/> (so Word refreshes the TOC on open) in schema order.
function tplEnsureUpdateFields(settingsDoc) {
    const root = settingsDoc.documentElement;
    if (tplEls(settingsDoc, 'updateFields').length) return;
    const after = ['hdrShapeDefaults', 'footnotePr', 'endnotePr', 'compat', 'docVars', 'rsids', 'mathPr', 'attachedSchema', 'themeFontLang', 'clrSchemeMapping',
                   'doNotIncludeSubdocsInStats', 'doNotAutoCompressPictures', 'forceUpgrade', 'captions', 'readModeInkLockDown', 'smartTagType', 'schemaLibrary',
                   'shapeDefaults', 'doNotEmbedSmartTags', 'decimalSymbol', 'listSeparator'];
    const before = tplChildEls(root).find(n => after.indexOf(n.localName) >= 0) || null;
    const el = settingsDoc.createElementNS(OOXML_NS.w, 'w:updateFields');
    el.setAttributeNS(OOXML_NS.w, 'w:val', 'true');
    root.insertBefore(el, before);
}

// Gives every bookmark in `roots` a unique w:id (document order, starting after `startAfter`), pairing each
// bookmarkEnd with the most recent open bookmarkStart of the same original id. docx.js 8.5 writes id="1" for
// every Bookmark, which breaks REF cross-references.
function tplRenumberBookmarks(roots, startAfter) {
    let next = startAfter || 0;
    const open = {};
    roots.forEach(root => [root].concat(Array.from(root.getElementsByTagName('*'))).forEach(e => {
        if (e.namespaceURI !== OOXML_NS.w || (e.localName !== 'bookmarkStart' && e.localName !== 'bookmarkEnd')) return;
        const old = e.getAttributeNS(OOXML_NS.w, 'id');
        if (e.localName === 'bookmarkStart') {
            const id = String(++next);
            (open[old] = open[old] || []).push(id);
            e.setAttributeNS(OOXML_NS.w, 'w:id', id);
        } else if (open[old] && open[old].length) {
            e.setAttributeNS(OOXML_NS.w, 'w:id', open[old].pop());
        }
    }));
    return next;
}

// No-template output: fix docx.js id quirks (duplicate drawing ids and bookmark ids).
async function finalizeReportDocx(reportBlob) {
    const out = await JSZip.loadAsync(reportBlob);
    const doc = await tplReadXml(out, 'word/document.xml');
    tplEls(doc, 'docPr', OOXML_NS.wp).forEach((e, i) => e.setAttribute('id', String(i + 1)));
    tplRenumberBookmarks([doc.documentElement], 0);
    out.file('word/document.xml', tplSerializeXml(doc));
    return out.generateAsync({ type: 'blob', mimeType: DOCX_MIME });
}

/* ---- public API ---- */
// Reads a user-selected Word document/template. Returns what both modes need; the file bytes are kept
// so each report generation starts from an unmodified copy.
async function loadWordTemplate(file) {
    if (!window.JSZip) throw new Error('Template library failed to load. Check your network connection.');
    if (!/\.(docx|dotx)$/i.test(file.name)) throw new Error('Select a Word document (.docx) or template (.dotx). Macro-enabled files are not supported.');
    const buffer = await file.arrayBuffer();
    let zip;
    try { zip = await JSZip.loadAsync(buffer); } catch (e) { throw new Error('"' + file.name + '" could not be opened as a Word file.'); }
    const doc = await tplReadXml(zip, 'word/document.xml');
    if (!doc || !zip.file('word/styles.xml')) throw new Error('"' + file.name + '" is not a valid Word document or template.');

    let page = null;
    const sects = tplEls(doc, 'sectPr');
    const sect = sects[sects.length - 1]; // body-level section = last sectPr
    if (sect) {
        const num = (el, a) => { const v = el && el.getAttributeNS(OOXML_NS.w, a); return v ? parseInt(v, 10) : undefined; };
        const sz = tplEls(sect, 'pgSz')[0], mar = tplEls(sect, 'pgMar')[0];
        page = {
            size: { width: num(sz, 'w'), height: num(sz, 'h') },
            margin: { top: num(mar, 'top'), right: num(mar, 'right'), bottom: num(mar, 'bottom'), left: num(mar, 'left'), header: num(mar, 'header'), footer: num(mar, 'footer') }
        };
    }

    const tokens = new Set();
    const scan = (xmlDoc) => tplEls(xmlDoc, 'p').forEach(p => { const txt = tplParagraphText(p); REPORT_TEMPLATE_TOKENS.forEach(t => { if (txt.indexOf(t) >= 0) tokens.add(t); }); });
    scan(doc);
    const hasBodyToken = tokens.has('{{REPORT_BODY}}');
    for (const path of tplHeaderFooterPaths(zip)) scan(await tplReadXml(zip, path));
    return { name: file.name, buffer, page, tokens: Array.from(tokens), hasBodyToken };
}

// Import Format: apply the template's styles, theme, numbering to the docx.js report.
async function applyTemplateFormat(reportBlob, tpl) {
    const out = await JSZip.loadAsync(reportBlob), src = await JSZip.loadAsync(tpl.buffer);
    const doc = await tplReadXml(out, 'word/document.xml');
    const styles = await tplReadXml(src, 'word/styles.xml');
    const remap = tplReconcileStyles(styles, [tplParseXml(TPL_FALLBACK_STYLES_XML), await tplReadXml(out, 'word/styles.xml')], tplCollectStyleIds([doc.documentElement]));
    tplApplyStyleRemap([doc.documentElement], remap);
    tplEls(doc, 'docPr', OOXML_NS.wp).forEach((e, i) => e.setAttribute('id', String(i + 1))); // docx.js repeats id="1" for every image
    tplRenumberBookmarks([doc.documentElement], 0);
    out.file('word/styles.xml', tplSerializeXml(styles));
    out.file('word/document.xml', tplSerializeXml(doc));

    const ct = await tplReadXml(out, '[Content_Types].xml'), rels = await tplReadRels(out, 'word/document.xml');
    await tplCopyPartByRelType(src, out, ct, rels, 'theme', 'word/theme/theme1.xml', 'application/vnd.openxmlformats-officedocument.theme+xml');
    await tplCopyPartByRelType(src, out, ct, rels, 'numbering', 'word/numbering.xml', 'application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml');
    out.file('[Content_Types].xml', tplSerializeXml(ct));
    out.file(tplRelsPath('word/document.xml'), tplSerializeXml(rels));
    return out.generateAsync({ type: 'blob', mimeType: DOCX_MIME });
}

// Merge into Template: insert the docx.js report body into the template package.
async function mergeReportIntoTemplate(reportBlob, tpl, tokenValues) {
    const gen = await JSZip.loadAsync(reportBlob), out = await JSZip.loadAsync(tpl.buffer);
    const genDoc = await tplReadXml(gen, 'word/document.xml'), doc = await tplReadXml(out, 'word/document.xml');
    const body = tplEls(doc, 'body')[0];
    const nodes = tplChildEls(tplEls(genDoc, 'body')[0]).filter(n => !tplIsW(n, 'sectPr'));

    // 1. Fill text placeholders in the template body, headers, footers; note the largest drawing id in use.
    let maxDrawingId = 0;
    const trackIds = (xmlDoc) => tplEls(xmlDoc, 'docPr', OOXML_NS.wp).forEach(e => { maxDrawingId = Math.max(maxDrawingId, parseInt(e.getAttribute('id'), 10) || 0); });
    tplReplaceTokens(doc, tokenValues);
    trackIds(doc);
    for (const path of tplHeaderFooterPaths(out)) {
        const part = await tplReadXml(out, path);
        trackIds(part);
        if (tplReplaceTokens(part, tokenValues)) out.file(path, tplSerializeXml(part));
    }

    // 2. Styles used by the report body.
    const styles = await tplReadXml(out, 'word/styles.xml');
    const remap = tplReconcileStyles(styles, [tplParseXml(TPL_FALLBACK_STYLES_XML), await tplReadXml(gen, 'word/styles.xml')], tplCollectStyleIds(nodes));
    tplApplyStyleRemap(nodes, remap);
    out.file('word/styles.xml', tplSerializeXml(styles));

    // 3. Relationships referenced by the report body (chart images): copy media, re-key rIds.
    const genRels = tplRelList(await tplReadRels(gen, 'word/document.xml'));
    const rels = await tplReadRels(out, 'word/document.xml');
    const ct = await tplReadXml(out, '[Content_Types].xml');
    const relIdMap = {};
    let mediaN = 0;
    for (const el of nodes.flatMap(n => [n].concat(Array.from(n.getElementsByTagName('*'))))) {
        for (const attr of Array.from(el.attributes)) {
            if (attr.namespaceURI !== OOXML_NS.r) continue;
            const oldId = attr.value;
            if (!(oldId in relIdMap)) {
                relIdMap[oldId] = null;
                const gRel = genRels.find(r => r.getAttribute('Id') === oldId);
                if (gRel) {
                    const type = gRel.getAttribute('Type').replace(OOXML_REL, '');
                    const target = gRel.getAttribute('Target');
                    if (gRel.getAttribute('TargetMode') === 'External') {
                        relIdMap[oldId] = tplAddRel(rels, type, target, true);
                    } else {
                        const srcPath = tplResolveTarget('word/document.xml', target);
                        const ext = (srcPath.split('.').pop() || 'bin').toLowerCase();
                        let dest;
                        do { mediaN++; dest = 'word/media/kureas_report_' + mediaN + '.' + ext; } while (out.file(dest));
                        out.file(dest, await gen.file(srcPath).async('uint8array'));
                        tplEnsureContentType(ct, 'Default', ext, TPL_IMAGE_TYPES[ext] || 'application/octet-stream');
                        relIdMap[oldId] = tplAddRel(rels, type, dest.replace(/^word\//, ''));
                    }
                }
            }
            if (relIdMap[oldId]) el.setAttributeNS(attr.namespaceURI, attr.name, relIdMap[oldId]);
        }
    }
    out.file(tplRelsPath('word/document.xml'), tplSerializeXml(rels));

    // 4. Unique drawing ids (duplicates make Word report unreadable content).
    nodes.forEach(n => tplEls(n, 'docPr', OOXML_NS.wp).forEach(e => e.setAttribute('id', String(++maxDrawingId))));
    // Unique bookmark ids (report caption bookmarks must not collide with template bookmarks).
    let maxBookmarkId = 0;
    tplEls(doc, 'bookmarkStart').forEach(e => { maxBookmarkId = Math.max(maxBookmarkId, parseInt(e.getAttributeNS(OOXML_NS.w, 'id'), 10) || 0); });
    tplRenumberBookmarks(nodes, maxBookmarkId);

    // 5. Insert the report body.
    const imported = nodes.map(n => doc.importNode(n, true));
    const placeholder = tplEls(doc, 'p').find(p => tplParagraphText(p).indexOf('{{REPORT_BODY}}') >= 0);
    if (placeholder) {
        const parent = placeholder.parentNode;
        const pPr = tplChildEls(placeholder).find(n => tplIsW(n, 'pPr'));
        if (pPr && tplChildEls(pPr).some(n => tplIsW(n, 'sectPr'))) {
            // Placeholder paragraph carries a section break: keep it (without its text) and insert after it.
            tplChildEls(placeholder).filter(n => n !== pPr).forEach(n => placeholder.removeChild(n));
            const next = placeholder.nextSibling;
            imported.forEach(n => parent.insertBefore(n, next));
        } else {
            imported.forEach(n => parent.insertBefore(n, placeholder));
            parent.removeChild(placeholder);
            const last = tplChildEls(parent).pop();
            if (tplIsW(parent, 'tc') && !tplIsW(last, 'p')) parent.appendChild(doc.createElementNS(OOXML_NS.w, 'w:p')); // a table cell must end with a paragraph
        }
    } else {
        const sect = tplChildEls(body).filter(n => tplIsW(n, 'sectPr')).pop() || null;
        imported.forEach(n => body.insertBefore(n, sect));
    }
    out.file('word/document.xml', tplSerializeXml(doc));

    // 6. Refresh a table of contents on open.
    const hasToc = tplEls(doc, 'instrText').some(e => /\bTOC\b/.test(e.textContent)) ||
                   tplEls(doc, 'fldSimple').some(e => /\bTOC\b/.test(e.getAttributeNS(OOXML_NS.w, 'instr') || ''));
    const settingsRel = tplRelsByType(rels, 'settings')[0];
    if (hasToc && settingsRel) {
        const settingsPath = tplResolveTarget('word/document.xml', settingsRel.getAttribute('Target'));
        const settings = await tplReadXml(out, settingsPath);
        if (settings) { tplEnsureUpdateFields(settings); out.file(settingsPath, tplSerializeXml(settings)); }
    }

    // 7. A .dotx main part must be retyped for a .docx output.
    tplEls(ct, 'Override', OOXML_NS.ct).forEach(o => {
        if (/wordprocessingml\.template\.main\+xml$/.test(o.getAttribute('ContentType') || ''))
            o.setAttribute('ContentType', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml');
    });
    out.file('[Content_Types].xml', tplSerializeXml(ct));
    return out.generateAsync({ type: 'blob', mimeType: DOCX_MIME });
}

/* ============================================================================
   REPORT SECTIONS
   One canonical list drives the Report dialog, the HTML preview, the Word
   output, and the Markdown output, so all four stay in step.
   ============================================================================ */
const HA_APP_VERSION = '1.2';
const HA_REPORT_SECTIONS = [
    { key: 'description', label: 'Facility Description', heading: null, omitIfEmpty: true },

    { key: 'schedule', label: 'Anticipated Schedule', heading: 'Anticipated Schedule' },
    { key: 'hierarchy', label: 'Hazard Hierarchy', heading: 'Hazard Hierarchy' },
    { key: 'identification', label: 'Hazard Identification', heading: 'Hazard Identification' },
    { key: 'qualitative', label: 'Hazard Qualitative Likelihood Classification', heading: 'Hazard Qualitative Likelihood Classification' },
    { key: 'safetyFunctions', label: 'Safety Functions', heading: 'Safety Functions' },
    { key: 'frequencyTable', label: 'Hazard Frequency Table', heading: 'Hazard Frequency Table' },
    { key: 'details', label: 'Hazard Details', heading: 'Hazard Details' },
    { key: 'probabilities', label: 'Hazard Probabilities', heading: 'Hazard Probabilities' },
    { key: 'sscSafetyFunctions', label: 'SSCs/Actions and Associated Safety Functions', heading: 'SSCs/Actions and Associated Safety Functions' },
    { key: 'hazardPlot', label: 'Hazard Plot', heading: 'Hazard Plot' },

const defaultHaReportSections = () => HA_REPORT_SECTIONS.map(s => ({ key: s.key, label: s.label, enabled: true }));

/* ============================================================================
   HTML -> OOXML (docx.js)
   The report body is authored as HTML so the on-screen preview and the Word
   file cannot drift apart. This walks a generated fragment and emits docx.js
   block elements, which is what makes a real .docx package -- and therefore
   Word template support -- possible.
   ============================================================================ */
const HA_BLOCK_TAGS = { P: 1, DIV: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1, TABLE: 1, UL: 1, OL: 1, LI: 1, PRE: 1, HR: 1, BLOCKQUOTE: 1, CENTER: 1, SECTION: 1, ARTICLE: 1, HEADER: 1, FOOTER: 1, FIGURE: 1 };
// Section headings are Heading 1, so content headings start one level down.
const HA_HEADING_LEVEL = { H1: 'HEADING_2', H2: 'HEADING_3', H3: 'HEADING_4', H4: 'HEADING_5', H5: 'HEADING_6', H6: 'HEADING_6' };
const HA_NAMED_COLORS = { white: 'FFFFFF', black: '000000', red: 'FF0000', green: '008000', blue: '0000FF', gray: '808080', grey: '808080', orange: 'FFA500', yellow: 'FFFF00' };

function haDataUrlToBytes(dataUrl) {
    const b64 = String(dataUrl).split(',')[1] || '';
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
}

// Intrinsic size from a PNG IHDR chunk (canvas.toDataURL always gives PNG); 16:9 otherwise.
function haImageSize(bytes) {
    if (bytes.length > 24 && bytes[0] === 0x89 && bytes[1] === 0x50) {
        const rd = (o) => ((bytes[o] << 24) | (bytes[o + 1] << 16) | (bytes[o + 2] << 8) | bytes[o + 3]) >>> 0;
        const w = rd(16), h = rd(20);
        if (w > 0 && h > 0) return { width: w, height: h };
    }
    return { width: 1600, height: 900 };
}

// Inline style declarations of one element, keyed by lower-case property name.
function haStyleOf(el) {
    const out = {};
    const raw = (el && el.getAttribute && el.getAttribute('style')) || '';
    raw.split(';').forEach(decl => {
        const i = decl.indexOf(':');
        if (i < 0) return;
        out[decl.slice(0, i).trim().toLowerCase()] = decl.slice(i + 1).trim();
    });
    return out;
}

// '#2c3e50' / '#abc' / 'rgb(44,62,80)' / 'white' -> 'RRGGBB', or null when not resolvable.
function haColorHex(value) {
    if (!value) return null;
    const v = String(value).trim().toLowerCase();
    let m = v.match(/#([0-9a-f]{6})\b/);
    if (m) return m[1].toUpperCase();
    m = v.match(/#([0-9a-f]{3})\b/);
    if (m) return (m[1][0] + m[1][0] + m[1][1] + m[1][1] + m[1][2] + m[1][2]).toUpperCase();
    m = v.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (m) return [1, 2, 3].map(i => ('0' + Number(m[i]).toString(16)).slice(-2)).join('').toUpperCase();
    return HA_NAMED_COLORS[v] || null;
}

function haBackgroundHex(el) {
    const st = haStyleOf(el);
    return haColorHex(st['background-color']) || haColorHex(st.background);
}

// Left indentation carried by a block element, in twips.
function haIndentTwips(st) {
    const m = String(st['margin-left'] || st['padding-left'] || '').match(/([\d.]+)\s*px/);
    return m ? Math.round(parseFloat(m[1]) * 15) : 0;
}

// Collects TextRuns for a run of inline nodes. `fmt` carries formatting inherited from ancestors.
function haRunsFromNodes(nodes, fmt, d) {
    const parts = [];
    const walk = (node, f) => {
        if (node.nodeType === 3) {
            const text = String(node.nodeValue).replace(/\s+/g, ' ');
            if (text) parts.push({ text: text, fmt: f });
            return;
        }
        if (node.nodeType !== 1) return;
        const tag = node.tagName.toUpperCase();
        if (tag === 'BR') { parts.push({ br: true, fmt: f }); return; }
        if (tag === 'IMG' || tag === 'SCRIPT' || tag === 'STYLE') return;
        const st = haStyleOf(node);
        const next = {
            bold: f.bold || tag === 'B' || tag === 'STRONG' || /^(bold|bolder|[6-9]00)$/.test((st['font-weight'] || '').trim()),
            italics: f.italics || tag === 'I' || tag === 'EM' || (st['font-style'] || '').trim() === 'italic',
            underline: f.underline || tag === 'U' || /underline/.test(st['text-decoration'] || ''),
            color: haColorHex(st.color) || f.color,
            superScript: f.superScript || tag === 'SUP',
            subScript: f.subScript || tag === 'SUB'
        };
        Array.from(node.childNodes).forEach(c => walk(c, next));
    };
    Array.from(nodes).forEach(n => walk(n, fmt || {}));
    // Trim the outer edges so source-HTML indentation does not leak into the paragraph.
    while (parts.length && !parts[0].br && !parts[0].text.trim()) parts.shift();
    while (parts.length && !parts[parts.length - 1].br && !parts[parts.length - 1].text.trim()) parts.pop();
    if (parts.length) {
        if (!parts[0].br) parts[0].text = parts[0].text.replace(/^\s+/, '');
        const last = parts[parts.length - 1];
        if (!last.br) last.text = last.text.replace(/\s+$/, '');
    }
    return parts.filter(p => p.br || p.text).map(p => new d.TextRun({
        text: p.br ? '' : p.text,
        break: p.br ? 1 : undefined,
        bold: p.fmt.bold || undefined,
        italics: p.fmt.italics || undefined,
        underline: p.fmt.underline ? {} : undefined,
        color: p.fmt.color || undefined,
        superScript: p.fmt.superScript || undefined,
        subScript: p.fmt.subScript || undefined
    }));
}

function haParagraphFrom(nodes, ctx, env, opts) {
    const d = ctx.d;
    const options = opts || {};
    if (!String(Array.from(nodes).map(n => n.textContent || '').join('')).trim()) return null;
    const runs = haRunsFromNodes(nodes, env.fmt, d);
    if (!runs.length) return null;
    const p = { children: runs };
    if (options.heading) {
        p.heading = options.heading;
    } else {
        p.spacing = { before: 0, after: env.paraStyle ? 0 : 60 };
        if (env.paraStyle) p.style = env.paraStyle;
    }
    if (options.bullet) p.bullet = options.bullet;
    if (env.alignment && d.AlignmentType[env.alignment]) p.alignment = d.AlignmentType[env.alignment];
    if (env.indent) p.indent = { left: env.indent };
    return new d.Paragraph(p);
}

function haImageParagraph(img, ctx) {
    const d = ctx.d;
    const src = img.getAttribute('src') || '';
    if (!/^data:image\//i.test(src)) return null;
    let bytes;
    try { bytes = haDataUrlToBytes(src); } catch (e) { return null; }
    if (!bytes.length) return null;
    const natural = haImageSize(bytes);
    const attrW = parseInt(img.getAttribute('width') || '0', 10);
    const width = Math.max(48, Math.min(attrW || natural.width, ctx.maxImgPx));
    const height = Math.round(width * natural.height / Math.max(1, natural.width));
    return new d.Paragraph({
        alignment: d.AlignmentType.CENTER,
        spacing: { before: 60, after: 60 },
        children: [new d.ImageRun({ data: bytes, transformation: { width: width, height: height } })]
    });
}

// Converts one report section's HTML into docx.js block elements.
// ctx: { d, usableW (twips), maxImgPx }
function haHtmlToDocx(html, ctx) {
    const parsed = new DOMParser().parseFromString('<!DOCTYPE html><html><body>' + (html || '') + '</body></html>', 'text/html');
    return haConvertNodes(Array.from(parsed.body.childNodes), ctx, { indent: 0 });
}

function haConvertNodes(nodes, ctx, env) {
    const out = [];
    let inline = [];
    const flush = () => {
        if (!inline.length) return;
        const p = haParagraphFrom(inline, ctx, env, {});
        if (p) out.push(p);
        inline = [];
    };
    Array.from(nodes).forEach(node => {
        const tag = node.nodeType === 1 ? node.tagName.toUpperCase() : '';
        if (tag && HA_BLOCK_TAGS[tag]) {
            flush();
            haConvertBlock(node, ctx, env).forEach(el => out.push(el));
        } else if (tag === 'IMG') {
            flush();
            const p = haImageParagraph(node, ctx);
            if (p) out.push(p);
        } else {
            inline.push(node);
        }
    });
    flush();
    return out;
}

function haConvertBlock(el, ctx, env) {
    const d = ctx.d;
    const tag = el.tagName.toUpperCase();
    const st = haStyleOf(el);
    const align = (st['text-align'] || '').toLowerCase();
    const childEnv = {
        indent: (env.indent || 0) + haIndentTwips(st),
        alignment: align === 'center' ? 'CENTER' : align === 'right' ? 'RIGHT' : env.alignment,
        paraStyle: env.paraStyle,
        listLevel: env.listLevel,
        fmt: {
            bold: (env.fmt && env.fmt.bold) || /^(bold|bolder|[6-9]00)$/.test((st['font-weight'] || '').trim()),
            italics: (env.fmt && env.fmt.italics) || (st['font-style'] || '').trim() === 'italic',
            underline: env.fmt && env.fmt.underline,
            color: haColorHex(st.color) || (env.fmt && env.fmt.color)
        }
    };

    if (tag === 'HR') return [];
    if (tag === 'TABLE') return haConvertTable(el, ctx, childEnv);
    if (tag === 'PRE') {
        return String(el.textContent || '').replace(/\s+$/, '').split('\n').map(line => new d.Paragraph({
            style: childEnv.paraStyle,
            spacing: { before: 0, after: 0 },
            children: [new d.TextRun({ text: line })]
        }));
    }
    if (tag === 'UL' || tag === 'OL') {
        const level = Math.min(childEnv.listLevel == null ? 0 : childEnv.listLevel, 4);
        const out = [];
        Array.from(el.children).forEach(li => {
            if (li.tagName.toUpperCase() !== 'LI') return;
            const nested = [];
            const own = Array.from(li.childNodes).filter(n => {
                const t = n.nodeType === 1 ? n.tagName.toUpperCase() : '';
                if (t === 'UL' || t === 'OL') { nested.push(n); return false; }
                return true;
            });
            const p = haParagraphFrom(own, ctx, childEnv, { bullet: { level: level } });
            if (p) out.push(p);
            nested.forEach(sub => haConvertBlock(sub, ctx, Object.assign({}, childEnv, { listLevel: level + 1 })).forEach(e => out.push(e)));
        });
        return out;
    }
    if (HA_HEADING_LEVEL[tag]) {
        const p = haParagraphFrom(Array.from(el.childNodes), ctx, childEnv, { heading: d.HeadingLevel[HA_HEADING_LEVEL[tag]] });
        return p ? [p] : [];
    }

    const hasBlockChild = Array.from(el.children).some(c => {
        const t = c.tagName.toUpperCase();
        return HA_BLOCK_TAGS[t] || t === 'IMG';
    });
    if (hasBlockChild) return haConvertNodes(Array.from(el.childNodes), ctx, childEnv);
    const p = haParagraphFrom(Array.from(el.childNodes), ctx, childEnv, {});
    return p ? [p] : [];
}

function haConvertTable(table, ctx, env) {
    const d = ctx.d;
    const trs = Array.from(table.getElementsByTagName('tr'));
    if (!trs.length) return [];
    const cellsOf = (tr) => Array.from(tr.children).filter(c => /^T[HD]$/.test(c.tagName.toUpperCase()));
    const spanOf = (c) => Math.max(1, parseInt(c.getAttribute('colspan') || '1', 10));

    // Fixed column widths are only derivable when every cell of the first row carries a
    // percentage; a cell spanning n columns contributes its width split n ways.
    let colWidths = null;
    const pcts = [];
    let widthsKnown = true;
    cellsOf(trs[0]).forEach(c => {
        const raw = haStyleOf(c).width || c.getAttribute('width') || '';
        const m = String(raw).match(/([\d.]+)\s*%/);
        if (!m) { widthsKnown = false; return; }
        const span = spanOf(c);
        for (let i = 0; i < span; i++) pcts.push(parseFloat(m[1]) / span);
    });
    if (widthsKnown && pcts.length) {
        const sum = pcts.reduce((a, b) => a + b, 0) || 100;
        colWidths = pcts.map(p => Math.max(280, Math.round(ctx.usableW * p / sum)));
    }

    const border = { style: d.BorderStyle.SINGLE, size: 4, color: 'BFBFBF' };
    const rows = trs.map(tr => {
        const cells = cellsOf(tr);
        const isHeaderRow = !!(tr.parentNode && tr.parentNode.tagName && tr.parentNode.tagName.toUpperCase() === 'THEAD');
        const rowFill = haBackgroundHex(tr);
        // Widths are only assigned when this row's cells line up with the grid; a row that
        // inherits a vertical merge from above does not.
        const spanTotal = cells.reduce((a, c) => a + spanOf(c), 0);
        const usableWidths = !!colWidths && spanTotal === colWidths.length;
        const rowOpts = {};
        if (isHeaderRow) rowOpts.tableHeader = true;
        let col = 0;
        rowOpts.children = cells.map((cell) => {
                const isTh = cell.tagName.toUpperCase() === 'TH';
                const cellSt = haStyleOf(cell);
                const cellAlign = (cellSt['text-align'] || '').toLowerCase();
                const cellEnv = {
                    indent: 0,
                    paraStyle: 'Small_Table',
                    alignment: cellAlign === 'center' ? 'CENTER' : cellAlign === 'right' ? 'RIGHT' : null,
                    fmt: { bold: isTh, color: haColorHex(cellSt.color) || (isTh ? 'FFFFFF' : null) }
                };
                let children = haConvertNodes(Array.from(cell.childNodes), ctx, cellEnv);
                // A w:tc must end with a w:p.
                if (!children.length) children = [new d.Paragraph({ style: 'Small_Table', text: '' })];
                const span = spanOf(cell);
                const opts = {
                    children: children,
                    verticalAlign: d.VerticalAlign.TOP,
                    columnSpan: span,
                    rowSpan: Math.max(1, parseInt(cell.getAttribute('rowspan') || '1', 10))
                };
                const fill = haBackgroundHex(cell) || rowFill || (isTh ? '667EEA' : null);
                if (fill) opts.shading = { fill: fill };
                if (usableWidths) {
                    let w = 0;
                    for (let k = 0; k < span && col + k < colWidths.length; k++) w += colWidths[col + k];
                    opts.width = { size: w, type: d.WidthType.DXA };
                }
                col += span;
                return new d.TableCell(opts);
            });
        return new d.TableRow(rowOpts);
    });

    const common = { rows: rows, borders: { top: border, bottom: border, left: border, right: border, insideHorizontal: border, insideVertical: border } };
    const tbl = colWidths
        ? new d.Table(Object.assign({ width: { size: ctx.usableW, type: d.WidthType.DXA }, columnWidths: colWidths, layout: d.TableLayoutType.FIXED }, common))
        : new d.Table(Object.assign({ width: { size: 100, type: d.WidthType.PERCENTAGE } }, common));
    // Word collapses adjacent tables; a spacer paragraph keeps them separate.
    return [tbl, new d.Paragraph({ spacing: { before: 0, after: 80 }, children: [] })];
}

/* ============================================================================
   HTML -> MARKDOWN (Markdown output of the Report dialog)
   ============================================================================ */
function haTableToMarkdown(table) {
    const trs = Array.from(table.getElementsByTagName('tr'));
    if (!trs.length) return '';
    const cells = (tr) => Array.from(tr.children)
        .filter(c => /^T[HD]$/.test(c.tagName.toUpperCase()))
        .map(c => String(c.textContent || '').replace(/\s+/g, ' ').trim().replace(/\|/g, '\\|'));
    const head = cells(trs[0]);
    if (!head.length) return '';
    let md = '| ' + head.join(' | ') + ' |\n| ' + head.map(() => '---').join(' | ') + ' |\n';
    trs.slice(1).forEach(tr => { const c = cells(tr); if (c.length) md += '| ' + c.join(' | ') + ' |\n'; });
    return md + '\n';
}

function haHtmlToMarkdown(html) {
    const parsed = new DOMParser().parseFromString('<!DOCTYPE html><html><body>' + (html || '') + '</body></html>', 'text/html');
    const flat = (n) => String(n.textContent || '').replace(/\s+/g, ' ').trim();
    const out = [];
    const walk = (node) => {
        if (node.nodeType === 3) { const t = String(node.nodeValue).replace(/\s+/g, ' ').trim(); if (t) out.push(t + '\n\n'); return; }
        if (node.nodeType !== 1) return;
        const tag = node.tagName.toUpperCase();
        if (tag === 'SCRIPT' || tag === 'STYLE') return;
        if (/^H[1-6]$/.test(tag)) { const t = flat(node); if (t) out.push('#'.repeat(Math.min(6, parseInt(tag[1], 10) + 2)) + ' ' + t + '\n\n'); return; }
        if (tag === 'IMG') { out.push('*(figure: ' + (node.getAttribute('alt') || 'image') + ')*\n\n'); return; }
        if (tag === 'TABLE') { out.push(haTableToMarkdown(node)); return; }
        if (tag === 'UL' || tag === 'OL') {
            Array.from(node.children).forEach((li, i) => { const t = flat(li); if (t) out.push((tag === 'OL' ? (i + 1) + '. ' : '- ') + t + '\n'); });
            out.push('\n');
            return;
        }
        if (tag === 'PRE') { out.push(String(node.textContent || '').trim() + '\n\n'); return; }
        if (tag === 'BR') return;
        const hasBlock = Array.from(node.children).some(c => {
            const t = c.tagName.toUpperCase();
            return HA_BLOCK_TAGS[t] || t === 'IMG';
        });
        if (hasBlock) { Array.from(node.childNodes).forEach(walk); return; }
        const t = flat(node);
        if (t) out.push(t + '\n\n');
    };
    Array.from(parsed.body.childNodes).forEach(walk);
    return out.join('').replace(/\n{3,}/g, '\n\n');
}

function buildHaReportMarkdown(parts) {
    let md = '# ' + parts.title + '\n\n';
    parts.sections.forEach(s => {
        if (s.heading) md += '## ' + s.heading + '\n\n';
        md += haHtmlToMarkdown(s.html);
        if (!/\n\n$/.test(md)) md += '\n\n';
    });
    return md.replace(/\n{3,}/g, '\n\n');
}

/* ============================================================================
   WORD REPORT GENERATION
   templateOpts: { mode: 'none' | 'format' | 'merge', template } -- template
   from loadWordTemplate().
   ============================================================================ */
async function generateHazardReportDocx(facilityName, parts, filename, templateOpts) {
    const d = window.docx;
    if (!d) return { ok: false, message: 'Report library failed to load. Check your network connection.' };

    const tpl = templateOpts && templateOpts.mode !== 'none' ? templateOpts.template : null;
    const tplMode = tpl ? templateOpts.mode : 'none';
    if (tpl && !window.JSZip) return { ok: false, message: 'Template library failed to load. Check your network connection.' };
    const pg = tpl && tpl.page;
    const usableW = (pg && pg.size.width && pg.margin.left != null && pg.margin.right != null)
        ? pg.size.width - pg.margin.left - pg.margin.right
        : 9026; // docx.js default page less 1 in margins
    const ctx = { d: d, usableW: usableW, maxImgPx: Math.round(usableW / 15) };

    const children = [];
    // In merge mode a template that places {{PROJECT_NAME}} supplies its own title block.
    if (!(tplMode === 'merge' && tpl.tokens.indexOf('{{PROJECT_NAME}}') >= 0)) {
        children.push(new d.Paragraph({ text: parts.title, heading: d.HeadingLevel.TITLE }));
    }
    parts.sections.forEach(s => {
        if (s.heading) children.push(new d.Paragraph({ text: s.heading, heading: d.HeadingLevel.HEADING_1 }));
        haHtmlToDocx(s.html, ctx).forEach(el => children.push(el));
    });
    if (parts.footer) haHtmlToDocx(parts.footer, ctx).forEach(el => children.push(el));

    const doc = new d.Document({
        styles: {
            // Text inside all report tables (9 pt, no paragraph spacing). Keeping this in a
            // style rather than on each run lets a Word template control it.
            paragraphStyles: [
                { id: 'Small_Table', name: 'Small_Table', basedOn: 'Normal', next: 'Small_Table', quickFormat: true,
                  run: { size: 18 }, paragraph: { spacing: { before: 0, after: 0, line: 240 } } }
            ]
        },
        sections: [Object.assign({}, (tplMode === 'format' && pg ? { properties: { page: pg } } : {}), { children: children })]
    });

    let blob = await d.Packer.toBlob(doc);
    if (tplMode === 'none' && window.JSZip) blob = await finalizeReportDocx(blob);
    else if (tplMode === 'format') blob = await applyTemplateFormat(blob, tpl);
    else if (tplMode === 'merge') blob = await mergeReportIntoTemplate(blob, tpl, {
        '{{PROJECT_NAME}}': facilityName || 'Hazard Analysis',
        '{{REPORT_DATE}}': new Date().toLocaleDateString(),
        '{{GENERATED_BY}}': 'KUREAS-HA v' + HA_APP_VERSION
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = (filename || 'Hazard-Analysis') + '.docx';
    link.click();
    URL.revokeObjectURL(url);
    return { ok: true };
}

/* ============================================================================
   REPORT DIALOG
   Section selection/order, output choice (Preview / Word / Markdown), and Word
   template options. Mirrors the KUREAS-BAYES Report dialog.
   ============================================================================ */
function HazardReportModal({ facilityName, buildReport, onClose }) {
    const [sections, setSections] = useState(defaultHaReportSections);
    const [outputMode, setOutputMode] = useState('preview'); // 'preview' | 'word' | 'markdown'
    const [fileName, setFileName] = useState(() => ('Hazard-Analysis-' + (facilityName || 'Report')).replace(/[^a-zA-Z0-9_\- ]/g, '').replace(/\s+/g, '-') || 'Hazard-Analysis');
    const [generating, setGenerating] = useState(false);
    const [error, setError] = useState('');
    const [previewHTML, setPreviewHTML] = useState('');
    const [templateMode, setTemplateMode] = useState('none'); // 'none' | 'format' | 'merge'
    const [template, setTemplate] = useState(null);

    const handleTemplatePick = async (e) => {
        const file = e.target.files[0];
        e.target.value = ''; // allow re-selecting the same file
        if (!file) return;
        try { setTemplate(await loadWordTemplate(file)); setError(''); }
        catch (err) { setTemplate(null); setError('Template error: ' + err.message); }
    };

    const toggleSection = (idx) => setSections(prev => prev.map((s, i) => i === idx ? Object.assign({}, s, { enabled: !s.enabled }) : s));
    const moveSection = (idx, dir) => setSections(prev => {
        const next = prev.slice();
        const target = idx + dir;
        if (target < 0 || target >= next.length) return prev;
        const tmp = next[idx]; next[idx] = next[target]; next[target] = tmp;
        return next;
    });

    const downloadWord = async () => {
        if (templateMode !== 'none' && !template) return { ok: false, message: 'Choose a Word template file, or set Word Template to None.' };

                            </div>

                    </div>

                    <label className="block text-sm font-medium mb-2">Output</label>
                    <div className="flex gap-2 mb-4">
                        {[['preview', 'Preview'], ['word', 'Word'], ['markdown', 'Markdown']].map(([key, label]) => (

                    <div className="flex justify-end gap-2 mt-6">

}

            const [hazardFilter, setHazardFilter] = useState({ hideAllScreened: false, showOnlyCategories: [], searchText: '', showMaxLevel: 0 });
            const [showReportDialog, setShowReportDialog] = useState(false);
            const [editingSafetyFunction, setEditingSafetyFunction] = useState(null); // { sfId } or { sfId: null } for new
            const [editingSFHazard, setEditingSFHazard] = useState(null); // { hazardId, hazardName, sfId }
            const [notesDialog, setNotesDialog] = useState(null); // { hazardId, hazardName, notes: [{stateId, stateName, stateColor, events}] }
            const [hazardTypes, setHazardTypes] = useState({}); // { hazardId: ['Kinetic Energy > Electrical', ...] }
            const [editingHazardType, setEditingHazardType] = useState(null); // { hazardId, hazardName }
            const [hazardInfo, setHazardInfo] = useState({}); // { hazardId: { threatOrCause, worstCaseConsequences, hazardousEventAndEffects } }
            const [hazardQualitative, setHazardQualitative] = useState({}); // { hazardId: { publicConsequences, colocatedWorkerConsequences, facilityWorkerConsequences } }
            const [settings, setSettings] = useState({ 
                background: 'grey',
                fontSize: 'medium',
                fontFamily: 'sans-serif',
                frequencyDigits: 2,
                stateColors: {
                    'FOS-1': '#93c5fd',
                    'FOS-2': '#fca5a5',

                },
