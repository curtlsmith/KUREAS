/* ============================================================================
   POSTERIOR SUMMARY DISPLAY
   ============================================================================ */
// Small line-chart rendering of the posterior PDF, sampled across a sensible range
// around the distribution's mass (roughly 0 to 1.5x the 95th percentile).
// Computes the PDF value at x for either a computed posterior ({kind:'beta',alpha,beta} or
// {kind:'gamma',shape,scale}) or an effective prior descriptor from buildEffectivePrior
// ({kind:'beta',alpha,beta} or {kind:'gamma',shape,rate}).
function computePdfAt(dist, x) {
    if (!dist || !window.jStat) return 0;
    try {
        if (dist.kind === 'beta') {
            return window.jStat.beta.pdf(Math.min(Math.max(x, 1e-9), 1 - 1e-9), dist.alpha, dist.beta);
        }
        const scale = dist.scale != null ? dist.scale : (dist.rate > 0 ? 1 / dist.rate : Infinity);
        if (!isFinite(scale)) return 0; // improper (rate=0) Jeffreys prior has no finite pdf to plot
        return window.jStat.gamma.pdf(Math.max(x, 1e-9), dist.shape, scale);
    } catch (e) { return 0; }
}

// Small line-chart rendering of the posterior PDF (and, optionally, the prior PDF for
// comparison), sampled across a sensible range around the posterior's mass (roughly 0 to
// 1.5x the 95th percentile).
function DistributionChart({ posterior, priorDist, xAxisLabel }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);

    useEffect(() => {
        if (!canvasRef.current || !window.Chart || !window.jStat || !posterior) return;
        const isBeta = posterior.kind === 'beta';
        let xMax = (posterior.p95 != null && isFinite(posterior.p95)) ? posterior.p95 * 1.5 : (posterior.mean * 4 || 1);
        if (isBeta) xMax = Math.min(xMax, 1);
        if (!(xMax > 0)) xMax = 1;
        const N = 80;
        const xs = [], ysPost = [], ysPrior = [];
        for (let i = 0; i <= N; i++) {
            const x = (xMax * i) / N;
            xs.push(x);
            ysPost.push(computePdfAt(posterior, x));
            if (priorDist) ysPrior.push(computePdfAt(priorDist, x));
        }

        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        const ctx = canvasRef.current.getContext('2d');
        const datasets = [{
            label: 'Posterior', data: ysPost, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.12)',
            fill: true, pointRadius: 0, borderWidth: 1.5, tension: 0.25
        }];
        if (priorDist) {
            datasets.push({
                label: 'Prior', data: ysPrior, borderColor: '#9333ea', backgroundColor: 'transparent',
                borderDash: [4, 3], fill: false, pointRadius: 0, borderWidth: 1.5, tension: 0.25
            });
        }
        const theme = chartThemeColors();
        chartRef.current = new window.Chart(ctx, {
            type: 'line',
            data: { labels: xs.map(x => formatValue(x, 2)), datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                animation: false,
                plugins: {
                    legend: { display: !!priorDist, align: 'start', labels: { boxWidth: 12, font: { size: 9 }, color: theme.text } },
                    tooltip: { enabled: false }
                },
                scales: {
                    x: { ticks: { maxTicksLimit: 4, font: { size: 9 }, color: theme.text }, title: { display: !!xAxisLabel, text: xAxisLabel || '', font: { size: 10 }, color: theme.text }, grid: { color: theme.grid } },
                    y: { display: true, ticks: { display: false }, title: { display: true, text: 'pdf', font: { size: 9 }, color: theme.text }, grid: { color: theme.grid } }
                }
            }
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
    }, [posterior, priorDist, xAxisLabel]);

    return <div style={{ height: '100%', minHeight: '220px', width: '100%', position: 'relative' }}><canvas ref={canvasRef}></canvas></div>;
}

function PosteriorSummary({ prior, failureMode, units, operationalData }) {
    const fmInfo = getFailureModeInfo(failureMode);
    const model = fmInfo.model;
    const posterior = useMemo(() => computePosterior(prior, model, operationalData, units), [prior, model, operationalData, units]);
    const effectivePrior = useMemo(() => buildEffectivePrior(prior, model), [prior, model]);
    const [showPrior, setShowPrior] = useState(false);
    if (!posterior) {
        return <div className="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded p-3">Unable to compute a posterior distribution &mdash; check that the prior is fully specified (e.g. a valid mean or shape/scale parameters).</div>;
    }
    return (
        <div className="border rounded p-4 bg-blue-50">
            <div className="mb-2">
                <span className="font-bold text-sm">Posterior Distribution &mdash; {fmInfo.paramLabel}</span>
            </div>
            <div className="flex gap-4 items-stretch">
                <div className="grid grid-cols-2 gap-x-6 gap-y-1 text-sm font-mono flex-shrink-0 content-start">
                    <div>Distribution:</div><div>{posterior.kind === 'beta' ? `Beta(${formatValue(posterior.alpha)}, ${formatValue(posterior.beta)})` : `Gamma(${formatValue(posterior.shape)}, scale=${isFinite(posterior.scale) ? formatValue(posterior.scale) : '\u221E'})`}</div>
                    <div>Mean:</div><div>{posterior.mean != null ? formatValue(posterior.mean) : '-'}</div>
                    <div>5th percentile:</div><div>{posterior.p05 != null ? formatValue(posterior.p05) : '-'}</div>
                    <div>50th percentile:</div><div>{posterior.p50 != null ? formatValue(posterior.p50) : '-'}</div>
                    <div>95th percentile:</div><div>{posterior.p95 != null ? formatValue(posterior.p95) : '-'}</div>
                    {posterior.kind === 'beta' && <React.Fragment><div>Data used:</div><div>{posterior.totalFailures || 0} failures / {posterior.totalDemands || 0} demands</div></React.Fragment>}
                    {posterior.kind === 'gamma' && <React.Fragment><div>Data used:</div><div>{posterior.totalFailures || 0} failures / {formatValue(posterior.totalTime || 0)} {units === 'perYear' ? 'Years' : 'Hours'}</div></React.Fragment>}
                    <label className="col-span-2 flex items-center gap-1.5 text-xs text-gray-600 font-sans mt-2">
                        <input type="checkbox" checked={showPrior} onChange={e => setShowPrior(e.target.checked)} disabled={!effectivePrior} />
                        Show prior distribution
                    </label>
                </div>
                <div className="flex-1 min-w-0">
                    <DistributionChart posterior={posterior} priorDist={showPrior ? effectivePrior : null} xAxisLabel={unitLabel(units)} />
                </div>
            </div>
        </div>
    );
}

/* ============================================================================
   CHANGE TRACKING / LOCKING / VERIFICATION (Quality Assurance)
   ============================================================================ */
function truncateForLog(s, max) {
    s = s == null ? '' : String(s);
    max = max || 60;
    return s.length > max ? s.slice(0, max) + '\u2026' : s;
}

function diffPlainText(label, oldV, newV) {
    oldV = oldV || ''; newV = newV || '';
    if (oldV === newV) return null;
    if (!oldV) return `${label} was added: "${truncateForLog(newV)}".`;
    if (!newV) return `${label} was removed.`;
    return `${label} changed from "${truncateForLog(oldV)}" to "${truncateForLog(newV)}".`;
}

function diffRichText(label, oldHtml, newHtml) {
    const oldText = stripHtml(oldHtml || '').trim();
    const newText = stripHtml(newHtml || '').trim();
    if (oldText === newText) {
        return ((oldHtml || '') !== (newHtml || '')) ? `${label} formatting changed.` : null;
    }
    if (!oldText) return `${label} was added: "${truncateForLog(newText)}".`;
    if (!newText) return `${label} was removed.`;
    return `${label} changed from "${truncateForLog(oldText)}" to "${truncateForLog(newText)}".`;
}

function diffHierarchyAssignment(oldH, newH, hierarchy) {
    oldH = oldH || {}; newH = newH || {};
    const messages = [];
    HIERARCHY_LEVELS.forEach(level => {
        const oldId = oldH[level + 'Id'] || NA;
        const newId = newH[level + 'Id'] || NA;
        if (oldId !== newId) {
            messages.push(`${HIERARCHY_LEVEL_LABELS[level]} changed from "${nodeName(hierarchy, level, oldId)}" to "${nodeName(hierarchy, level, newId)}".`);
        }
    });
    return messages;
}

function diffFailureMode(oldV, newV) {
    if ((oldV || '') === (newV || '')) return null;
    return `Failure Mode changed from "${getFailureModeInfo(oldV).label}" to "${getFailureModeInfo(newV).label}".`;
}

function diffUnits(oldV, newV) {
    if ((oldV || '') === (newV || '')) return null;
    return `Units changed from "${unitLabel(oldV)}" to "${unitLabel(newV)}".`;
}

function diffPrior(oldP, newP) {
    oldP = oldP || {}; newP = newP || {};
    const messages = [];
    if ((oldP.sourceType || '') !== (newP.sourceType || '')) {
        const label = v => (PRIOR_SOURCE_TYPES.find(t => t.value === v) || {}).label || v || '(none)';
        messages.push(`Prior Distribution Type changed from "${label(oldP.sourceType)}" to "${label(newP.sourceType)}".`);
    }
    if ((oldP.distributionType || '') !== (newP.distributionType || '')) {
        messages.push(`Prior distribution changed from "${oldP.distributionType || '(none)'}" to "${newP.distributionType || '(none)'}".`);
    }
    if ((oldP.mean || '') !== (newP.mean || '')) {
        messages.push(`Prior mean changed from ${oldP.mean || '(none)'} to ${newP.mean || '(none)'}.`);
    }
    if ((oldP.param1 || '') !== (newP.param1 || '')) {
        const distInfo = getDistributionInfo(newP.distributionType || oldP.distributionType);
        messages.push(`Prior ${(distInfo.param1Label || 'parameter 1').toLowerCase()} changed from ${oldP.param1 || '(none)'} to ${newP.param1 || '(none)'}.`);
    }
    if ((oldP.param2 || '') !== (newP.param2 || '')) {
        const distInfo = getDistributionInfo(newP.distributionType || oldP.distributionType);
        messages.push(`Prior ${(distInfo.param2Label || 'parameter 2').toLowerCase()} changed from ${oldP.param2 || '(none)'} to ${newP.param2 || '(none)'}.`);
    }
    if ((oldP.paperTrail?.sourceId || '') !== (newP.paperTrail?.sourceId || '')) {
        messages.push('The prior digital identifier (source) was changed.');
    }
    if ((oldP.paperTrail?.notes || '') !== (newP.paperTrail?.notes || '')) {
        messages.push('The prior digital identifier notes were changed.');
    }
    return messages;
}

const OPERATIONAL_DATA_TIME_UNIT_LABELS = { hours: 'Hours', years: 'Years' };
function diffOperationalData(oldArr, newArr) {
    const messages = [];
    const oldById = new Map((oldArr || []).map(e => [e.id, e]));
    const newById = new Map((newArr || []).map(e => [e.id, e]));
    oldById.forEach((e, id) => { if (!newById.has(id)) messages.push('An operational data entry was removed.'); });
    newById.forEach((e, id) => { if (!oldById.has(id)) messages.push('An operational data entry was added.'); });
    newById.forEach((newE, id) => {
        const oldE = oldById.get(id);
        if (!oldE) return;
        if ((oldE.demands ?? '') !== (newE.demands ?? '')) {
            messages.push(`The number of demands changed from ${oldE.demands || 0} to ${newE.demands || 0}.`);
        }
        if ((oldE.failures ?? '') !== (newE.failures ?? '')) {
            messages.push(`The number of failures changed from ${oldE.failures || 0} to ${newE.failures || 0}.`);
        }
        if ((oldE.opTime ?? '') !== (newE.opTime ?? '')) {
            messages.push(`The operational time changed from ${oldE.opTime || 0} to ${newE.opTime || 0}.`);
        }
        if ((oldE.timeUnits || '') !== (newE.timeUnits || '')) {
            messages.push(`The time units changed from "${OPERATIONAL_DATA_TIME_UNIT_LABELS[oldE.timeUnits] || oldE.timeUnits || '(none)'}" to "${OPERATIONAL_DATA_TIME_UNIT_LABELS[newE.timeUnits] || newE.timeUnits || '(none)'}".`);
        }
        if ((oldE.name || '') !== (newE.name || '')) {
            messages.push(`The data entry name changed from "${oldE.name || '(none)'}" to "${newE.name || '(none)'}".`);
        }
        if ((oldE.dataType || '') !== (newE.dataType || '')) {
            messages.push(`The data type changed from "${oldE.dataType || '(none)'}" to "${newE.dataType || '(none)'}".`);
        }
        if ((oldE.opDataType || '') !== (newE.opDataType || '')) {
            messages.push('The operational data type (demands vs. operational time) was changed.');
        }
        if ((oldE.sourceId || '') !== (newE.sourceId || '')) {
            messages.push('The digital identifier for an operational data entry was changed.');
        }
    });
    return messages;
}

function diffFsceorContent(oldSnap, newSnap, hierarchy) {
    if (!oldSnap) return [];
    const changes = [];
    const desc = diffPlainText('Description', oldSnap.description, newSnap.description); if (desc) changes.push(desc);
    const notes = diffRichText('Notes', oldSnap.notes, newSnap.notes); if (notes) changes.push(notes);
    const req = diffRichText('Requirements', oldSnap.requirements, newSnap.requirements); if (req) changes.push(req);
    changes.push(...diffHierarchyAssignment(oldSnap.hierarchy, newSnap.hierarchy, hierarchy));
    const fm = diffFailureMode(oldSnap.failureMode, newSnap.failureMode); if (fm) changes.push(fm);
    const un = diffUnits(oldSnap.units, newSnap.units); if (un) changes.push(un);
    changes.push(...diffPrior(oldSnap.prior, newSnap.prior));
    changes.push(...diffOperationalData(oldSnap.operationalData, newSnap.operationalData));
    return changes;
}

function verifyIntegrity(f) {
    if (!f.integrityHash) return { ok: true };
    if (!f.locked) return { ok: true }; // only meaningful while locked
    const currentHash = stableHash(fsceorContentSnapshot(f));
    return { ok: currentHash === f.integrityHash, currentHash };
}

// The timestamp of the most recent 'locked' lockEvent, if any -- an item can be locked/unlocked
// more than once, so this is the date it was MOST RECENTLY locked, which is what "when was this
// locked" means for an item that's currently locked (and still a reasonable answer for one that
// was locked before but has since been unlocked).
function lastLockedTimestamp(f) {
    const events = f.lockEvents || [];
    for (let i = events.length - 1; i >= 0; i--) {
        if (events[i].action === 'locked') return events[i].timestamp;
    }
    return null;
}

// Builds the complete, chronologically-ordered history for one event occurrence rate by
// merging its lock/unlock events with its detailed field-level change log entries -- the
// full time history of what happened and when, not just a count of changes.
function buildItemHistory(f) {
    const entries = [];
    (f.lockEvents || []).forEach(e => entries.push({ timestamp: e.timestamp, message: e.action === 'locked' ? 'Item locked.' : 'Item unlocked.', kind: 'lock' }));
    (f.changeLog || []).forEach(e => entries.push({ timestamp: e.timestamp, message: e.message, kind: 'change' }));
    entries.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    return entries;
}

/* ============================================================================
   TRACKED ITEMS LIST (left pane)
   ============================================================================ */
function FSCEORList({ fsceors, hierarchy, selectedId, onSelect, filterText, onFilterChange, settings }) {
    const [sortBy, setSortBy] = useState('facility'); // 'facility' | 'system' | 'component' | 'failureModeLevel'
    const shownLevels = (settings?.showHierarchyLevelsInList)
        ? HIERARCHY_LEVELS.filter(lvl => settings.showHierarchyLevelsInList[lvl] !== false)
        : HIERARCHY_LEVELS;
    const sorted = useMemo(() => {
        const withLabel = (fsceors || []).map(f => ({ f, label: hierarchyPathLabel(hierarchy, f.hierarchy || {}, shownLevels) }));
        withLabel.sort((a, b) => {
            const av = nodeName(hierarchy, sortBy, (a.f.hierarchy || {})[sortBy + 'Id']);
            const bv = nodeName(hierarchy, sortBy, (b.f.hierarchy || {})[sortBy + 'Id']);
            const aNA = av === 'N/A', bNA = bv === 'N/A';
            if (aNA !== bNA) return aNA ? 1 : -1; // unassigned sorts last
            const cmp = av.localeCompare(bv);
            return cmp !== 0 ? cmp : a.label.localeCompare(b.label);
        });
        return withLabel;
    }, [fsceors, hierarchy, sortBy, shownLevels.join(',')]);
    const filtered = sorted.filter(({ f, label }) => {
        if (!filterText.trim()) return true;
        const t = filterText.toLowerCase();
        return label.toLowerCase().includes(t) || (f.description || '').toLowerCase().includes(t) || (f.id || '').toLowerCase().includes(t);
    });
    return (
        <div className="flex flex-col h-full">
            <div className="p-2 border-b space-y-1.5">
                <input className="w-full px-2 py-1.5 border rounded text-sm" placeholder="Filter Tracked Items..." value={filterText} onChange={e => onFilterChange(e.target.value)} />
                <div className="flex items-center gap-1.5">
                    <label className="text-xs text-gray-500 flex-shrink-0">Sort by:</label>
                    <select className="flex-1 px-2 py-1 border rounded text-xs" value={sortBy} onChange={e => setSortBy(e.target.value)}>
                        {HIERARCHY_LEVELS.map(lvl => <option key={lvl} value={lvl}>{HIERARCHY_LEVEL_LABELS[lvl]}</option>)}
                    </select>
                </div>
            </div>
            <div className="flex-1 overflow-y-auto">
                {filtered.length === 0 && <div className="p-4 text-sm text-gray-400 italic">No Tracked Items match.</div>}
                {filtered.map(({ f, label }) => {
                    const integrity = verifyIntegrity(f);
                    const fmInfo = getFailureModeInfo(f.failureMode);
                    // Prefer showing what the item actually IS (its posterior mean and units) over
                    // the generic model-parameter label -- falls back to that label when a posterior
                    // can't be computed yet (e.g. an incomplete prior).
                    const posterior = computePosterior(f.prior, fmInfo.model, f.operationalData, f.units);
                    const summaryText = (posterior && posterior.mean != null && isFinite(posterior.mean))
                        ? `${formatValue(posterior.mean)} ${unitLabel(f.units)}` : fmInfo.paramLabel;
                    return (
                        <div key={f.id}
                             onClick={() => onSelect(f.id)}
                             className={`px-3 py-2 border-b cursor-pointer text-xs ${selectedId === f.id ? 'bg-blue-100' : 'hover:bg-gray-50'}`}>
                            <div className="flex items-start gap-1">
                                {f.locked ? <span title="Locked" className="flex-shrink-0 mt-0.5"><LockIcon /></span> : null}
                                {f.verification?.verified && <span title="Verified" className="text-green-600 flex-shrink-0 mt-0.5"><CheckIcon /></span>}
                                {!integrity.ok && <span title="Integrity discrepancy detected" className="text-red-600 flex-shrink-0 mt-0.5"><AlertIcon /></span>}
                                <span className="font-medium min-w-0 break-words">{label}</span>
                            </div>
                            <div className="text-xs text-gray-500 break-words">{summaryText}</div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

/* ============================================================================
   NEW EVENT OCCURRENCE RATE MODAL
   ============================================================================ */
function NewFSCEORModal({ hierarchy, priorLibrary, sources, fsceors, onHierarchyChange, onCreate, onClose }) {
    // Facility defaults to the project's only facility, if it has exactly one -- saves a click
    // on the common single-facility project, without pre-selecting anything ambiguous when
    // there's more than one (or none yet).
    const [h, setH] = useState(() => ({
        facilityId: (hierarchy.facility || []).length === 1 ? hierarchy.facility[0].id : NA,
        systemId: NA, componentId: NA, failureModeLevelId: NA
    }));
    const [failureMode, setFailureMode] = useState('2');
    const [description, setDescription] = useState('');
    const [units, setUnits] = useState('perDemand');
    const [showLibraryBrowser, setShowLibraryBrowser] = useState(false);

    // Failure Mode and Units are set together (rather than Units reacting to Failure Mode via a
    // separate effect) so the library-match effect below can override both at once without a
    // second effect immediately reverting Units back to that Failure Mode's own default.
    const handleFailureModeChange = (newFm) => { setFailureMode(newFm); setUnits(getFailureModeInfo(newFm).dataUnits); };

    // As the Hierarchy Assignment changes, check whether it matches something already brought in
    // via Import -- if so, surface the imported distribution below the selectors, and steer
    // Failure Mode/Units to match what that entry's units actually represent (its short relDB-
    // style unit code, e.g. 'd'/'h'/'hft'/'yr' -- not the canonical UNIT_OPTIONS values an
    // Excel re-import would carry, which aren't covered by this specific mapping).
    const matchedLibraryRow = findLibraryRowForAssignment(priorLibrary, hierarchy, h);
    useEffect(() => {
        if (!matchedLibraryRow) return;
        const fmu = failureModeAndUnitsForLibraryUnits(matchedLibraryRow.units);
        if (fmu) { setFailureMode(fmu.failureMode); setUnits(fmu.units); }
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [matchedLibraryRow?.id]);

    const dtMap = { beta: 'Beta', gamma: 'Gamma', lognormal: 'Lognormal', cni: 'CNI', o: 'CNI' };
    const matchedDistType = matchedLibraryRow ? (dtMap[(matchedLibraryRow.distType || '').toLowerCase()] || 'Gamma') : null;
    const matchedDistInfo = matchedDistType ? getDistributionInfo(matchedDistType) : null;

    // Bulk-create one Tracked Item per selected library row (see PriorLibraryBrowserModal),
    // finding-or-creating Hierarchy Assignment nodes to match each row's facility/system/
    // component/failure-mode text -- then closes this dialog too, since bulk add replaces
    // creating a single item here.
    const handleAddManyFromLibrary = (rows) => {
        let workingHierarchy = hierarchy;
        const newItems = rows.map(row => {
            const resolved = resolveHierarchyForLibraryRow(workingHierarchy, row);
            workingHierarchy = resolved.hierarchy;
            const fmu = failureModeAndUnitsForLibraryUnits(row.units) || { failureMode: '2', units: 'perDemand' };
            const fmInfo = getFailureModeInfo(fmu.failureMode);
            return {
                id: uid('item'), eventName: row.eventName || '', description: row.desc || '', notes: '', requirements: '',
                hierarchy: resolved.h, failureMode: fmu.failureMode, units: fmu.units,
                prior: buildPriorFromLibraryRow(row, fmInfo.model),
                operationalData: [],
                locked: false, hasBeenLocked: false, integrityHash: null, lastLockedSnapshot: null,
                lockEvents: [], changeLog: [],
                verification: { verified: false, verifiedBy: '', verifiedDate: '' }
            };
        });
        if (workingHierarchy !== hierarchy) onHierarchyChange(workingHierarchy);
        newItems.forEach(item => onCreate(item));
        onClose();
    };

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl w-full m-4 max-h-[90vh] overflow-y-auto" style={{ maxWidth: '1100px', width: 'min(1100px, 95vw)' }} onClick={e => e.stopPropagation()}>
                <div className="p-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-4">New Event Occurrence Rate</h2>
                    <p className="text-xs text-gray-500 mb-3">Assign a Facility, System, Component, and/or Failure Mode for this event occurrence rate. Set any level to N/A if it does not apply (e.g. a facility-level initiating event).</p>
                    <div className="mb-4">
                        <HierarchySelector hierarchy={hierarchy} value={h} onChange={setH} onHierarchyChange={onHierarchyChange} />
                    </div>
                    {matchedLibraryRow && (
                        <div className="mb-4 p-3 border border-blue-200 bg-blue-50 rounded text-sm text-blue-800">
                            <div className="font-medium mb-1">Matches an entry in the Imported Prior Library</div>
                            <div className="text-xs text-blue-700">
                                {matchedDistType === 'CNI'
                                    ? <React.Fragment>CNI &mdash; Mean: <span className="font-mono">{matchedLibraryRow.mean}</span></React.Fragment>
                                    : <React.Fragment>{matchedDistType} &mdash; {matchedDistInfo.param1Label}: <span className="font-mono">{matchedLibraryRow.shape}</span>, {matchedDistInfo.param2Label}: <span className="font-mono">{matchedLibraryRow.scale}</span></React.Fragment>}
                                {matchedLibraryRow.units && <React.Fragment> ({libraryUnitLabel(matchedLibraryRow.units)})</React.Fragment>}
                            </div>
                            {matchedLibraryRow.desc && <div className="text-xs text-blue-700 mt-1">{matchedLibraryRow.desc}</div>}
                            <div className="text-xs text-blue-600 mt-1">This event occurrence rate's prior will be pre-filled from this entry when created.</div>
                        </div>
                    )}
                    <div className="mb-3">
                        <label className="block text-sm font-medium mb-1">Event Description</label>
                        <textarea className="w-full px-3 py-2 border rounded text-sm" rows="2" value={description} onChange={e => setDescription(e.target.value)} placeholder="e.g. Motor-driven pump fails to start on demand" />
                    </div>
                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label className="block text-sm font-medium mb-1">Failure Mode</label>
                            <select className="w-full px-3 py-2 border rounded text-sm" value={failureMode} onChange={e => handleFailureModeChange(e.target.value)}>
                                {FAILURE_MODE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Units</label>
                            <select className="w-full px-3 py-2 border rounded text-sm" value={units} onChange={e => setUnits(e.target.value)}>
                                {unitOptionsForFailureMode(failureMode).map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                            </select>
                        </div>
                    </div>
                    <div className="flex justify-between items-center mt-4">
                        <button type="button" onClick={() => setShowLibraryBrowser(true)} className="px-4 py-2 border rounded hover:bg-gray-100 text-sm">View Entire Prior Library&hellip;</button>
                        <div className="flex gap-2">
                            <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                            <button
                                onClick={() => {
                                    // If this item's Hierarchy Assignment matches something already brought in
                                    // via Import, start its prior from that library entry (Imported Industry or
                                    // Generic Prior, source, distribution and parameters) instead of blank
                                    // Non-Informative -- the point of tracking it is to characterize it, and the
                                    // data for that is already sitting there.
                                    const prior = matchedLibraryRow ? buildPriorFromLibraryRow(matchedLibraryRow, getFailureModeInfo(failureMode).model) : { sourceType: 'noninformative' };
                                    onCreate({
                                        id: uid('item'), eventName: (matchedLibraryRow && matchedLibraryRow.eventName) || '', description: description.trim(), notes: '', requirements: '',
                                        hierarchy: h, failureMode, units,
                                        prior,
                                        operationalData: [],
                                        locked: false, hasBeenLocked: false, integrityHash: null, lastLockedSnapshot: null,
                                        lockEvents: [], changeLog: [],
                                        verification: { verified: false, verifiedBy: '', verifiedDate: '' }
                                    });
                                    onClose();
                                }}
                                className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Create Event Occurrence Rate</button>
                        </div>
                    </div>
                </div>
            </div>
            {showLibraryBrowser && (
                <PriorLibraryBrowserModal library={priorLibrary} sources={sources} fsceors={fsceors} onAddMany={handleAddManyFromLibrary} onClose={() => setShowLibraryBrowser(false)} />
            )}
        </div>
    );
}

/* ============================================================================
   VERIFY ITEM MODAL
   ============================================================================ */
function VerifyItemModal({ initialName, verifierNames, onVerify, onVerifyAndLock, onClose }) {
    const [name, setName] = useState(initialName || '');
    const [touched, setTouched] = useState(false);
    const [verifyOn] = useState(() => new Date()); // fixed at the moment the dialog opened
    const isBlank = !name.trim();

    const submit = (andLock) => {
        if (isBlank) { setTouched(true); return; }
        if (andLock) onVerifyAndLock(name.trim()); else onVerify(name.trim());
    };

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2200 }} onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl max-w-sm w-full m-4" onClick={e => e.stopPropagation()}>
                <div className="p-5">
                    <h3 className="text-base font-bold text-gray-800 mb-3">Verify Event Occurrence Rate</h3>

                    <label className="block text-xs font-medium text-gray-600 mb-1">Verify on</label>
                    <div className="w-full px-3 py-2 border rounded text-sm bg-gray-50 text-gray-600 mb-3">{verifyOn.toLocaleString()}</div>

                    <label className="block text-xs font-medium text-gray-600 mb-1">Verified by</label>
                    <input list="verifier-names-list" className="w-full px-3 py-2 border rounded text-sm" value={name}
                           onChange={e => { setName(e.target.value); setTouched(false); }}
                           placeholder="Select an existing name or enter a new one"
                           onKeyDown={e => { if (e.key === 'Enter') submit(true); if (e.key === 'Escape') onClose(); }} />
                    <datalist id="verifier-names-list">
                        {(verifierNames || []).map(n => <option key={n} value={n} />)}
                    </datalist>
                    {touched && isBlank && <p className="text-xs text-red-600 mt-1">A verifier name is required.</p>}

                    <div className="flex justify-end gap-2 mt-4">
                        <button onClick={onClose} className="px-3 py-1.5 border rounded text-sm hover:bg-gray-100">Cancel</button>
                        <button onClick={() => submit(false)} className="px-3 py-1.5 border rounded text-sm hover:bg-gray-100">Verify</button>
                        <button onClick={() => submit(true)} className="px-3 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 font-medium">Verify and Lock Item</button>
                    </div>
                </div>
            </div>
        </div>
    );
}

/* ============================================================================
   EVENT OCCURRENCE RATE DETAIL (main pane)
   ============================================================================ */
function FSCEORDetail({ fsceor, hierarchy, sources, priorLibrary, verifierNames, settings, onUpdate, onDelete, onHierarchyChange, onAddSource }) {
    const [showVerifyPrompt, setShowVerifyPrompt] = useState(false);
    const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
    const [showUnlockConfirm, setShowUnlockConfirm] = useState(false);
    const [showLockConfirm, setShowLockConfirm] = useState(false);

    if (!fsceor) {
        return <div className="flex items-center justify-center h-full text-gray-400 text-sm">Select an event occurrence rate from the list, or create a new one.</div>;
    }
    const f = fsceor;
    const fmInfo = getFailureModeInfo(f.failureMode);
    const integrity = verifyIntegrity(f);
    // Which Hierarchy Assignment levels to include in the header summary -- Settings > Show for
    // Tracked Items (same setting the Tracked Items list respects).
    const shownLevels = (settings?.showHierarchyLevelsInList)
        ? HIERARCHY_LEVELS.filter(lvl => settings.showHierarchyLevelsInList[lvl] !== false)
        : HIERARCHY_LEVELS;

    // Apply a partial content update, tracking changes if applicable, and clearing verification if content changes.
    const applyChange = (patch) => {
        const oldSnapshot = fsceorContentSnapshot(f);
        const updated = { ...f, ...patch };
        const newSnapshot = fsceorContentSnapshot(updated);
        let changeLog = f.changeLog || [];
        if (f.hasBeenLocked && !f.locked) {
            const diffs = diffFsceorContent(oldSnapshot, newSnapshot, hierarchy);
            if (diffs.length) {
                changeLog = [...changeLog, ...diffs.map(msg => ({ timestamp: new Date().toISOString(), message: msg }))];
            }
        }
        let verification = f.verification;
        if (verification && verification.verified && JSON.stringify(oldSnapshot) !== JSON.stringify(newSnapshot)) {
            verification = { ...verification, verified: false };
            changeLog = [...changeLog, { timestamp: new Date().toISOString(), message: 'Verification cleared due to content change.' }];
        }
        onUpdate({ ...updated, changeLog, verification });
    };

    // Applies a live content update WITHOUT appending a detailed change-log entry (still
    // clears verification if content actually differs, same as applyChange). Used for
    // free-typed fields whose live keystrokes should not each become a change-log entry --
    // pair with logFieldChange, called once when the field is committed (loses focus).
    const applyChangeSilent = (patch) => {
        const oldSnapshot = fsceorContentSnapshot(f);
        const updated = { ...f, ...patch };
        const newSnapshot = fsceorContentSnapshot(updated);
        let changeLog = f.changeLog || [];
        let verification = f.verification;
        if (verification && verification.verified && JSON.stringify(oldSnapshot) !== JSON.stringify(newSnapshot)) {
            verification = { ...verification, verified: false };
            changeLog = [...changeLog, { timestamp: new Date().toISOString(), message: 'Verification cleared due to content change.' }];
        }
        onUpdate({ ...updated, changeLog, verification });
    };

    // Appends a single, pre-composed change-log message (used both for discrete
    // select-driven changes and for blur-committed free-text field changes).
    const logFieldChange = (message) => {
        if (!(f.hasBeenLocked && !f.locked)) return;
        onUpdate({ ...f, changeLog: [...(f.changeLog || []), { timestamp: new Date().toISOString(), message }] });
    };

    const lockedVersionOf = (current) => {
        const snapshot = fsceorContentSnapshot(current);
        const hash = stableHash(snapshot);
        return {
            ...current, locked: true, hasBeenLocked: true, integrityHash: hash, lastLockedSnapshot: snapshot,
            lockEvents: [...(current.lockEvents || []), { action: 'locked', timestamp: new Date().toISOString() }]
        };
    };

    const toggleLock = () => {
        if (!f.locked) {
            if (!f.hasBeenLocked) {
                setShowLockConfirm(true);
            } else {
                onUpdate(lockedVersionOf(f));
            }
        } else {
            setShowUnlockConfirm(true);
        }
    };

    const performLock = () => onUpdate(lockedVersionOf(f));

    const performUnlock = () => {
        onUpdate({
            ...f, locked: false,
            lockEvents: [...(f.lockEvents || []), { action: 'unlocked', timestamp: new Date().toISOString() }]
        });
    };

    const toggleVerify = () => {
        if (f.verification?.verified) {
            onUpdate({ ...f, verification: { verified: false, verifiedBy: '', verifiedDate: '' } });
        } else {
            setShowVerifyPrompt(true);
        }
    };

    const applyVerification = (verifiedBy) => ({ ...f, verification: { verified: true, verifiedBy, verifiedDate: new Date().toISOString() } });

    return (
        <React.Fragment>
        <div className="h-full overflow-y-auto p-4 space-y-4">
            <div className="flex items-start justify-between border-b pb-2">
                <div>
                    <div className="text-sm font-medium text-gray-500 uppercase tracking-wide">{hierarchyPathLabel(hierarchy, f.hierarchy || {}, shownLevels)}</div>
                </div>
                <div className="flex gap-2 flex-shrink-0">
                    <button onClick={toggleVerify}
                            className={`flex items-center gap-1 px-3 py-1.5 rounded text-sm ${f.verification?.verified ? 'bg-green-600 text-white hover:bg-green-700' : 'border hover:bg-gray-100'}`}>
                        <CheckIcon /> {f.verification?.verified ? 'Verified Item' : 'Verify Item'}
                    </button>
                    <button onClick={toggleLock}
                            className={`flex items-center gap-1 px-3 py-1.5 rounded text-sm ${f.locked ? 'bg-gray-700 text-white hover:bg-gray-800' : 'border hover:bg-gray-100'}`}>
                        {f.locked ? <UnlockIcon /> : <LockIcon />} {f.locked ? 'Unlock Item' : 'Lock Item'}
                    </button>
                    <button onClick={() => setShowDeleteConfirm(true)} disabled={f.locked}
                            className="p-1.5 text-red-600 hover:bg-red-50 rounded disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent"
                            title={f.locked ? 'Locked items cannot be deleted' : 'Delete Event Occurrence Rate'}><TrashIcon /></button>
                </div>
            </div>

            {!integrity.ok && (
                <div className="p-3 bg-red-100 border border-red-400 text-red-700 rounded text-sm flex items-center gap-2">
                    <AlertIcon /> Integrity Discrepancy Detected: this event occurrence rate is marked locked, but its content does not match the hash recorded at the time it was locked. It may have been modified outside the application.
                </div>
            )}
            {f.verification?.verified && (
                <div className="p-2 bg-green-50 border border-green-200 text-green-700 rounded text-xs">
                    Verified by {f.verification.verifiedBy} on {new Date(f.verification.verifiedDate).toLocaleString()}
                </div>
            )}

            <fieldset disabled={f.locked} className={f.locked ? 'opacity-70' : ''}>
                <div className="space-y-4">
                    <div>
                        <HierarchySelector hierarchy={hierarchy} value={f.hierarchy || {}} onChange={(h) => applyChange({ hierarchy: h })} onHierarchyChange={onHierarchyChange} />
                    </div>

                    <div className="flex gap-3">
                        <div style={{ width: '16rem', flexShrink: 0 }}>
                            <label className="block text-sm font-medium mb-1">Event Name</label>
                            <BlurLoggedField className="w-full px-3 py-2 border rounded text-sm font-mono" value={f.eventName || ''}
                                   placeholder="e.g. NA-MOV-FTO" maxLength={EVENT_NAME_MAX_LENGTH}
                                   onChange={(v) => applyChangeSilent({ eventName: v })}
                                   onCommit={(oldV, newV) => logFieldChange(`The event name was changed from "${oldV}" to "${newV}".`)} />
                        </div>
                        <div className="flex-1">
                            <label className="block text-sm font-medium mb-1">Event Description</label>
                            <BlurLoggedField className="w-full px-3 py-2 border rounded text-sm" multiline rows="2" value={f.description || ''}
                                   onChange={(v) => applyChangeSilent({ description: v })}
                                   onCommit={() => logFieldChange('The description was modified.')} />
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        <div>
                            <label className="block text-sm font-medium mb-1">Failure Mode</label>
                            <select className="w-full px-3 py-2 border rounded text-sm" value={f.failureMode}
                                    onChange={e => applyChange({ failureMode: e.target.value, units: getFailureModeInfo(e.target.value).dataUnits })}>
                                {FAILURE_MODE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                            </select>
                            <p className="text-xs text-gray-500 mt-1">Failure Model: {fmInfo.model === 'binomial' ? 'Binomial' : 'Poisson'} &middot; Parameter: {fmInfo.paramLabel}</p>
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Units</label>
                            <select className="w-full px-3 py-2 border rounded text-sm" value={f.units} onChange={e => applyChange({ units: e.target.value })}>
                                {unitOptionsForFailureMode(f.failureMode).map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                            </select>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div className="border rounded p-3">
                <h3 className="font-bold text-sm mb-2">Prior Information</h3>
                <PriorEditor prior={f.prior} failureModel={fmInfo.model} sources={sources} priorLibrary={priorLibrary}
                             hierarchy={hierarchy} itemHierarchy={f.hierarchy}
                             onChange={(p) => applyChangeSilent({ prior: p })} onLog={logFieldChange} onAddSource={onAddSource} locked={f.locked} />
            </div>

            <div className="border rounded p-3">
                <h3 className="font-bold text-sm mb-2">Operational Data</h3>
                <OperationalDataEditor entries={f.operationalData} failureModel={fmInfo.model} sources={sources}
                                       onChange={(d) => applyChangeSilent({ operationalData: d })} onLog={logFieldChange} onAddSource={onAddSource} locked={f.locked} />
            </div>

            <PosteriorSummary prior={f.prior} failureMode={f.failureMode} units={f.units} operationalData={f.operationalData} />

            <div className="grid grid-cols-2 gap-4">
                <RichTextField label="Notes" html={f.notes} onChange={(html) => applyChange({ notes: html })} placeholder="Click to add notes..." height="100px" disabled={f.locked} />
                <RichTextField label="Requirements" html={f.requirements} onChange={(html) => applyChange({ requirements: html })} placeholder="Click to add requirements..." height="100px" disabled={f.locked} />
            </div>

            {(() => {
                const history = buildItemHistory(f);
                return history.length > 0 && (
                    <div className="border rounded">
                        <div className="p-2 bg-gray-100 border-b font-bold text-xs">History ({history.length})</div>
                        <div className="max-h-40 overflow-y-auto p-2 space-y-1">
                            {history.slice().reverse().map((c, i) => (
                                <div key={i} className={`text-xs ${c.kind === 'lock' ? 'text-gray-800 font-medium' : 'text-gray-600'}`}>
                                    <span className="text-gray-400 font-normal">{new Date(c.timestamp).toLocaleString()}</span> &mdash; {c.message}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            })()}
        </div>

        {showVerifyPrompt && (
            <VerifyItemModal initialName={f.verification?.verifiedBy || ''} verifierNames={verifierNames}
                             onVerify={(by) => { onUpdate(applyVerification(by)); setShowVerifyPrompt(false); }}
                             onVerifyAndLock={(by) => { onUpdate(lockedVersionOf(applyVerification(by))); setShowVerifyPrompt(false); }}
                             onClose={() => setShowVerifyPrompt(false)} />
        )}
        {showDeleteConfirm && (
            <ConfirmModal title="Delete Event Occurrence Rate" danger confirmLabel="Delete"
                          message="Delete this event occurrence rate? This cannot be undone."
                          onConfirm={() => onDelete(f.id)} onClose={() => setShowDeleteConfirm(false)} />
        )}
        {showUnlockConfirm && (
            <ConfirmModal title="Unlock Event Occurrence Rate" confirmLabel="Unlock"
                          message="Unlocking this event occurrence rate will be tracked in the project's change log, and any further edits will also be logged there until it is locked again. Continue?"
                          onConfirm={performUnlock} onClose={() => setShowUnlockConfirm(false)} />
        )}
        {showLockConfirm && (
            <ConfirmModal title="Lock Event Occurrence Rate" confirmLabel="Lock Item"
                          message="Locking this event occurrence rate will prevent further changes to it until it is unlocked. Once unlocked, any future changes will be tracked in the project's change log. Continue?"
                          onConfirm={performLock} onClose={() => setShowLockConfirm(false)} />
        )}
        </React.Fragment>
    );
}

/* ============================================================================
   PROJECT TEXT MODAL (tabbed: Description / Notes / Requirements)
   ============================================================================ */
function ProjectTextModal({ project, onSave, onClose }) {
    const [tab, setTab] = useState('description');
    const [showTableModal, setShowTableModal] = useState(false);
    const descRef = useRef(null), notesRef = useRef(null), reqRef = useRef(null);
    useEffect(() => {
        if (descRef.current) descRef.current.innerHTML = project.description || '';
        if (notesRef.current) notesRef.current.innerHTML = project.notes || '';
        if (reqRef.current) reqRef.current.innerHTML = project.requirements || '';
    }, []);
    const activeRef = tab === 'description' ? descRef : tab === 'notes' ? notesRef : reqRef;
    const exec = (cmd, val) => { document.execCommand(cmd, false, val || null); activeRef.current && activeRef.current.focus(); };
    const handleSave = () => {
        onSave({
            ...project,
            description: descRef.current ? descRef.current.innerHTML : project.description,
            notes: notesRef.current ? notesRef.current.innerHTML : project.notes,
            requirements: reqRef.current ? reqRef.current.innerHTML : project.requirements
        });
        onClose();
    };
    const TABS = [['description', 'Description'], ['notes', 'Notes'], ['requirements', 'Requirements']];
    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl w-full m-4 max-h-[92vh] overflow-y-auto" style={{ maxWidth: '900px' }} onClick={e => e.stopPropagation()}>
                <div className="p-6">
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold text-gray-800">Project Text</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <div className="flex border-b mb-4">
                        {TABS.map(([key, label]) => (
                            <button key={key} className={`px-4 py-2 font-medium text-sm ${tab === key ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                                    onClick={() => setTab(key)}>{label}</button>
                        ))}
                    </div>
                    <div className="rich-text-toolbar">
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('bold')}><b>B</b></button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('italic')}><i>I</i></button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('underline')}><u>U</u></button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('insertUnorderedList')}>&bull; List</button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('insertOrderedList')}>1. List</button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('formatBlock', 'h1')}>H1</button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('formatBlock', 'h2')}>H2</button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('formatBlock', 'p')}>P</button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => setShowTableModal(true)}>Table</button>
                        <button type="button" className="toolbar-button" onMouseDown={e => e.preventDefault()} onClick={() => exec('removeFormat')}>Clear</button>
                    </div>
                    <div style={{ display: tab === 'description' ? 'block' : 'none' }}>
                        <div ref={descRef} className="rich-text-editor" contentEditable={true} suppressContentEditableWarning={true}></div>
                    </div>
                    <div style={{ display: tab === 'notes' ? 'block' : 'none' }}>
                        <div ref={notesRef} className="rich-text-editor" contentEditable={true} suppressContentEditableWarning={true}></div>
                    </div>
                    <div style={{ display: tab === 'requirements' ? 'block' : 'none' }}>
                        <div ref={reqRef} className="rich-text-editor" contentEditable={true} suppressContentEditableWarning={true}></div>
                    </div>
                    <div className="flex justify-end gap-2 mt-4">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                        <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                    </div>
                </div>
            </div>
            {showTableModal && (
                <InsertTableModal onClose={() => setShowTableModal(false)} onInsert={(rows, cols) => {
                    if (rows > 0 && cols > 0) {
                        let html = '<table>';
                        for (let r = 0; r < rows; r++) { html += '<tr>'; for (let c = 0; c < cols; c++) html += '<td>&nbsp;</td>'; html += '</tr>'; }
                        html += '</table><p></p>';
                        exec('insertHTML', html);
                    }
                }} />
            )}
        </div>
    );
}
