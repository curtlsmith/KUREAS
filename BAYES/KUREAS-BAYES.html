<script type="text/babel" data-presets="custom">

function TrashIcon()  { return (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>); }
function PlusIcon()   { return (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>); }
function LockIcon()   { return (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>); }
function UnlockIcon() { return (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>); }
function CheckIcon()  { return (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"></polyline></svg>); }
function AlertIcon()  { return (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>); }

/* ============================================================================
   CONSTANTS
   ============================================================================ */
const APP_VERSION = '1.0';
const SCHEMA_VERSION = '1.0';

// "Failure Mode" options for an event occurrence rate (the parameter/model being characterized)
const FAILURE_MODE_OPTIONS = [
    { value: '2', label: 'Demand (Binomial)', model: 'binomial', paramSymbol: 'p', paramLabel: 'p (demand)', dataUnits: 'perDemand' },
    { value: '3', label: 'Fails while Operating (Poisson)', model: 'poisson', paramSymbol: '\u03BB', paramLabel: '\u03BB (/time)', dataUnits: 'perHour' },
    { value: '4', label: 'Fails while in Standby', model: 'poisson', paramSymbol: '\u03BB', paramLabel: '\u03BB (/time)', dataUnits: 'perHour' }
];
function getFailureModeInfo(fm) {
    return FAILURE_MODE_OPTIONS.find(f => f.value === String(fm)) || FAILURE_MODE_OPTIONS[0];
}
function failureModelForMode(fm) {
    return getFailureModeInfo(fm).model; // 'binomial' | 'poisson'
}

// Operational Data Type options
const OPERATIONAL_DATA_TYPE_OPTIONS = [
    { value: 'demandsAndFailures', label: 'Demands and Counts of Failure Events', appliesTo: 'binomial' },
    { value: 'timeAndFailures', label: 'Operational Time and Counts of Failure Events', appliesTo: 'poisson' }
];

// Prior distribution types (Version 1 scope)
const DISTRIBUTION_TYPES = [
    { value: 'Beta', label: 'Beta', param1Label: 'Shape (Alpha)', param2Label: 'Shape (Beta)' },
    { value: 'CNI', label: 'Constrained Non-Informative (CNI)', param1Label: 'Mean', param2Label: '(Not Used)' },
    { value: 'Gamma', label: 'Gamma', param1Label: 'Shape', param2Label: 'Rate (1/Scale)' },
    { value: 'Lognormal', label: 'Lognormal', param1Label: 'Mean', param2Label: 'Error Factor (95th/50th)' }
];
function getDistributionInfo(distType) {
    return DISTRIBUTION_TYPES.find(d => d.value.toLowerCase() === (distType || '').toLowerCase()) || DISTRIBUTION_TYPES[0];
}

// Prior information source types
const PRIOR_SOURCE_TYPES = [
    { value: 'noninformative', label: 'Non-Informative (Jeffreys)' },
    { value: 'cni', label: 'Constrained Non-Informative (CNI)' },
    { value: 'informed', label: 'Imported Industry or Generic Prior' },
    { value: 'userSpecified', label: 'User-Specified Prior Distribution' }
];

// Sentinel "source" id for a prior whose mean/distribution was typed in directly by the user
// rather than drawn from a tracked Source of Information -- offered as an extra option in the
// Digital Identifier selector for the CNI and User-Specified prior types, which have no
// meaningful external source but still need SOMETHING selected there.
const SELF_SPECIFIED_SOURCE = '__self_specified__';

// Units (Version 1 scope)
const UNIT_OPTIONS = [
    { value: 'perDemand', label: 'per Demand' },
    { value: 'perHour', label: 'per Hour' },
    { value: 'perYear', label: 'per Year' },
    { value: 'perHourPerFoot', label: 'per Hour per Foot (pipes)' }
];
function unitLabel(u) { const f = UNIT_OPTIONS.find(x => x.value === u); return f ? f.label : (u || ''); }
function unitValueFromLabel(label) { const f = UNIT_OPTIONS.find(x => x.label === label); return f ? f.value : 'perHour'; }

// Prior Library rows carry units either as the app's own canonical UNIT_OPTIONS values (Excel
// re-imports, via unitValueFromLabel) or as the short single-letter/abbreviation codes used in
// raw .relDB files (parseRelDBText passes cv[5] straight through, e.g. 'd', 'h', 'y'). This
// resolves either form to a lowercase, spelled-out label for display in the library picker.
const LIBRARY_UNIT_SHORT_CODES = { d: 'per demand', h: 'per hour', y: 'per year', yr: 'per year', hft: 'per hour per foot' };
function libraryUnitLabel(u) {
    const val = (u || '').trim();
    if (!val) return '';
    const short = LIBRARY_UNIT_SHORT_CODES[val.toLowerCase()];
    if (short) return short;
    const canonical = UNIT_OPTIONS.find(o => o.value.toLowerCase() === val.toLowerCase());
    if (canonical) return canonical.label.toLowerCase().replace(' (pipes)', '');
    return val;
}

// Which UNIT_OPTIONS are physically meaningful for a given Failure Mode's underlying model:
// a Binomial (demand-based) failure mode only ever has a per-demand probability, and a Poisson
// (time-based) failure mode's rate is never per-demand.
function unitOptionsForFailureMode(fm) {
    const model = getFailureModeInfo(fm).model;
    return model === 'binomial' ? UNIT_OPTIONS.filter(o => o.value === 'perDemand') : UNIT_OPTIONS.filter(o => o.value !== 'perDemand');
}

// Source-of-information types (for both prior "digital identifier" and data "digital identifier")
const SOURCE_TYPES = [
    { value: 'operating', label: 'Operating Data' },
    { value: 'testing', label: 'Testing Data' },
    { value: 'experimental', label: 'Experimental Data' },
    { value: 'industryDatabase', label: 'Industry Database' },
    { value: 'expertJudgment', label: 'Expert Judgment' },
    { value: 'literature', label: 'Literature / Publication' },
    { value: 'other', label: 'Other' }
];

const HIERARCHY_LEVELS = ['facility', 'system', 'component', 'failureModeLevel'];
const HIERARCHY_LEVEL_LABELS = { facility: 'Facility', system: 'System', component: 'Component', failureModeLevel: 'Failure Mode' };
const HIERARCHY_LEVEL_LABELS_PLURAL = { facility: 'Facilities', system: 'Systems', component: 'Components', failureModeLevel: 'Failure Modes' };
function pluralizeLevelLabel(level) { return HIERARCHY_LEVEL_LABELS_PLURAL[level] || (HIERARCHY_LEVEL_LABELS[level] + 's'); }
const NA = 'NA'; // "not applicable" sentinel for hierarchy levels

function uid(prefix) { return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

/* ============================================================================
   NUMBER / DISTRIBUTION HELPERS
   ============================================================================ */
// Global, user-configurable precision for probability/rate values shown in the GUI and in
// the generated Word report (Settings > Project > Show Probability). Export formats that
// need full technical precision (BEI, relDB, OpenPSA) pass an explicit sigfigs and are
// unaffected by this setting.
let GLOBAL_PROBABILITY_SIGFIGS = 3;
function setProbabilitySigFigs(digits) { GLOBAL_PROBABILITY_SIGFIGS = Math.max(1, (parseInt(digits, 10) || 0) + 1); }

// Label for a logarithmic axis MAJOR tick only (an exact power of ten), in scientific notation
// (e.g. 1E-1, 1E-2, 1E+2). Returns '' for the minor ticks (2x10^n .. 9x10^n) that Chart.js's log
// scale also generates, so the axis reads cleanly instead of a dense run of unlabeled tick marks.
function formatMajorLogTick(value) {
    const n = parseFloat(value);
    if (!(n > 0) || !isFinite(n)) return '';
    const exp = Math.log10(n);
    const roundedExp = Math.round(exp);
    if (Math.abs(exp - roundedExp) > 1e-6) return ''; // not a power of ten -- minor tick, no label
    return `1E${roundedExp >= 0 ? '+' : '-'}${Math.abs(roundedExp)}`;
}

function formatValue(v, sigfigs) {
    const n = parseFloat(v);
    if (isNaN(n) || !isFinite(n)) return '-';
    if (n === 0) return '0';
    sigfigs = sigfigs || GLOBAL_PROBABILITY_SIGFIGS;
    const abs = Math.abs(n);
    if (abs < 0.001 || abs >= 100000) {
        return n.toExponential(sigfigs - 1).replace('e+', 'E+').replace('e-', 'E-');
    }
    return parseFloat(n.toPrecision(sigfigs)).toString();
}

// Convert a Lognormal(mean, EF) to mean/variance via standard PRA parameterization. Imported
// prior distributions (e.g. NUREG/CR-5500 relDB rows) give the arithmetic mean directly, not
// the median, so this works from the mean rather than assuming ln(median) for mu:
// sigma = ln(EF) / 1.645 (5th-95th spans +/- 1.645 sigma); variance = mean^2 * (exp(sigma^2) - 1)
function lognormalToMoments(mean, ef) {
    const m = parseFloat(mean), efv = parseFloat(ef);
    if (!(m > 0) || !(efv > 1)) return null;
    const sigma = Math.log(efv) / 1.645;
    const variance = m * m * (Math.exp(sigma * sigma) - 1);
    return { mean: m, variance };
}

// Given a mean/variance pair, return method-of-moments Beta(alpha,beta) parameters
function momentsToBeta(mean, variance) {
    if (!(mean > 0) || mean >= 1 || !(variance > 0)) return null;
    const common = (mean * (1 - mean) / variance) - 1;
    const alpha = mean * common;
    const beta = (1 - mean) * common;
    if (!(alpha > 0) || !(beta > 0)) return null;
    return { alpha, beta };
}

// Given a mean/variance pair, return method-of-moments Gamma(shape,scale) parameters
function momentsToGamma(mean, variance) {
    if (!(mean > 0) || !(variance > 0)) return null;
    const shape = (mean * mean) / variance;
    const scale = variance / mean;
    if (!(shape > 0) || !(scale > 0)) return null;
    return { shape, scale };
}

// Human-readable summary of the Lognormal(mean, EF) -> Beta/Gamma method-of-moments conversion
// (see lognormalToMoments/momentsToBeta/momentsToGamma above), written into a prior's notes when
// a Lognormal entry is first loaded from the Prior Library, so the QA trail shows how the
// posterior calculation's effective prior was actually derived from the imported parameters.
function describeLognormalMomentMatch(mean, ef, failureModel) {
    const mom = lognormalToMoments(mean, ef);
    if (!mom) return '';
    const sigma = Math.log(parseFloat(ef)) / 1.645;
    let fitted = '(could not fit a distribution to these moments)';
    if (failureModel === 'binomial') {
        const b = momentsToBeta(mom.mean, mom.variance);
        if (b) fitted = `Beta(alpha=${formatValue(b.alpha)}, beta=${formatValue(b.beta)})`;
    } else {
        const g = momentsToGamma(mom.mean, mom.variance);
        // Expressed as rate (1/scale) for consistency with how the Gamma distribution's second
        // parameter is labeled and entered elsewhere in this app ("Rate (1/Scale)").
        if (g) fitted = `Gamma(shape=${formatValue(g.shape)}, rate=${formatValue(1 / g.scale)})`;
    }
    return `Lognormal prior (mean=${formatValue(mean)}, EF=${formatValue(ef)}) converted to an effective prior via method-of-moments: `
        + `sigma=ln(EF)/1.645=${formatValue(sigma)}, variance=mean^2*(exp(sigma^2)-1)=${formatValue(mom.variance)} -> fitted ${fitted}.`;
}

/*
 * Build the "effective conjugate prior" for an event occurrence rate: a Beta(alpha,beta) for
 * Binomial failure modes (1,2) or a Gamma(shape,scale) for Poisson failure
 * modes (3,4), regardless of how the user originally specified the prior.
 *   - noninformative (Jeffreys): Beta(0.5,0.5) or Gamma(0.5, rate=0 i.e. scale=Infinity)
 *   - cni: alpha/shape fixed at 0.5; beta/scale solved from the user-specified mean
 *   - informed / userSpecified: distributionType + param1/param2 as entered.
 *       Beta -> used directly. Gamma -> used directly.
 *       CNI  -> same formula as the cni prior source, using the given mean.
 *       Lognormal -> converted via method-of-moments to Beta or Gamma as needed.
 */
function buildEffectivePrior(prior, failureModel) {
    const sourceType = prior?.sourceType || 'noninformative';
    if (failureModel === 'binomial') {
        if (sourceType === 'noninformative') return { kind: 'beta', alpha: 0.5, beta: 0.5 };
        if (sourceType === 'cni') {
            const mean = parseFloat(prior.mean);
            if (!(mean > 0) || mean >= 1) return null;
            return { kind: 'beta', alpha: 0.5, beta: 0.5 * (1 - mean) / mean };
        }
        // informed / userSpecified
        const dt = (prior.distributionType || 'Beta').toLowerCase();
        if (dt === 'beta') {
            const a = parseFloat(prior.param1), b = parseFloat(prior.param2);
            if (!(a > 0) || !(b > 0)) return null;
            return { kind: 'beta', alpha: a, beta: b };
        }
        if (dt === 'cni') {
            const mean = parseFloat(prior.mean ?? prior.param1);
            if (!(mean > 0) || mean >= 1) return null;
            return { kind: 'beta', alpha: 0.5, beta: 0.5 * (1 - mean) / mean };
        }
        if (dt === 'lognormal') {
            const mom = lognormalToMoments(prior.param1, prior.param2);
            if (!mom) return null;
            const b = momentsToBeta(mom.mean, mom.variance);
            if (!b) return null;
            return { kind: 'beta', alpha: b.alpha, beta: b.beta };
        }
        return null;
    } else {
        // poisson
        if (sourceType === 'noninformative') return { kind: 'gamma', shape: 0.5, rate: 0 };
        if (sourceType === 'cni') {
            const mean = parseFloat(prior.mean);
            if (!(mean > 0)) return null;
            return { kind: 'gamma', shape: 0.5, rate: 0.5 / mean };
        }
        const dt = (prior.distributionType || 'Gamma').toLowerCase();
        if (dt === 'gamma') {
            // param2 is the Gamma RATE parameter (labeled "Rate (1/Scale)" in the GUI), not
            // scale -- used directly here, not inverted. See parseRelDBText for why: relDB's own
            // "Distribution Scale Parameter (beta)" column is actually rate despite its name.
            const sh = parseFloat(prior.param1), rt = parseFloat(prior.param2);
            if (!(sh > 0) || !(rt > 0)) return null;
            return { kind: 'gamma', shape: sh, rate: rt };
        }
        if (dt === 'cni') {
            const mean = parseFloat(prior.mean ?? prior.param1);
            if (!(mean > 0)) return null;
            return { kind: 'gamma', shape: 0.5, rate: 0.5 / mean };
        }
        if (dt === 'lognormal') {
            const mom = lognormalToMoments(prior.param1, prior.param2);
            if (!mom) return null;
            const g = momentsToGamma(mom.mean, mom.variance);
            if (!g) return null;
            return { kind: 'gamma', shape: g.shape, rate: 1 / g.scale };
        }
        return null;
    }
}

// Combine an effective prior with the event occurrence rate's operational data entries to produce
// a posterior Beta or Gamma, plus summary statistics (mean, 5th/50th/95th percentiles).
// `units` (the event occurrence rate's rate unit, e.g. 'perHour'/'perYear') is used to convert each
// data entry's operational time onto a consistent time basis before summing.
function computePosterior(prior, failureModel, dataEntries, units) {
    const eff = buildEffectivePrior(prior, failureModel);
    if (!eff) return null;
    const jStat = window.jStat;
    const targetIsYears = units === 'perYear';
    let totalDemands = 0, totalFailuresD = 0, totalTime = 0, totalFailuresT = 0;
    (dataEntries || []).forEach(d => {
        if (d.opDataType === 'demandsAndFailures') {
            totalDemands += parseFloat(d.demands) || 0;
            totalFailuresD += parseFloat(d.failures) || 0;
        } else if (d.opDataType === 'timeAndFailures') {
            let t = parseFloat(d.opTime) || 0;
            const entryIsYears = d.timeUnits === 'years';
            if (targetIsYears && !entryIsYears) t = t / 8760;
            else if (!targetIsYears && entryIsYears) t = t * 8760;
            totalTime += t;
            totalFailuresT += parseFloat(d.failures) || 0;
        }
    });

    if (failureModel === 'binomial') {
        const alphaPost = eff.alpha + totalFailuresD;
        const betaPost = eff.beta + Math.max(0, totalDemands - totalFailuresD);
        if (!jStat) return { kind: 'beta', alpha: alphaPost, beta: betaPost, mean: alphaPost / (alphaPost + betaPost) };
        return {
            kind: 'beta', alpha: alphaPost, beta: betaPost,
            mean: alphaPost / (alphaPost + betaPost),
            p05: jStat.beta.inv(0.05, alphaPost, betaPost),
            p50: jStat.beta.inv(0.50, alphaPost, betaPost),
            p95: jStat.beta.inv(0.95, alphaPost, betaPost),
            totalDemands, totalFailures: totalFailuresD
        };
    } else {
        const shapePost = eff.shape + totalFailuresT;
        const ratePost = eff.rate + totalTime; // rate=0 (improper) is fine once T>0
        const scalePost = ratePost > 0 ? 1 / ratePost : Infinity;
        if (!jStat || !isFinite(scalePost)) {
            return { kind: 'gamma', shape: shapePost, scale: scalePost, mean: isFinite(scalePost) ? shapePost * scalePost : null };
        }
        return {
            kind: 'gamma', shape: shapePost, scale: scalePost,
            mean: shapePost * scalePost,
            p05: jStat.gamma.inv(0.05, shapePost, scalePost),
            p50: jStat.gamma.inv(0.50, shapePost, scalePost),
            p95: jStat.gamma.inv(0.95, shapePost, scalePost),
            totalTime, totalFailures: totalFailuresT
        };
    }
}

// Simple deterministic (non-cryptographic) hash used for change-tracking / QA
// integrity checks: detects manual/out-of-band edits to a locked event occurrence rate.
function stableHash(obj) {
    const str = JSON.stringify(obj);
    let h1 = 0xdeadbeef ^ 0, h2 = 0x41c6ce57 ^ 0;
    for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

// Event occurrence rate fields that count toward the locked-content hash / change tracking
// (excludes bookkeeping fields like locked/verification/changeLog themselves).
function fsceorContentSnapshot(f) {
    return {
        eventName: f.eventName, description: f.description, notes: f.notes, requirements: f.requirements,
        hierarchy: f.hierarchy, failureMode: f.failureMode, units: f.units,
        prior: f.prior, operationalData: f.operationalData
    };
}

    project: {

        defaultTimeUnitsForData: 'hours',
        probabilityDigits: 2, // 0 | 1 | 2 -- digits shown after the leading digit (Settings > Project > Show Probability)
        autoEventName: true,       // Settings > Project > Event Naming: create Event Name when a Tracked Item is added
        eventNameDelimiters: '()', // one of EVENT_NAME_DELIMITER_OPTIONS -- brackets enclosing the abbreviation in each hierarchy node name
        eventNameSeparator: '_',   // '-' | '_' -- joins FACILITY, SYSTEM, COMPONENT, FAILUREMODE
        visualizeMin: 1e-10,       // Settings > Project > Visualization Plot Range: occurrence-rate x-axis minimum (> 0, log scale)
        visualizeMax: 1.0          // Settings > Project > Visualization Plot Range: occurrence-rate x-axis maximum (> minimum)
    }
};

// Resolves the Visualize/Report plot x-axis bounds from project settings, falling back to the
// defaults if a stored value is missing or invalid for a log axis (non-positive, or min >= max).
function visualizePlotRange(projectSettings) {
    const p = projectSettings || {};
    const min = Number(p.visualizeMin), max = Number(p.visualizeMax);
    if (min > 0 && max > 0 && isFinite(min) && isFinite(max) && min < max) return { xMin: min, xMax: max };
    return { xMin: DEFAULT_SETTINGS.project.visualizeMin, xMax: DEFAULT_SETTINGS.project.visualizeMax };
}

// Display form for a plot-range value in Settings: scientific notation (e.g. 1E-10) for small or
// large magnitudes, plain decimal (e.g. 1.0, 0.5) otherwise.
function formatPlotRangeValue(n) {
    if (!(n > 0) || !isFinite(n)) return '';
    if (n >= 1e-3 && n < 1e4) return Number.isInteger(n) ? n.toFixed(1) : String(n);
    return n.toExponential().toUpperCase().replace('E+', 'E+').replace(/\.?0+E/, 'E');
}

class SettingsManager {
    static STORAGE_KEY = 'KUREAS_BAYES_settings';
    static LAYOUT_KEY = 'KUREAS_BAYES_layout';
    static load() {
        try {
            const raw = localStorage.getItem(SettingsManager.STORAGE_KEY);
            if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
            const parsed = JSON.parse(raw);
            return { ...DEFAULT_SETTINGS, ...parsed, project: { ...DEFAULT_SETTINGS.project, ...(parsed.project || {}) } };
        } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); }
    }
    static save(settings) {
        try { localStorage.setItem(SettingsManager.STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
    }
    static loadLayout() {
        try { const raw = localStorage.getItem(SettingsManager.LAYOUT_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
    }
    static saveLayout(layout) {
        try { localStorage.setItem(SettingsManager.LAYOUT_KEY, JSON.stringify(layout)); } catch (e) {}
    }
}

function getFontSizeClass(setting) {
    switch (setting) {
        case 'verysmall': return 'text-xs';
        case 'small': return 'text-xs';
        case 'large': return 'text-lg';
        case 'verylarge': return 'text-xl';
        default: return 'text-sm';
    }
}
function getFontFamily(setting) {
    switch (setting) {
        case 'serif': return 'font-serif-app';
        case 'monospace': return 'font-mono-app';
        default: return '';
    }
}
function getBackgroundStyle(setting) {
    switch (setting) {
        case 'gray': return { backgroundColor: '#f3f4f6', color: '#111827', paneBackground: '#f9fafb', borderColor: '#d1d5db' };
        case 'dark': return { backgroundColor: '#1f2937', color: '#f3f4f6', paneBackground: '#374151', borderColor: '#4b5563' };

// Chart.js text/gridline colors matching the current Settings > Background theme. Chart.js
// defaults to a dark-gray label color, which reads fine against a light page but is nearly
// invisible against the Dark theme's page background showing through a chart's transparent
// canvas. Reads the theme class App applies to <html> (see its useEffect) directly, rather than
// threading settings down through every component that builds a Chart.js config.
function chartThemeColors() {
    const isDark = typeof document !== 'undefined' && document.documentElement.classList.contains('theme-dark');
    return isDark
        ? { text: '#e5e7eb', grid: 'rgba(229,231,235,0.15)' }
        : { text: '#374151', grid: 'rgba(0,0,0,0.1)' };
}

   ============================================================================ */
function Tooltip({ text, children }) {
    const [show, setShow] = useState(false);
    const [pos, setPos] = useState({ top: 0, left: 0 });
    const ref = useRef(null);
    const onEnter = () => {
        if (ref.current) {
            const r = ref.current.getBoundingClientRect();
            setPos({ top: r.bottom + 6, left: r.left });
        }
        setShow(true);
    };
    return (
        <span ref={ref} style={{ position: 'relative', display: 'inline-flex' }}
              onMouseEnter={onEnter} onMouseLeave={() => setShow(false)}>
            {children}
            {show && (
                <div className="fixed z-50 bg-blue-900 text-white text-sm rounded-lg shadow-xl p-3 max-w-sm pointer-events-none"
                     style={{ top: pos.top, left: pos.left }}>
                    {text}
                </div>
            )}
        </span>
    );
}
function InfoIcon({ text }) {
    return (<Tooltip text={text}><span style={{ cursor: 'help', color: '#6b7280', fontSize: '0.85em' }}>&#9432;</span></Tooltip>);
}

   ============================================================================ */
function PromptModal({ title, label, initialValue, placeholder, submitLabel, multiline, allowEmpty, onSubmit, onClose }) {
    const [value, setValue] = useState(initialValue || '');
    const [touched, setTouched] = useState(false);
    const inputRef = useRef(null);
    useEffect(() => { if (inputRef.current) { inputRef.current.focus(); if (inputRef.current.select) inputRef.current.select(); } }, []);
    const isBlank = !allowEmpty && !(value || '').trim();
    const submit = () => {
        if (isBlank) { setTouched(true); return; }
        onSubmit(value.trim ? value.trim() : value);
        onClose();
    };
    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2200 }} onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl max-w-sm w-full m-4" onClick={e => e.stopPropagation()}>
                <div className="p-5">
                    <h3 className="text-base font-bold text-gray-800 mb-3">{title}</h3>
                    {label && <label className="block text-xs font-medium text-gray-600 mb-1">{label}</label>}
                    {multiline ? (
                        <textarea ref={inputRef} className="w-full px-3 py-2 border rounded text-sm" rows="3" value={value}
                                  onChange={e => setValue(e.target.value)} placeholder={placeholder}
                                  onKeyDown={e => { if (e.key === 'Escape') onClose(); }} />
                    ) : (
                        <input ref={inputRef} className="w-full px-3 py-2 border rounded text-sm" value={value}
                               onChange={e => setValue(e.target.value)} placeholder={placeholder}
                               onKeyDown={e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') onClose(); }} />
                    )}
                    {touched && isBlank && <p className="text-xs text-red-600 mt-1">This field is required.</p>}
                    <div className="flex justify-end gap-2 mt-4">
                        <button onClick={onClose} className="px-3 py-1.5 border rounded text-sm hover:bg-gray-100">Cancel</button>
                        <button onClick={submit} className="px-3 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">{submitLabel || 'OK'}</button>
                    </div>
                </div>
            </div>
        </div>
    );
}

            <div className={`border rounded p-3 overflow-y-auto rt-display ${disabled ? 'bg-gray-100 opacity-70 cursor-not-allowed' : 'bg-gray-50 cursor-pointer hover:bg-gray-100'}`}
                 style={{ height: height || '80px' }}
                 onClick={() => { if (!disabled) setEditing(true); }}
                 dangerouslySetInnerHTML={{ __html: html || `<p class="text-gray-400">${placeholder || 'Click to edit...'}</p>` }} />
            {editing && !disabled && (
                <RichTextEditorModal title={label || 'Edit'} initialHtml={html} onSave={onChange} onClose={() => setEditing(false)} />
            )}
        </div>
    );
}

// A controlled text input/textarea that updates its value live on every keystroke (via
// onChange) but only reports a single "committed" change -- via onCommit(oldValue,
// newValue) -- when the field loses focus and its value actually differs from what it was
// when focus began. This is what keeps free-typed fields (descriptions, names, numeric
// entries, etc.) from generating one change-log entry per keystroke.
function BlurLoggedField({ value, onChange, onCommit, className, placeholder, multiline, rows, maxLength }) {
    const baselineRef = useRef(null);
    const commonProps = {
        className, placeholder, maxLength, value: value || '',
        onFocus: () => { baselineRef.current = value || ''; },
        onChange: e => onChange(e.target.value),
        onBlur: () => {
            if (baselineRef.current !== null && baselineRef.current !== (value || '')) {
                onCommit(baselineRef.current, value || '');
            }
            baselineRef.current = null;
        }
    };
    return multiline ? <textarea rows={rows || 2} {...commonProps} /> : <input {...commonProps} />;
}

/* ============================================================================
   HIERARCHY (Facility / System / Component / Failure Mode)
   ============================================================================ */
function emptyHierarchy() { return { facility: [], system: [], component: [], failureModeLevel: [] }; }

function childLevel(level) {
    const idx = HIERARCHY_LEVELS.indexOf(level);
    return idx >= 0 && idx < HIERARCHY_LEVELS.length - 1 ? HIERARCHY_LEVELS[idx + 1] : null;
}
function parentLevel(level) {
    const idx = HIERARCHY_LEVELS.indexOf(level);
    return idx > 0 ? HIERARCHY_LEVELS[idx - 1] : null;
}
function nodeName(hierarchy, level, id) {
    if (!id || id === NA) return 'N/A';
    const n = (hierarchy[level] || []).find(x => x.id === id);
    return n ? n.name : '(unknown)';
}
// `levels` optionally restricts which HIERARCHY_LEVELS are included (defaults to all four) --
// used by the Tracked Items list to respect Settings > Show for Tracked Items.
function hierarchyPathLabel(hierarchy, h, levels) {
    const parts = (levels || HIERARCHY_LEVELS).map(lvl => {
        const val = nodeName(hierarchy, lvl, (h || {})[lvl + 'Id']);
        return val !== 'N/A' ? `${HIERARCHY_LEVEL_LABELS[lvl]}: ${val}` : null;
    }).filter(Boolean);
    return parts.length ? parts.join(' > ') : 'No hierarchy assigned';
}

// Finds a Prior Library row (if any) whose facility/system/component/failure-mode text matches
// a given hierarchy assignment -- used to auto-populate a new event occurrence rate's prior when
// it's being tracked against something already brought in via Import. Only levels the assignment
// actually specifies (not N/A) are required to match; a level left N/A doesn't filter, but at
// least one level must be specified or nothing is considered a match. Failure Mode is checked
// against either the row's short failMode code or its longer desc field, since the project
// hierarchy's Failure-Mode-Level node name can come from either (see mergeHierarchyFromRelDBRows).
function findLibraryRowForAssignment(priorLibrary, hierarchy, h) {
    const rows = priorLibrary || [];
    if (!rows.length) return null;
    const name = (level, id) => {
        const n = nodeName(hierarchy, level, id);
        return (n === 'N/A' || n === '(unknown)') ? '' : n;
    };
    const facilityName = name('facility', (h || {}).facilityId);
    const systemName = name('system', (h || {}).systemId);
    const componentName = name('component', (h || {}).componentId);
    const failureModeName = name('failureModeLevel', (h || {}).failureModeLevelId);
    // A prior library entry represents one specific component's specific failure mode, so a
    // match only means anything once Failure Mode -- the leaf, most specific level -- is
    // actually selected. Without it, Facility/System/Component alone are far too broad (e.g. a
    // project with a single facility would "match" the very first library row regardless of
    // what it actually is) and would surface an arbitrary, misleading suggestion.
    if (!failureModeName) return null;
    return rows.find(r =>
        (!facilityName || (r.facility || '').trim() === facilityName) &&
        (!systemName || (r.system || '').trim() === systemName) &&
        (!componentName || (r.componentType || '').trim() === componentName) &&
        ((r.failMode || '').trim() === failureModeName || (r.desc || '').trim() === failureModeName)
    ) || null;
}

// Builds a complete prior object from an imported Prior Library row -- shared by PriorEditor's
// "Select from Library" flow (which strips sourceType back out, preserving whichever of
// Informed/User-Specified the user already had selected) and NewFSCEORModal's auto-populate for
// a brand-new item, which uses the sourceType as-is ('informed', since this always comes from
// imported data).
function buildPriorFromLibraryRow(row, failureModel) {
    const dtMap = { beta: 'Beta', gamma: 'Gamma', lognormal: 'Lognormal', cni: 'CNI', o: 'CNI' };
    const distributionType = dtMap[(row.distType || '').toLowerCase()] || (failureModel === 'binomial' ? 'Beta' : 'Gamma');
    const paperTrail = { sourceId: row.sourceId, libraryRowId: row.id };
    if (distributionType === 'CNI') {
        return { sourceType: 'informed', distributionType, mean: row.mean, param1: '', param2: '', paperTrail };
    }
    if (distributionType === 'Lognormal') {
        const notes = describeLognormalMomentMatch(row.shape, row.scale, failureModel);
        return { sourceType: 'informed', distributionType, param1: row.shape, param2: row.scale, paperTrail: { ...paperTrail, notes: notes || '' } };
    }
    return { sourceType: 'informed', distributionType, param1: row.shape, param2: row.scale, paperTrail };
}

// Maps a Prior Library row's raw units code (the short relDB-style codes -- 'd'/'h'/'hft'/'yr',
// not the app's own canonical UNIT_OPTIONS values an Excel re-import would carry) to the Failure
// Mode + Units an event occurrence rate built from that row should use. Returns null for a code
// this mapping doesn't recognize, so callers can decide their own fallback rather than silently
// guessing. Shared by NewFSCEORModal's live library-match effect and its bulk "add from library"
// flow.
function failureModeAndUnitsForLibraryUnits(rawUnits) {
    switch ((rawUnits || '').trim().toLowerCase()) {
        case 'd': return { failureMode: '2', units: 'perDemand' };
        case 'h': return { failureMode: '3', units: 'perHour' };
        case 'hft': return { failureMode: '3', units: 'perHour' };
        case 'yr': return { failureMode: '3', units: 'perYear' };
        default: return null;
    }
}

// Finds a node in `list` matching `name` (case-insensitive) under `parentId`, or creates one --
// mirrors the findOrCreate pattern mergeHierarchyFromRelDBRows/mergeHierarchyFromExcelRows use
// during Import, but returns just the one list plus the resolved id, for building up a full
// Hierarchy Assignment one level at a time.
function findOrCreateHierarchyNode(list, name, parentId) {
    const trimmed = (name || '').trim();
    if (!trimmed) return { id: null, list };
    const existing = (list || []).find(n => n.name.toLowerCase() === trimmed.toLowerCase() && (n.parentId || null) === (parentId || null));
    if (existing) return { id: existing.id, list };
    const node = { id: uid('node'), name: trimmed, description: '', color: '#000000', parentId: parentId || null };
    return { id: node.id, list: [...(list || []), node] };
}

// Resolves (creating nodes as needed) a full Hierarchy Assignment for a Prior Library row, for
// bulk-creating Tracked Items directly from the library -- library rows carry facility/system/
// componentType/failMode as plain text, not hierarchy ids. Returns the assignment (in the { xId }
// shape event occurrence rates use) plus the hierarchy tree with any newly-created nodes merged
// in, for the caller to persist via onHierarchyChange.
function resolveHierarchyForLibraryRow(hierarchy, row) {
    let updated = hierarchy;
    let facilityId = null, systemId = null, componentId = null, failureModeLevelId = null;
    if ((row.facility || '').trim()) {
        const r = findOrCreateHierarchyNode(updated.facility, row.facility, null);
        facilityId = r.id; updated = { ...updated, facility: r.list };
    }
    if ((row.system || '').trim()) {
        const r = findOrCreateHierarchyNode(updated.system, row.system, facilityId);
        systemId = r.id; updated = { ...updated, system: r.list };
    }
    if ((row.componentType || '').trim()) {
        const r = findOrCreateHierarchyNode(updated.component, row.componentType, systemId);
        componentId = r.id; updated = { ...updated, component: r.list };
    }
    const fmName = (row.failMode || '').trim() || (row.desc || '').trim();
    if (fmName) {
        const r = findOrCreateHierarchyNode(updated.failureModeLevel, fmName, componentId);
        failureModeLevelId = r.id; updated = { ...updated, failureModeLevel: r.list };
    }
    return {
        h: { facilityId: facilityId || NA, systemId: systemId || NA, componentId: componentId || NA, failureModeLevelId: failureModeLevelId || NA },
        hierarchy: updated
    };
}

// The mean implied by a Prior Library row's raw stored parameters, regardless of distribution
// type -- for CNI it's already the mean; for Lognormal, row.shape IS the mean directly (param1
// convention, see DISTRIBUTION_TYPES); for Beta, mean = alpha/(alpha+beta) with row.shape=alpha,
// row.scale=beta; for Gamma, mean = shape/rate with row.scale holding rate directly (see
// buildEffectivePrior's gamma branch for why -- NOT shape*scale, since row.scale is rate here,
// not scale theta). Returns '' if it can't be computed from what's there.
function libraryRowMean(row) {
    const distType = (row.distType || '').toLowerCase();
    if (distType === 'cni' || distType === 'o') return row.mean ?? '';
    if (distType === 'lognormal') return row.shape ?? '';
    const shape = parseFloat(row.shape), p2 = parseFloat(row.scale);
    if (!(shape > 0) || !(p2 > 0)) return '';
    if (distType === 'beta') return shape / (shape + p2);
    if (distType === 'gamma') return shape / p2;
    return '';
}

// The color to represent one event occurrence rate's hierarchy assignment with (e.g. in the
// Visualize plot): the most specific assigned level's color wins (Failure Mode > Component >
// System > Facility), falling back to black when nothing is assigned or no color was set.
function itemColorFromHierarchy(hierarchy, h) {
    h = h || {};
    const order = ['failureModeLevel', 'component', 'system', 'facility'];
    for (const level of order) {
        const id = h[level + 'Id'];
        if (id && id !== NA) {
            const node = (hierarchy[level] || []).find(n => n.id === id);
            // Every node's color defaults to '#000000' when created (see addNode), so a plain
            // truthiness check here always matched the first assigned level regardless of
            // whether its color was ever actually customized -- e.g. an item with a Failure
            // Mode assigned would always show black, even if a shallower level like Component
            // had been given a real color, because '#000000' is still a non-empty string.
            // Treating default black as "no color set" lets the search correctly fall through
            // to an ancestor level that does have a customized color.
            if (node && node.color && node.color.toLowerCase() !== '#000000') return node.color;
        }
    }
    return '#000000';
}

// Cascading selector for one event occurrence rate's Facility/System/Component/Failure Mode
// Selector for one event occurrence rate's Facility/System/Component/Failure Mode hierarchy
// assignment. All four levels are independent -- every node defined in the project hierarchy
// (via Manage Hierarchy) is always listed regardless of how it's nested, and picking one level
// never clears the others.
// Options for one level of the assignment selector: when the parent level has a specific
// value chosen, only that parent's children are offered; when the parent level is N/A (or
// this is the top-level Facility), every node at this level is offered -- so a Component
// created without a System link is still reachable, but choosing a System properly narrows
// the Components shown underneath it.
function optionsForAssignment(hierarchy, level, parentValue) {
    const list = (hierarchy && hierarchy[level]) || [];
    const pLevel = parentLevel(level);
    if (!pLevel) return list;
    if (!parentValue || parentValue === NA) return list;
    return list.filter(n => (n.parentId || null) === parentValue);
}

function HierarchySelector({ hierarchy, value, onChange, onHierarchyChange }) {
    const [addingLevel, setAddingLevel] = useState(null); // level currently showing the "new node" dialog

    const commitNewNode = (level, name) => {
        const parentLvl = parentLevel(level);
        const parentId = parentLvl ? value[parentLvl + 'Id'] : undefined;
        const normalizedParent = (!parentId || parentId === NA) ? null : parentId;
        const id = uid(level);
        const newHierarchy = { ...hierarchy, [level]: [...(hierarchy[level] || []), { id, name: name.trim(), description: '', color: '#000000', parentId: normalizedParent }] };
        onHierarchyChange(newHierarchy);
        handleLevelChange(level, id);
    };

    // Changing a level clears any already-chosen descendants, since they were only valid
    // relative to the old parent selection (matches the Manage Hierarchy drill-down).
    const handleLevelChange = (level, id) => {
        const next = { ...value, [level + 'Id']: id };
        const idx = HIERARCHY_LEVELS.indexOf(level);
        HIERARCHY_LEVELS.slice(idx + 1).forEach(l => { next[l + 'Id'] = NA; });
        onChange(next);
    };

    return (
        <div className="grid gap-3" style={{ gridTemplateColumns: 'minmax(0, 0.35fr) minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, 1.1fr)' }}>
            {HIERARCHY_LEVELS.map((level, i) => {
                const pLevel = parentLevel(level);
                const parentValue = pLevel ? (value[pLevel + 'Id'] || NA) : null;
                const options = optionsForAssignment(hierarchy, level, parentValue).slice().sort((a, b) => a.name.localeCompare(b.name));
                const currentVal = value[level + 'Id'] || NA;
                return (
                    <div key={level} className="min-w-0">
                        <label className="block text-sm font-bold mb-1 text-gray-700">{HIERARCHY_LEVEL_LABELS[level]}</label>
                        <select
                            className="w-full px-2 py-1.5 border rounded text-sm"
                            value={currentVal}
                            onChange={e => {
                                if (e.target.value === '__new__') {
                                    setAddingLevel(level);
                                } else {
                                    handleLevelChange(level, e.target.value);
                                }
                            }}
                        >
                            <option value={NA}>N/A</option>
                            {options.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                            <option value="__new__">+ New {HIERARCHY_LEVEL_LABELS[level]}...</option>
                        </select>
                    </div>
                );
            })}
            {addingLevel && (
                <PromptModal title={`New ${HIERARCHY_LEVEL_LABELS[addingLevel]}`} label="Name" placeholder="Enter a name"
                             onSubmit={(name) => commitNewNode(addingLevel, name)} onClose={() => setAddingLevel(null)} />
            )}
        </div>
    );
}

// Modal for viewing/adding/renaming/deleting hierarchy nodes across the whole project,
// independent of adding/editing event occurrence rate items.
function EditNodeModal({ level, node, parentLevelLabel, parentOptions, onSave, onClose }) {
    const [name, setName] = useState(node.name);
    const [description, setDescription] = useState(node.description || '');
    const [parentId, setParentId] = useState(node.parentId || NA);
    const [color, setColor] = useState(node.color || '#000000');
    // Editable hex text field, kept separate from `color` so partial typing (e.g. "#1f7") doesn't
    // reset the swatch; a complete 3- or 6-digit code (with or without '#') is committed.
    const [hexDraft, setHexDraft] = useState(node.color || '#000000');
    const handleHexChange = (text) => {
        setHexDraft(text);
        const m = text.trim().match(/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
        if (m) {
            const h = m[1].length === 3 ? m[1].split('').map(c => c + c).join('') : m[1];
            setColor('#' + h.toLowerCase());
        }
    };
    const [showNameError, setShowNameError] = useState(false);

    const handleSave = () => {
        if (!name.trim()) { setShowNameError(true); return; }
        onSave({ name: name.trim(), description, parentId: parentId === NA ? null : parentId, color });
        onClose();
    };

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2200 }} onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl max-w-md w-full m-4" onClick={e => e.stopPropagation()}>
                <div className="p-6">
                    <h2 className="text-xl font-bold text-gray-800 mb-4">Edit {HIERARCHY_LEVEL_LABELS[level]}</h2>
                    <div className="space-y-3">
                        <div>
                            <label className="block text-sm font-medium mb-1">Name</label>
                            <input className="w-full px-3 py-2 border rounded text-sm" value={name}
                                   onChange={e => { setName(e.target.value); setShowNameError(false); }} />
                            {showNameError && <p className="text-xs text-red-600 mt-1">Name is required.</p>}
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Description</label>
                            <textarea className="w-full px-3 py-2 border rounded text-sm" rows="3" value={description} onChange={e => setDescription(e.target.value)} />
                        </div>
                        {parentLevelLabel && (
                            <div>
                                <label className="block text-sm font-medium mb-1">Parent {parentLevelLabel}</label>
                                <select className="w-full px-3 py-2 border rounded text-sm" value={parentId} onChange={e => setParentId(e.target.value)}>
                                    <option value={NA}>N/A</option>
                                    {parentOptions.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                                </select>
                            </div>
                        )}
                        <div>
                            <label className="block text-sm font-medium mb-1">Color</label>
                            <div className="flex items-center gap-2">
                                <label className="text-xs font-medium text-gray-600" htmlFor="node-color-hex">Hex</label>
                                <input id="node-color-hex" className="px-2 py-1.5 border rounded text-sm font-mono" style={{ width: '96px', flexShrink: 0 }}
                                       value={hexDraft} maxLength={7} spellCheck={false}
                                       onChange={e => handleHexChange(e.target.value)} onBlur={() => setHexDraft(color)} />
                                <input type="color" className="border rounded cursor-pointer" style={{ width: '48px', height: '36px', flexShrink: 0 }}
                                       value={color} onChange={e => { setColor(e.target.value); setHexDraft(e.target.value); }} title="Open color picker" />
                            </div>
                            <p className="text-xs text-gray-500 mt-1">Used to color this item in the Visualize occurrence-rate plot.</p>
                        </div>
                    </div>
                    <div className="flex justify-end gap-2 mt-6">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                        <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                    </div>
                </div>
            </div>
        </div>
    );
}

function HierarchyManagerModal({ hierarchy, fsceors, onSave, onClose }) {
    const [local, setLocal] = useState(JSON.parse(JSON.stringify(hierarchy)));
    const [drafts, setDrafts] = useState({
        facility: { name: '', parentId: NA },
        system: { name: '', parentId: NA },
        component: { name: '', parentId: NA },
        failureModeLevel: { name: '', parentId: NA }
    });
    // Which node is currently "drilled into" at each level -- selecting a Facility filters
    // the Systems column to that facility's children, selecting a System filters Components
    // to that system's children, and so on. Nothing selected at a level means "show all"
    // for the next column, same as before.
    const [selection, setSelection] = useState({ facility: null, system: null, component: null });
    const [editTarget, setEditTarget] = useState(null);     // { level, id }
    const [deleteTarget, setDeleteTarget] = useState(null); // { level, id }
    const [notice, setNotice] = useState(null);             // { title, message }
    const usageCount = (level, id) => (fsceors || []).filter(f => f.hierarchy && f.hierarchy[level + 'Id'] === id).length;

    const setDraft = (level, patch) => setDrafts(prev => ({ ...prev, [level]: { ...prev[level], ...patch } }));

    // Which ids at `level` are "in scope" given the current selection chain, even when only an
    // ancestor further up was clicked rather than the immediate parent -- e.g. selecting a
    // System (with no Component chosen) should still scope Failure Mode down to only the
    // failure modes under that system's components, not every failure mode in the project.
    // Returns null when nothing in the chain up to and including `level` constrains it at all.
    const scopedIdsAtLevel = (level) => {
        if (!level) return null;
        if (selection[level]) return [selection[level]];
        const pLevel = parentLevel(level);
        const parentScope = scopedIdsAtLevel(pLevel);
        if (parentScope === null) return null;
        return (local[level] || []).filter(n => parentScope.includes(n.parentId)).map(n => n.id);
    };

    const selectNode = (level, id) => {
        // Only Facility/System/Component drive a filter on the level below; clicking again
        // (or clicking the same node) clears that filter back to "show all".
        const childLvl = childLevel(level);
        if (!childLvl) return;
        const isDeselecting = selection[level] === id;
        const newValue = isDeselecting ? null : id;
        setSelection(prev => {
            const next = { ...prev, [level]: newValue };
            // Clear any deeper selections -- they were scoped to the old filtered set and
            // may no longer make sense once a higher-level filter changes.
            const idx = HIERARCHY_LEVELS.indexOf(level);
            HIERARCHY_LEVELS.slice(idx + 1).forEach(l => { if (l !== 'failureModeLevel') next[l] = null; });
            return next;
        });
        // Pre-fill the child level's "add new" parent to match what you're viewing, so a
        // node you add while drilled into "Pipes" is automatically attached under "Pipes".
        setDraft(childLvl, { parentId: newValue || NA });
    };

    const addNode = (level) => {
        const draft = drafts[level];
        const name = (draft.name || '').trim();
        if (!name) return;
        const pLevel = parentLevel(level);
        const normalizedParent = pLevel ? ((!draft.parentId || draft.parentId === NA) ? null : draft.parentId) : null;
        const node = { id: uid(level), name, description: '', color: '#000000', parentId: normalizedParent };
        setLocal(prev => ({ ...prev, [level]: [...prev[level], node] }));
        setDraft(level, { name: '' }); // keep parent selection so several children can be added quickly
    };

    const commitEdit = (patch) => {
        const { level, id } = editTarget;
        setLocal(prev => ({ ...prev, [level]: prev[level].map(n => n.id === id ? { ...n, ...patch } : n) }));
    };
    const requestDelete = (level, id) => {
        const count = usageCount(level, id);
        const childLvl = childLevel(level);
        const hasChildren = childLvl && local[childLvl].some(n => n.parentId === id);
        if (count > 0 || hasChildren) {
            setNotice({ title: 'Cannot Delete', message: `This ${HIERARCHY_LEVEL_LABELS[level]} is in use by ${count} event occurrence rate(s)${hasChildren ? ' and/or has child nodes' : ''}.` });
            return;
        }
        setDeleteTarget({ level, id });
    };
    const commitDelete = () => {
        const { level, id } = deleteTarget;
        setLocal(prev => ({ ...prev, [level]: prev[level].filter(n => n.id !== id) }));
        setSelection(prev => (prev[level] === id ? { ...prev, [level]: null } : prev));
    };

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div className="bg-white rounded-lg shadow-xl w-full m-4 flex flex-col" style={{ maxWidth: '1500px', width: 'min(1500px, 95vw)', height: '85vh' }} onClick={e => e.stopPropagation()}>
                <div className="p-6 flex flex-col flex-1 min-h-0">
                    <div className="flex items-center justify-between mb-4 flex-shrink-0">
                        <h2 className="text-xl font-bold text-gray-800">Manage Project Hierarchy</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <p className="text-xs text-gray-500 mb-4 flex-shrink-0">Facility, System, Component, and Failure Mode labels used across event occurrence rates in this project. Click a Facility, System, or Component to show only its children in the column to the right; click it again (or "Show All") to clear that filter. Use "Edit" to rename a node, change its description, color, or parent. Add nodes directly here, independent of any event occurrence rate. A node can only be deleted if it is not referenced by any event occurrence rate and has no child nodes.</p>
                    <div className="grid gap-4 flex-1 min-h-0" style={{ gridTemplateColumns: 'minmax(0, 0.7fr) minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, 1.1fr)' }}>
                        {HIERARCHY_LEVELS.map(level => {
                            const pLevel = parentLevel(level);
                            const childLvl = childLevel(level);
                            const parentOptions = (pLevel ? local[pLevel] : []).slice().sort((a, b) => a.name.localeCompare(b.name));
                            // Filter the displayed list by every applicable ancestor selection (not just
                            // the immediate parent) -- see scopedIdsAtLevel. The "under X" banner/"Show
                            // All" button below still only reference the immediate parent, since that's
                            // the only level a click here can directly clear.
                            const activeParentFilter = pLevel ? selection[pLevel] : null;
                            const parentScope = pLevel ? scopedIdsAtLevel(pLevel) : null;
                            const visibleNodes = parentScope
                                ? local[level].filter(n => parentScope.includes(n.parentId || null))
                                : local[level];
                            const sortedNodes = visibleNodes.slice().sort((a, b) => a.name.localeCompare(b.name));
                            const draft = drafts[level];
                            return (
                                <div key={level} className="border rounded flex flex-col min-h-0 min-w-0">
                                    <div className="p-2 bg-gray-100 border-b font-bold text-sm flex items-center justify-between flex-shrink-0">
                                        <span>{pluralizeLevelLabel(level)} ({visibleNodes.length}{parentScope ? ` of ${local[level].length}` : ''})</span>
                                        {activeParentFilter && (
                                            <button onClick={() => selectNode(pLevel, activeParentFilter)} className="text-xs text-blue-600 hover:underline font-normal">Show All</button>
                                        )}
                                    </div>
                                    {activeParentFilter && (
                                        <div className="px-2 py-1 bg-blue-50 border-b text-xs text-blue-700 flex-shrink-0">
                                            Showing {HIERARCHY_LEVEL_LABELS[level]}s under &ldquo;{nodeName(local, pLevel, activeParentFilter)}&rdquo;
                                        </div>
                                    )}
                                    <div className="p-2 space-y-1 overflow-y-auto flex-1 min-h-0">
                                        {visibleNodes.length === 0 && <div className="text-xs text-gray-400 italic p-2">{parentScope ? 'None defined under this parent.' : 'None defined'}</div>}
                                        {sortedNodes.map(n => (
                                            <div key={n.id}
                                                 onClick={() => childLvl && selectNode(level, n.id)}
                                                 className={`flex items-center justify-between text-sm px-2 py-1 rounded group ${childLvl ? 'cursor-pointer' : ''} ${selection[level] === n.id ? 'bg-blue-100 hover:bg-blue-100' : 'hover:bg-gray-50'}`}>
                                                <span className="truncate flex items-center gap-1.5 min-w-0" title={n.description ? `${n.name} \u2014 ${n.description}` : n.name}>
                                                    {childLvl && <span className="text-gray-400 text-xs flex-shrink-0">{selection[level] === n.id ? '\u25BC' : '\u25B6'}</span>}
                                                    <span className="inline-block flex-shrink-0 rounded-full border border-gray-300" style={{ width: '10px', height: '10px', backgroundColor: n.color || '#000000' }}></span>
                                                    {n.name}
                                                </span>
                                                <span className="flex gap-1 opacity-0 group-hover:opacity-100 flex-shrink-0">
                                                    <button onClick={(e) => { e.stopPropagation(); setEditTarget({ level, id: n.id }); }} className="text-xs text-blue-600 hover:underline">Edit</button>
                                                    <button onClick={(e) => { e.stopPropagation(); requestDelete(level, n.id); }} className="text-xs text-red-600 hover:underline font-bold" title="Delete">X</button>
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-2 border-t bg-gray-50 space-y-1 flex-shrink-0">
                                        {pLevel && (
                                            <select className="w-full px-2 py-1 border rounded text-xs" value={draft.parentId}
                                                    onChange={e => setDraft(level, { parentId: e.target.value })}>
                                                <option value={NA}>Under: N/A</option>
                                                {parentOptions.map(o => <option key={o.id} value={o.id}>Under: {o.name}</option>)}
                                            </select>
                                        )}
                                        <div className="flex gap-1">
                                            <input className="flex-1 px-2 py-1 border rounded text-xs" placeholder={`New ${HIERARCHY_LEVEL_LABELS[level]}...`}
                                                   value={draft.name} onChange={e => setDraft(level, { name: e.target.value })}
                                                   onKeyDown={e => { if (e.key === 'Enter') addNode(level); }} />
                                            <button onClick={() => addNode(level)} className="px-2 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700 flex-shrink-0" title={`Add ${HIERARCHY_LEVEL_LABELS[level]}`}>
                                                <PlusIcon />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex justify-end gap-2 mt-6 flex-shrink-0">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                        <button onClick={() => { onSave(local); onClose(); }} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                    </div>
                </div>
            </div>
            {editTarget && (() => {
                const { level, id } = editTarget;
                const pLevel = parentLevel(level);
                const node = local[level].find(n => n.id === id);
                const parentOptions = pLevel ? local[pLevel].slice().sort((a, b) => a.name.localeCompare(b.name)) : [];
                return (
                    <EditNodeModal level={level} node={node} parentLevelLabel={pLevel ? HIERARCHY_LEVEL_LABELS[pLevel] : null}
                                   parentOptions={parentOptions} onSave={commitEdit} onClose={() => setEditTarget(null)} />
                );
            })()}
            {deleteTarget && (
                <ConfirmModal title="Delete Node" danger confirmLabel="Delete"
                              message={`Delete "${local[deleteTarget.level].find(n => n.id === deleteTarget.id)?.name}"? This cannot be undone.`}
                              onConfirm={commitDelete} onClose={() => setDeleteTarget(null)} />
            )}
            {notice && <AlertModal title={notice.title} message={notice.message} onClose={() => setNotice(null)} />}
        </div>
    );
}

/* ============================================================================
   SOURCES OF INFORMATION (deduplicated project-level library)
   ============================================================================ */
// Modal for directly editing the distribution parameters of every Prior Library row imported
// under one Source of Information. Distinct from picking a library entry for a single event
// occurrence rate's prior (PriorLibraryPickerModal) -- this edits the library data itself, and
// saving also updates the prior of every non-locked Tracked Item that was populated from that
// exact row (matched by libraryRowId, not just by coincidentally-matching values -- see
// buildPriorFromLibraryRow). Rows used by a locked Tracked Item are shown greyed out and cannot
// be edited at all.
function EditSourceDistributionsModal({ source, priorLibrary, fsceors, onSave, onClose }) {
    const [local, setLocal] = useState(() => JSON.parse(JSON.stringify((priorLibrary || []).filter(r => r.sourceId === source.id))));

    const dtMap = { beta: 'Beta', gamma: 'Gamma', lognormal: 'Lognormal', cni: 'CNI', o: 'CNI' };
    const normalizedDistType = (distType) => dtMap[(distType || '').toLowerCase()] || 'Gamma';

    // Every Tracked Item whose prior was populated from this exact row, regardless of what its
    // own Hierarchy Assignment looks like now.
    const usingItems = (rowId) => (fsceors || []).filter(f => f.prior?.paperTrail?.libraryRowId === rowId);
    const usageInfo = (rowId) => {
        const items = usingItems(rowId);
        if (items.length === 0) return { status: 'unused', label: 'Not used' };
        if (items.some(f => f.locked)) return { status: 'locked', label: 'Used \u2014 locked' };
        if (items.every(f => f.verification?.verified)) return { status: 'verified', label: 'Used \u2014 verified' };
        return { status: 'unverified', label: 'Used \u2014 not verified' };
    };
    const STATUS_STYLE = {
        unused: 'bg-gray-100 text-gray-500',
        unverified: 'bg-amber-100 text-amber-700',
        verified: 'bg-green-100 text-green-700',
        locked: 'bg-red-100 text-red-700'
    };

    const setRow = (id, patch) => setLocal(prev => prev.map(r => r.id === id ? { ...r, ...patch } : r));

    const commitSave = () => {
        // Full project priorLibrary with just this source's (possibly edited) rows swapped in.
        const updatedLibrary = (priorLibrary || []).map(r => local.find(l => l.id === r.id) || r);
        // Any non-locked Tracked Item populated from one of these rows gets its prior rebuilt
        // from the (possibly edited) row, the same way PriorEditor's "Select from Library" would
        // -- preserving the item's own sourceType (always 'informed' here, since that's the only
        // way libraryRowId gets set) and falling back to its existing notes when the edited row
        // isn't a Lognormal (which always gets a fresh moment-match note).
        const updatedFsceors = (fsceors || []).map(f => {
            const rowId = f.prior?.paperTrail?.libraryRowId;
            if (!rowId || f.locked) return f;
            const row = local.find(l => l.id === rowId);
            if (!row) return f;
            const fmInfo = getFailureModeInfo(f.failureMode);
            const { sourceType, paperTrail: builtPaperTrail, ...rest } = buildPriorFromLibraryRow(row, fmInfo.model);
            const prior = { ...f.prior, ...rest, paperTrail: { ...(f.prior.paperTrail || {}), ...builtPaperTrail, notes: builtPaperTrail.notes || (f.prior.paperTrail?.notes || '') } };
            return { ...f, prior };
        });
        onSave(updatedLibrary, updatedFsceors);
        onClose();
    };

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2200 }} onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl w-full m-4 flex flex-col" style={{ maxWidth: '900px', height: '80vh' }} onClick={e => e.stopPropagation()}>
                <div className="p-6 flex flex-col flex-1 min-h-0">
                    <div className="flex items-center justify-between mb-3 flex-shrink-0">
                        <h2 className="text-lg font-bold text-gray-800">Edit Distributions &mdash; {source.name}</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <div className="border border-amber-300 bg-amber-50 rounded p-3 mb-3 text-sm text-amber-800 space-y-1 flex-shrink-0">
                        <p>Distributions used by a <strong>locked</strong> Tracked Item cannot be edited here (shown greyed out below).</p>
                        <p>Editing a distribution and saving will also update the prior of every non-locked Tracked Item currently using it.</p>
                    </div>
                    {local.length === 0 ? (
                        <div className="text-sm text-gray-400 italic p-4">No prior library entries are associated with this source.</div>
                    ) : (
                        <div className="flex-1 overflow-y-auto border rounded min-h-0 divide-y">
                            {local.map(row => {
                                const info = usageInfo(row.id);
                                const locked = info.status === 'locked';
                                const distType = normalizedDistType(row.distType);
                                const distInfo = getDistributionInfo(distType);
                                return (
                                    <div key={row.id} className={`p-3 ${locked ? 'opacity-60 bg-gray-50' : ''}`}>
                                        <div className="flex items-start justify-between gap-2 mb-2">
                                            <div className="text-sm font-medium min-w-0 truncate">{row.system} / {row.sscType} / {row.componentType} / {row.failMode}</div>
                                            <span className={`text-xs px-2 py-0.5 rounded-full flex-shrink-0 ${STATUS_STYLE[info.status]}`}>{info.label}</span>
                                        </div>
                                        {row.desc && <div className="text-xs text-gray-500 mb-2">{row.desc}</div>}
                                        <div className="grid grid-cols-3 gap-2">
                                            <div>
                                                <label className="block text-xs text-gray-600 mb-1">Distribution</label>
                                                <select disabled={locked} className="w-full px-2 py-1.5 border rounded text-sm disabled:bg-gray-100 disabled:text-gray-400"
                                                        value={distType} onChange={e => setRow(row.id, { distType: e.target.value })}>
                                                    {DISTRIBUTION_TYPES.map(d => <option key={d.value} value={d.value}>{d.label}</option>)}
                                                </select>
                                            </div>
                                            {distType === 'CNI' ? (
                                                <div>
                                                    <label className="block text-xs text-gray-600 mb-1">Mean</label>
                                                    <input disabled={locked} className="w-full px-2 py-1.5 border rounded text-sm font-mono disabled:bg-gray-100 disabled:text-gray-400"
                                                           value={row.mean || ''} onChange={e => setRow(row.id, { mean: e.target.value })} />
                                                </div>
                                            ) : (
                                                <React.Fragment>
                                                    <div>
                                                        <label className="block text-xs text-gray-600 mb-1">{distInfo.param1Label}</label>
                                                        <input disabled={locked} className="w-full px-2 py-1.5 border rounded text-sm font-mono disabled:bg-gray-100 disabled:text-gray-400"
                                                               value={row.shape || ''} onChange={e => setRow(row.id, { shape: e.target.value })} />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-600 mb-1">{distInfo.param2Label}</label>
                                                        <input disabled={locked} className="w-full px-2 py-1.5 border rounded text-sm font-mono disabled:bg-gray-100 disabled:text-gray-400"
                                                               value={row.scale || ''} onChange={e => setRow(row.id, { scale: e.target.value })} />
                                                    </div>
                                                </React.Fragment>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    <div className="flex justify-end gap-2 mt-4 flex-shrink-0">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                        <button onClick={commitSave} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                    </div>
                </div>
            </div>
        </div>
    );
}

function sourceDisplayLabel(s) {
    const typeLabel = SOURCE_TYPES.find(t => t.value === s.type)?.label || s.type;
    const idPart = s.docId ? s.docId + ' \u2014 ' : '';
    return `[${typeLabel}] ${idPart}${s.name}`;
}

// Resolves a prior's Digital Identifier to a display string, including the SELF_SPECIFIED_SOURCE
// sentinel (CNI/User-Specified priors with no external source) which doesn't exist in sourceById.
function priorDigitalIdentifierLabel(prior, sourceById) {
    const id = prior?.paperTrail?.sourceId;
    if (!id) return '';
    if (id === SELF_SPECIFIED_SOURCE) {
        return prior.sourceType === 'cni' ? 'Mean value specified by the user' : 'Distribution specified by the user';
    }
    return (sourceById.get(id) || {}).name || '';
}
