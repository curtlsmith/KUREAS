// Modal for managing the project's deduplicated Sources of Information library directly,
// independent of editing any individual event occurrence rate's prior or data.
function SourcesManagerModal({ sources, fsceors, priorLibrary, onUpdateLibraryAndFsceors, onSave, onClose }) {
    const [local, setLocal] = useState(JSON.parse(JSON.stringify(sources || [])));
    const [editing, setEditing] = useState(null); // null | 'new' | source object
    const [deleteTarget, setDeleteTarget] = useState(null);
    const [notice, setNotice] = useState(null);

    const usageCount = (id) => {
        let count = 0;
        (fsceors || []).forEach(f => {
            if (f.prior?.paperTrail?.sourceId === id) count++;
            (f.operationalData || []).forEach(d => { if (d.sourceId === id) count++; });
        });
        return count;
    };

    const saveSource = (src) => {
        setLocal(prev => {
            const exists = prev.some(s => s.id === src.id);
            return exists ? prev.map(s => s.id === src.id ? src : s) : [...prev, src];
        });
        setEditing(null);
    };
    const requestDelete = (src) => {
        const count = usageCount(src.id);
        if (count > 0) {
            setNotice({ title: 'Cannot Delete', message: `This source is referenced by ${count} event occurrence rate field(s) (prior or operational data). Remove those references first.` });
            return;
        }
        setDeleteTarget(src);
    };
    const commitDelete = () => setLocal(prev => prev.filter(s => s.id !== deleteTarget.id));

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl w-full m-4 max-h-[92vh] overflow-y-auto" style={{ maxWidth: '1000px' }} onClick={e => e.stopPropagation()}>
                <div className="p-6">
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold text-gray-800">Sources of Information</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <p className="text-xs text-gray-500 mb-4">The deduplicated library of sources referenced by priors and operational data across this project. A source can only be deleted if it is not currently referenced anywhere.</p>
                    <button onClick={() => setEditing('new')} className="flex items-center gap-1 px-3 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 mb-3">
                        <PlusIcon /> Add Source
                    </button>
                    <div className="border rounded max-h-[60vh] overflow-y-auto">
                        {local.length === 0 && <div className="p-4 text-sm text-gray-400 italic">No sources defined yet.</div>}
                        {local.map(s => (
                            <div key={s.id} className="flex items-start justify-between gap-3 px-3 py-2 border-b hover:bg-gray-50">
                                <div className="min-w-0 flex-1">
                                    <div className="text-sm font-semibold truncate">
                                        [{SOURCE_TYPES.find(t => t.value === s.type)?.label || s.type}]
                                        {s.docId && <span className="font-mono text-gray-600"> {s.docId}</span>}
                                        {' \u2014 '}{s.name}
                                    </div>
                                    {s.description && <div className="text-xs text-gray-500 truncate">{s.description}</div>}
                                </div>
                                <div className="flex gap-2 flex-shrink-0">
                                    <button onClick={() => setEditing(s)} className="text-xs text-blue-600 hover:underline">edit</button>
                                    <button onClick={() => requestDelete(s)} className="text-xs text-red-600 hover:underline font-bold" title="Delete">X</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="flex justify-end gap-2 mt-6">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                        <button onClick={() => { onSave(local); onClose(); }} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                    </div>
                </div>
            </div>
            {editing && (
                <SourceFormModal initial={editing === 'new' ? null : editing} priorLibrary={priorLibrary} fsceors={fsceors}
                                 onUpdateLibraryAndFsceors={onUpdateLibraryAndFsceors} onSave={saveSource} onClose={() => setEditing(null)} />
            )}
            {deleteTarget && (
                <ConfirmModal title="Delete Source" danger confirmLabel="Delete"
                              message={`Delete source "${deleteTarget.name}"? This cannot be undone.`}
                              onConfirm={commitDelete} onClose={() => setDeleteTarget(null)} />
            )}
            {notice && <AlertModal title={notice.title} message={notice.message} onClose={() => setNotice(null)} />}
        </div>
    );
}

/* ============================================================================
   PRIOR LIBRARY (imported from .relDB files)
   ============================================================================ */
// Parses the same multi-source .relDB format used elsewhere in KUREAS: zero or more
// "source id:" / "source name:" / "source description:" header blocks (each starting
// a new source, flushed on the next "source id:" line or end of file), followed by
// data rows of 10 columns, optionally followed by an 11th column that references a
// specific source's id for that row (rows without it fall back to the first source).
function parseRelDBText(text) {
    const sources = []; // { id, name, description }
    let pendingId = null, pendingName = '', pendingDesc = '';
    const flushPending = () => {
        if (pendingId !== null || pendingName) {
            sources.push({ id: pendingId || ('SOURCE-' + (sources.length + 1)), name: pendingName, description: pendingDesc });
        }
        pendingId = null; pendingName = ''; pendingDesc = '';
    };
    const rawRows = [];
    text.split(/\r?\n/).forEach(rawLine => {
        const line = rawLine.trim();
        if (!line) return;
        if (line.startsWith('*')) return;
        const ll = line.toLowerCase();
        if (ll.startsWith('source id:')) { flushPending(); pendingId = line.substring('source id:'.length).trim(); return; }
        if (ll.startsWith('source name:')) { pendingName = line.substring('source name:'.length).trim(); return; }
        if (ll.startsWith('source description:')) { pendingDesc = line.substring('source description:'.length).trim(); return; }
        const values = [];
        let current = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') { inQ = !inQ; }
            else if (ch === ',' && !inQ) { values.push(current.trim()); current = ''; }
            else { current += ch; }
        }
        values.push(current.trim());
        const cv = values.map(v => v.replace(/^["']|["']$/g, ''));
        if (cv.length >= 10) {
            // NOTE: for Gamma rows, this column (the .relDB format's own header calls it
            // "Distribution Scale Parameter (beta)") is actually the RATE parameter (beta =
            // 1/theta), not the scale theta itself -- confirmed against sample data, where
            // mean = shape / this raw value, not mean = shape * this raw value. Rather than
            // transform it here, it's kept exactly as it appears in the source file (for
            // fidelity/traceability back to the document), and the GUI's Gamma "Scale" field is
            // labeled "Rate (1/Scale)" and buildEffectivePrior treats it as a rate directly --
            // see those for the other half of this fix.
            rawRows.push({
                system: cv[0], sscType: cv[1], componentType: cv[2], failMode: cv[3], desc: cv[4],
                units: cv[5], distType: cv[6], mean: cv[7], shape: cv[8], scale: cv[9],
                facility: '', // relDB has no facility-level concept; may be overridden at import time
                rowSourceRef: cv.length >= 11 ? cv[10].trim() : ''
            });
        }
    });
    flushPending();
    // Resolve each row's source reference to the matching header source id (default: first source)
    const defaultSourceId = sources.length > 0 ? sources[0].id : null;
    const validIds = new Set(sources.map(s => s.id));
    const rows = rawRows.map(r => {
        const { rowSourceRef, ...rest } = r;
        return { ...rest, resolvedSourceRef: (rowSourceRef && validIds.has(rowSourceRef)) ? rowSourceRef : defaultSourceId };
    });
    return { sources, rows };
}

// Merge System / Component / Failure Mode names found in imported .relDB rows into the
// project hierarchy. Facility has no equivalent in the .relDB format, so an optional
// facilityName (chosen by the user at import time) can be applied uniformly to every row;
// left blank, imported Systems remain facility-independent as before.
// Dedups by name (case-insensitive) within the same parent.
function mergeHierarchyFromRelDBRows(hierarchy, rows, facilityName) {
    const next = {
        facility: [...(hierarchy.facility || [])], system: [...(hierarchy.system || [])],
        component: [...(hierarchy.component || [])], failureModeLevel: [...(hierarchy.failureModeLevel || [])]
    };
    const findOrCreate = (level, name, parentId) => {
        const trimmed = (name || '').trim();
        if (!trimmed) return null;
        const normParent = parentId || null;
        let node = next[level].find(n => n.name.toLowerCase() === trimmed.toLowerCase() && (n.parentId || null) === normParent);
        if (!node) {
            node = { id: uid(level), name: trimmed, description: '', color: '#000000', parentId: normParent };
            next[level] = [...next[level], node];
        }
        return node;
    };
    const facNode = facilityName ? findOrCreate('facility', facilityName, null) : null;
    (rows || []).forEach(r => {
        const sysNode = findOrCreate('system', r.system, facNode ? facNode.id : null);
        const compNode = sysNode ? findOrCreate('component', r.componentType, sysNode.id) : null;
        // Failure Mode node is named from the short failMode text (e.g. "Fails to Operate (FTOP)"), falling back
        // to desc only when failMode is blank -- same precedence as resolveHierarchyForLibraryRow, so import and
        // add-from-library resolve to the same node instead of creating a second, description-named one.
        if (compNode) findOrCreate('failureModeLevel', (r.failMode || '').trim() || r.desc, compNode.id);
    });
    return next;
}

// Parses an .xlsx file matching the column layout produced by Export > Excel, and merges
// Facility/System/Component/Failure-Mode-Level names into the project hierarchy. When the
// richer prior-detail columns (Prior Source Type / Prior Distribution Type / Prior Mean /
// Prior Param 1 / Prior Param 2) are present, the original prior is reconstructed faithfully;
// otherwise (e.g. an older export, or a "Non-Informative" prior with no parameters to carry
// forward) entries fall back to a CNI prior using the posterior mean as a starting point.
function parseExcelExportRows(arrayBuffer) {
    const XLSX = window.XLSX;
    if (!XLSX) return { ok: false, message: 'Excel import library failed to load. Check your network connection.' };
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    const sheetName = wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
    if (!json.length) return { ok: false, message: 'No rows found in the Excel file.' };
    const rows = json.map(r => ({
        facility: r['Facility'] || '', system: r['System'] || '', component: r['Component'] || '',
        failureModeLevel: r['Failure Mode Level'] || '', description: r['Description'] || '',
        eventName: String(r['Event Name'] || '').trim().substring(0, EVENT_NAME_MAX_LENGTH),
        units: r['Units'] || '', posteriorMean: r['Posterior Mean'],
        priorSourceType: r['Prior Source Type'] || '', priorDistType: r['Prior Distribution Type'] || '',
        priorMean: r['Prior Mean'], priorParam1: r['Prior Param 1'], priorParam2: r['Prior Param 2'],
        digitalIdentifier: r['Prior Digital Identifier'] || ''
    }));
    return { ok: true, rows };
}

function mergeHierarchyFromExcelRows(hierarchy, rows) {
    const next = {
        facility: [...(hierarchy.facility || [])], system: [...(hierarchy.system || [])],
        component: [...(hierarchy.component || [])], failureModeLevel: [...(hierarchy.failureModeLevel || [])]
    };
    const findOrCreate = (level, name, parentId) => {
        const trimmed = (name || '').trim();
        if (!trimmed || trimmed === 'N/A') return null;
        const normParent = parentId || null;
        let node = next[level].find(n => n.name.toLowerCase() === trimmed.toLowerCase() && (n.parentId || null) === normParent);
        if (!node) {
            node = { id: uid(level), name: trimmed, description: '', color: '#000000', parentId: normParent };
            next[level] = [...next[level], node];
        }
        return node;
    };
    (rows || []).forEach(r => {
        const facNode = findOrCreate('facility', r.facility, null);
        const sysNode = findOrCreate('system', r.system, facNode ? facNode.id : null);
        const compNode = sysNode ? findOrCreate('component', r.component, sysNode.id) : null;
        if (compNode) findOrCreate('failureModeLevel', r.failureModeLevel, compNode.id);
    });
    return next;
}

// Browses the ENTIRE Prior Library in a sortable/filterable grid, letting the user check off
// several entries at once and add a Tracked Item for each in one action -- distinct from
// PriorLibraryPickerModal, which picks exactly one entry for a single prior already being
// edited. Opened from NewFSCEORModal's "View Entire Prior Library" button.
function PriorLibraryBrowserModal({ library, sources, fsceors, onAddMany, onClose }) {
    const rows = library || [];
    const sourceById = new Map((sources || []).map(s => [s.id, s]));
    const usedLibraryRowIds = new Set((fsceors || []).map(f => f.prior?.paperTrail?.libraryRowId).filter(Boolean));
    const [search, setSearch] = useState('');
    const [sortKey, setSortKey] = useState('system');
    const [sortDir, setSortDir] = useState('asc');
    const [selected, setSelected] = useState(new Set());
    const [confirmDuplicates, setConfirmDuplicates] = useState(null); // rows to add, pending confirmation

    const sourceName = (r) => (sourceById.get(r.sourceId) || {}).name || '';

    // Column widths are user-resizable (drag the handle on the right edge of a header cell);
    // the checkbox column is intentionally not in here -- it stays a fixed narrow width.
    const [colWidths, setColWidths] = useState({
        facility: 110, system: 110, componentType: 130, failMode: 160, distType: 100, mean: 100, units: 100, sourceName: 150
    });
    const startResize = (key, e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startWidth = colWidths[key];
        const onMove = (ev) => setColWidths(prev => ({ ...prev, [key]: Math.max(40, startWidth + (ev.clientX - startX)) }));
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    };

    const filtered = useMemo(() => {
        let list = rows;
        if (search.trim()) {
            const t = search.toLowerCase();
            list = list.filter(r => [r.facility, r.system, r.sscType, r.componentType, r.failMode, r.desc, sourceName(r)]
                .some(v => (v || '').toLowerCase().includes(t)));
        }
        return list.slice().sort((a, b) => {
            let cmp;
            if (sortKey === 'mean') {
                const av = parseFloat(libraryRowMean(a)), bv = parseFloat(libraryRowMean(b));
                cmp = (isNaN(av) ? -Infinity : av) - (isNaN(bv) ? -Infinity : bv);
            } else {
                const av = (sortKey === 'sourceName' ? sourceName(a) : (a[sortKey] ?? '')).toString().toLowerCase();
                const bv = (sortKey === 'sourceName' ? sourceName(b) : (b[sortKey] ?? '')).toString().toLowerCase();
                cmp = av.localeCompare(bv);
            }
            return sortDir === 'asc' ? cmp : -cmp;
        });
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [rows, search, sortKey, sortDir, sources]);

    const toggleRow = (id) => setSelected(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });
    const toggleAllShown = () => setSelected(prev => {
        const allShown = filtered.every(r => prev.has(r.id));
        if (allShown) { const s = new Set(prev); filtered.forEach(r => s.delete(r.id)); return s; }
        const s = new Set(prev); filtered.forEach(r => s.add(r.id)); return s;
    });

    const handleSort = (key) => {
        if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortKey(key); setSortDir('asc'); }
    };
    const SortHeader = ({ label, sortKeyName }) => (
        <th className="p-2 text-left font-semibold cursor-pointer select-none hover:bg-gray-200 whitespace-nowrap relative"
            style={{ width: colWidths[sortKeyName] }} onClick={() => handleSort(sortKeyName)}>
            {label} {sortKey === sortKeyName ? (sortDir === 'asc' ? '\u25B2' : '\u25BC') : ''}
            <span onMouseDown={e => { e.stopPropagation(); startResize(sortKeyName, e); }} onClick={e => e.stopPropagation()}
                  className="absolute top-0 right-0 h-full w-1.5 cursor-col-resize hover:bg-blue-400" />
        </th>
    );

    const allShownSelected = filtered.length > 0 && filtered.every(r => selected.has(r.id));

    const commitAdd = (rowsToAdd) => { onAddMany(rowsToAdd); onClose(); };
    const requestAdd = () => {
        const rowsToAdd = filtered.filter(r => selected.has(r.id));
        const duplicates = rowsToAdd.filter(r => usedLibraryRowIds.has(r.id));
        if (duplicates.length > 0) { setConfirmDuplicates(rowsToAdd); return; }
        commitAdd(rowsToAdd);
    };

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2100 }} onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl w-full m-4 flex flex-col" style={{ maxWidth: '1700px', width: 'min(1700px, 97vw)', height: '90vh' }} onClick={e => e.stopPropagation()}>
                <div className="p-6 flex flex-col flex-1 min-h-0">
                    <div className="flex items-center justify-between mb-3 flex-shrink-0">
                        <h2 className="text-lg font-bold text-gray-800">Prior Library</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <p className="text-xs text-gray-500 mb-2 flex-shrink-0">Check any entries below and click "Add Selected" to create a Tracked Item for each, pre-filled with that entry's source, distribution, and parameters (matching or creating Hierarchy Assignment nodes as needed). Click a column header to sort, or drag its right edge to resize.</p>
                    <input className="w-full px-3 py-2 border rounded text-sm mb-2 flex-shrink-0" placeholder="Filter by facility, system, component, failure mode, description, or source..." value={search} onChange={e => setSearch(e.target.value)} />
                    <div className="text-xs text-gray-500 mb-2 flex-shrink-0">{selected.size} selected &mdash; {filtered.length} of {rows.length} entries shown</div>
                    <div className="flex-1 overflow-auto border rounded min-h-0">
                        <table className="text-sm border-collapse" style={{ tableLayout: 'fixed', width: '100%' }}>
                            <thead className="bg-gray-100 sticky top-0 z-10">
                                <tr>
                                    <th className="p-2" style={{ width: 36 }}><input type="checkbox" checked={allShownSelected} onChange={toggleAllShown} title="Select/deselect all shown" /></th>
                                    <SortHeader label="Facility" sortKeyName="facility" />
                                    <SortHeader label="System" sortKeyName="system" />
                                    <SortHeader label="Component" sortKeyName="componentType" />
                                    <SortHeader label="Failure Mode" sortKeyName="failMode" />
                                    <SortHeader label="Distribution" sortKeyName="distType" />
                                    <SortHeader label="Mean" sortKeyName="mean" />
                                    <SortHeader label="Units" sortKeyName="units" />
                                    <SortHeader label="Source" sortKeyName="sourceName" />
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.length === 0 && (
                                    <tr><td colSpan="9" className="p-4 text-center text-gray-400 italic">No matching entries.</td></tr>
                                )}
                                {filtered.map(r => (
                                    <tr key={r.id} className={`border-t cursor-pointer hover:bg-blue-50 ${selected.has(r.id) ? 'bg-blue-50' : ''}`} onClick={() => toggleRow(r.id)}>
                                        <td className="p-2" onClick={e => e.stopPropagation()}><input type="checkbox" checked={selected.has(r.id)} onChange={() => toggleRow(r.id)} /></td>
                                        <td className="p-2 truncate" title={r.facility}>{r.facility || '-'}</td>
                                        <td className="p-2 truncate" title={r.system}>{r.system}</td>
                                        <td className="p-2 truncate" title={r.componentType}>{r.componentType}</td>
                                        <td className="p-2 truncate" title={r.failMode}>{r.failMode}</td>
                                        <td className="p-2 truncate" title={r.distType}>{r.distType}</td>
                                        <td className="p-2 font-mono truncate">{formatValue(libraryRowMean(r))}</td>
                                        <td className="p-2 truncate">{libraryUnitLabel(r.units)}</td>
                                        <td className="p-2 truncate" title={sourceName(r)}>{sourceName(r) || '-'}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div className="flex justify-end gap-2 mt-4 flex-shrink-0">
                        <button onClick={onClose} className="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                        <button onClick={requestAdd}
                                disabled={selected.size === 0}
                                className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                            Add {selected.size > 0 ? selected.size : ''} Selected as Tracked Items
                        </button>
                    </div>
                </div>
            </div>
            {confirmDuplicates && (() => {
                const dupCount = confirmDuplicates.filter(r => usedLibraryRowIds.has(r.id)).length;
                return (
                    <ConfirmModal title="Distribution Already Used"
                                  message={`${dupCount} of the selected distribution${dupCount === 1 ? ' is' : 's are'} already used by an existing Tracked Item. Add ${dupCount === 1 ? 'it' : 'them'} again anyway?`}
                                  confirmLabel="Add Anyway" onConfirm={() => commitAdd(confirmDuplicates)} onClose={() => setConfirmDuplicates(null)} />
                );
            })()}
        </div>
    );
}

function PriorLibraryPickerModal({ library, sources, initialFacility, initialSystem, initialComponent, initialFailureMode, currentPrior, onPick, onClose }) {
    const rows = library || [];
    const sourceById = new Map((sources || []).map(s => [s.id, s]));
    const [search, setSearch] = useState('');
    // A library row "is" the prior's current selection when it's the exact row applyLibraryRow
    // was called with -- library rows get a unique id at import time, and that id is recorded
    // on the prior when applied, so this doesn't depend on the row's numbers being unique. Older
    // priors applied before rows carried an id have no exact reference to fall back on, so for
    // those only, approximate by source + distribution + parameters (which can occasionally
    // multi-match if the library happens to contain identical entries under the same source).
    const rowMatchesCurrentPrior = (r) => {
        if (!currentPrior || !currentPrior.paperTrail?.sourceId) return false;
        if (currentPrior.paperTrail.libraryRowId) return r.id === currentPrior.paperTrail.libraryRowId;
        if (r.sourceId !== currentPrior.paperTrail.sourceId) return false;
        const dtMap = { beta: 'Beta', gamma: 'Gamma', lognormal: 'Lognormal', cni: 'CNI', o: 'CNI' };
        const rowDistType = dtMap[(r.distType || '').toLowerCase()] || '';
        if ((currentPrior.distributionType || '') !== rowDistType) return false;
        if (rowDistType === 'CNI') return String(currentPrior.mean ?? '') === String(r.mean ?? '');
        return String(currentPrior.param1 ?? '') === String(r.shape ?? '') && String(currentPrior.param2 ?? '') === String(r.scale ?? '');
    };
    // Drill-down filters, in hierarchy order. Priors imported via Import carry these as plain
    // text (system/componentType/failMode strings scraped from the source file), not project
    // hierarchy ids, so the options for each level are the distinct values actually present in
    // the library -- filtered down by whichever levels above it are already chosen. Source is
    // filtered independently (it doesn't cascade through the hierarchy levels).
    //
    // Pre-populated from the event occurrence rate's own Hierarchy Assignment (see PriorEditor's
    // resolvedItemName), but only as far as the library actually has a matching entry at that
    // level under whatever ALREADY MATCHED above it -- not under the raw assignment. This
    // matters because a level with no match in the library (e.g. Facility, on older data
    // imported before facilities were tracked) must not block every level below it from still
    // matching independently; each check below deliberately uses the previous level's validated
    // result rather than the raw initial* prop.
    const matchedFacility = (() => {
        const want = (initialFacility || '').trim();
        return want && rows.some(r => (r.facility || '').trim() === want) ? want : '';
    })();
    const matchedSystem = (() => {
        const want = (initialSystem || '').trim();
        const candidates = rows.filter(r => !matchedFacility || (r.facility || '').trim() === matchedFacility);
        return want && candidates.some(r => (r.system || '').trim() === want) ? want : '';
    })();
    const matchedComponent = (() => {
        const want = (initialComponent || '').trim();
        const candidates = rows.filter(r => (!matchedFacility || (r.facility || '').trim() === matchedFacility) && (!matchedSystem || (r.system || '').trim() === matchedSystem));
        return want && candidates.some(r => (r.componentType || '').trim() === want) ? want : '';
    })();
    const matchedFailureMode = (() => {
        const want = (initialFailureMode || '').trim();
        if (!want) return '';
        const candidates = rows.filter(r => (!matchedFacility || (r.facility || '').trim() === matchedFacility) && (!matchedSystem || (r.system || '').trim() === matchedSystem)
            && (!matchedComponent || (r.componentType || '').trim() === matchedComponent));
        // The project hierarchy's Failure-Mode-Level node is sometimes named from a row's longer
        // description rather than its short failMode code (mergeHierarchyFromRelDBRows prefers
        // desc when present), so try an exact failMode match first, then fall back to matching
        // by description -- but resolve either way to that row's actual failMode value, since
        // failureModeOptions below (and the <select>'s options) are built from failMode, not
        // desc, and setting the select's value to text that isn't one of its options just makes
        // the browser silently fall back to displaying the first option ("All").
        const direct = candidates.find(r => (r.failMode || '').trim() === want);
        if (direct) return (direct.failMode || '').trim();
        const viaDesc = candidates.find(r => (r.desc || '').trim() === want);
        return viaDesc ? (viaDesc.failMode || '').trim() : '';
    })();
    const [facility, setFacility] = useState(matchedFacility);
    const [system, setSystem] = useState(matchedSystem);
    const [component, setComponent] = useState(matchedComponent);
    const [failureMode, setFailureMode] = useState(matchedFailureMode);
    const [sourceFilter, setSourceFilter] = useState('');

    const distinctValues = (candidateRows, getter) => {
        const set = new Set();
        candidateRows.forEach(r => { const v = (getter(r) || '').trim(); if (v) set.add(v); });
        return Array.from(set).sort((a, b) => a.localeCompare(b));
    };
    const matchesFacility = r => !facility || (r.facility || '').trim() === facility;
    const matchesSystem = r => !system || (r.system || '').trim() === system;
    const matchesComponent = r => !component || (r.componentType || '').trim() === component;
    const matchesFailureMode = r => !failureMode || (r.failMode || '').trim() === failureMode;
    const matchesSource = r => !sourceFilter || (r.sourceId || '') === sourceFilter;

    const facilityOptions = distinctValues(rows, r => r.facility);
    const systemOptions = distinctValues(rows.filter(matchesFacility), r => r.system);
    const componentOptions = distinctValues(rows.filter(r => matchesFacility(r) && matchesSystem(r)), r => r.componentType);
    const failureModeOptions = distinctValues(rows.filter(r => matchesFacility(r) && matchesSystem(r) && matchesComponent(r)), r => r.failMode);
    const sourceIdOptions = Array.from(new Set(
        rows.filter(r => matchesFacility(r) && matchesSystem(r) && matchesComponent(r) && matchesFailureMode(r)).map(r => r.sourceId).filter(Boolean)
    )).sort((a, b) => {
        const la = (sourceById.get(a) || {}).name || a, lb = (sourceById.get(b) || {}).name || b;
        return la.localeCompare(lb);
    });

    // Picking a level clears any already-chosen descendant levels, since they were only valid
    // relative to the old parent selection.
    const handleFacilityChange = v => { setFacility(v); setSystem(''); setComponent(''); setFailureMode(''); };
    const handleSystemChange = v => { setSystem(v); setComponent(''); setFailureMode(''); };
    const handleComponentChange = v => { setComponent(v); setFailureMode(''); };

    const drilled = rows.filter(r => matchesFacility(r) && matchesSystem(r) && matchesComponent(r) && matchesFailureMode(r) && matchesSource(r));
    const filtered = drilled.filter(r => {
        if (!search.trim()) return true;
        const t = search.toLowerCase();
        return [r.system, r.sscType, r.componentType, r.desc].some(v => (v || '').toLowerCase().includes(t));
    });
    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 2100 }} onClick={onClose}>
            {/* Fixed height (not max-height) so the dialog stays one size regardless of how many
                entries the filters leave -- only the results list scrolls internally. */}
            <div className="bg-white rounded-lg shadow-xl w-full m-4 flex flex-col" style={{ maxWidth: '860px', height: '80vh' }} onClick={e => e.stopPropagation()}>
                <div className="p-6 flex flex-col flex-1 min-h-0">
                    <div className="flex items-center justify-between mb-3">
                        <h2 className="text-lg font-bold text-gray-800">Select Prior from Library</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <div className="grid grid-cols-5 gap-2 mb-2">
                        <div>
                            <label className="block text-xs font-medium mb-1 text-gray-600">Facility</label>
                            <select className="w-full px-2 py-1.5 border rounded text-sm" value={facility} onChange={e => handleFacilityChange(e.target.value)}>
                                <option value="">All</option>
                                {facilityOptions.map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-medium mb-1 text-gray-600">System</label>
                            <select className="w-full px-2 py-1.5 border rounded text-sm" value={system} onChange={e => handleSystemChange(e.target.value)}>
                                <option value="">All</option>
                                {systemOptions.map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-medium mb-1 text-gray-600">Component</label>
                            <select className="w-full px-2 py-1.5 border rounded text-sm" value={component} onChange={e => handleComponentChange(e.target.value)}>
                                <option value="">All</option>
                                {componentOptions.map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-medium mb-1 text-gray-600">Failure Mode</label>
                            <select className="w-full px-2 py-1.5 border rounded text-sm" value={failureMode} onChange={e => setFailureMode(e.target.value)}>
                                <option value="">All</option>
                                {failureModeOptions.map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-medium mb-1 text-gray-600">Source</label>

function PriorEditor({ prior, failureModel, sources, priorLibrary, hierarchy, itemHierarchy, onChange, onAddSource, onLog, locked }) {
    const p = prior || { sourceType: 'noninformative' };
    const set = (patch) => onChange({ ...p, ...patch });
    const applicableDistTypes = DISTRIBUTION_TYPES.filter(d => {
        if (d.value === 'Lognormal') return true;
        if (failureModel === 'binomial') return d.value === 'Beta' || d.value === 'CNI';
        return d.value === 'Gamma' || d.value === 'CNI';
    });
    const distInfo = getDistributionInfo(p.distributionType);
    const [showLibrary, setShowLibrary] = useState(false);

    // Resolves this event occurrence rate's own Hierarchy Assignment to plain names, so the
    // Prior Library picker can be opened pre-filtered to the same facility/system/component/
    // failure mode rather than starting from "All" every time. nodeName returns the sentinels
    // 'N/A' (level not assigned) / '(unknown)' (stale id) for anything that isn't a real
    // assignment -- neither should be treated as a filter value.
    const resolvedItemName = (level) => {
        const n = hierarchy ? nodeName(hierarchy, level, (itemHierarchy || {})[level + 'Id']) : '';
        return (n === 'N/A' || n === '(unknown)') ? '' : n;
    };

    const applyLibraryRow = (row) => {
        // sourceType is intentionally dropped here (not applied) -- this only changes the
        // distribution/parameters/paperTrail, preserving whichever of Informed/User-Specified
        // the user already had selected on this prior.
        const { sourceType, paperTrail: builtPaperTrail, ...rest } = buildPriorFromLibraryRow(row, failureModel);
        set({ ...rest, paperTrail: { ...(p.paperTrail || {}), ...builtPaperTrail, notes: builtPaperTrail.notes || (p.paperTrail?.notes || '') } });
        onLog && onLog('The prior distribution and parameters were loaded from the library.');
    };

    const handleSourceTypeChange = (newVal) => {
        const label = v => (PRIOR_SOURCE_TYPES.find(t => t.value === v) || {}).label || v || '(none)';
        const oldVal = p.sourceType;
        set({ sourceType: newVal });
        onLog && onLog(`Prior Distribution Type changed from "${label(oldVal)}" to "${label(newVal)}".`);
    };
    const handleDistributionTypeChange = (newVal) => {
        const oldVal = p.distributionType;
        set({ distributionType: newVal });
        onLog && onLog(`Prior distribution changed from "${oldVal || '(none)'}" to "${newVal || '(none)'}".`);
    };
    const handleSourceSelect = (newSourceId) => {
        set({ paperTrail: { ...(p.paperTrail || {}), sourceId: newSourceId } });
        onLog && onLog('The prior digital identifier (source) was changed.');
    };

    // CNI and User-Specified priors have no meaningful external source of information, but the
    // Digital Identifier field is still shown for them (per Curtis) so the record can note that
    // explicitly, via a sentinel option, rather than leaving it blank/ambiguous.
    const selfSpecifiedOption = p.sourceType === 'cni' ? { value: SELF_SPECIFIED_SOURCE, label: 'Mean value specified by the user' }
        : p.sourceType === 'userSpecified' ? { value: SELF_SPECIFIED_SOURCE, label: 'Distribution specified by the user' }
        : null;

    return (
        <fieldset disabled={locked} className={locked ? 'opacity-60' : ''}>
            <div className="space-y-3">
                <div className={`grid gap-4 ${p.sourceType === 'cni' ? 'grid-cols-3' : 'grid-cols-2'}`}>
                    <div>
                        <label className="block text-sm font-medium mb-1">Prior Distribution Type</label>
                        <select className="w-full px-3 py-2 border rounded text-sm" value={p.sourceType || 'noninformative'}
                                onChange={e => handleSourceTypeChange(e.target.value)}>
                            {PRIOR_SOURCE_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                        </select>
                        {p.sourceType === 'informed' && (
                            <div className="mt-2">
                                <button type="button" disabled={!priorLibrary || priorLibrary.length === 0} onClick={() => setShowLibrary(true)}
                                        className="w-full px-3 py-2 bg-blue-900 text-white rounded text-sm hover:bg-blue-800 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Select from Imported Prior Library&hellip;
                                </button>
                                {(!priorLibrary || priorLibrary.length === 0) ? (
                                    <p className="text-xs text-gray-500 italic mt-1">No prior data has been imported yet &mdash; use Import to load a .relDB file.</p>
                                ) : (
                                    <p className="text-xs text-gray-500 mt-1">{priorLibrary.length} imported {priorLibrary.length === 1 ? 'entry' : 'entries'} available.</p>
                                )}
                            </div>
                        )}
                    </div>
                    {p.sourceType === 'noninformative' && (
                        <div className="mt-6 text-xs text-gray-500 italic p-2 bg-gray-50 rounded">
                            Uses a Jeffreys non-informative prior: {failureModel === 'binomial' ? 'Beta(0.5, 0.5)' : 'Gamma(0.5, rate&nbsp;=&nbsp;0)'.replace('&nbsp;', ' ')}. No parameters required. There is no source of information to record for this selection.
                        </div>
                    )}
                    {p.sourceType === 'cni' && (
                        <div>
                            <label className="block text-sm font-medium mb-1">Mean (required)</label>
                            <BlurLoggedField className="w-full px-3 py-2 border rounded text-sm font-mono" value={p.mean || ''} onChange={(v) => set({ mean: v })} placeholder="e.g. 1E-3"
                                   onCommit={(oldV, newV) => onLog && onLog(`Prior mean changed from ${oldV || '(none)'} to ${newV || '(none)'}.`)} />

                                           onCommit={(oldV, newV) => onLog && onLog(`Prior mean changed from ${oldV || '(none)'} to ${newV || '(none)'}.`)} />
                                </div>

                                <React.Fragment>

                                        <BlurLoggedField className="w-full px-3 py-2 border rounded text-sm font-mono" value={p.param1 || ''} onChange={(v) => set({ param1: v })}
                                               onCommit={(oldV, newV) => onLog && onLog(`Prior ${(distInfo.param1Label || 'parameter 1').toLowerCase()} changed from ${oldV || '(none)'} to ${newV || '(none)'}.`)} />

// Validates one operational data entry's numeric fields for basic physical sanity -- a non-empty
// field that fails a check is flagged; an empty field is left alone (not every entry fills in
// every field as it's being built, and BlurLoggedField already treats blank as 0 downstream).
function validateOperationalDataEntry(entry) {
    const errors = [];
    const provided = (v) => (v ?? '').toString().trim() !== '';
    if (entry.opDataType === 'demandsAndFailures') {
        const demands = parseFloat(entry.demands), failures = parseFloat(entry.failures);
        const demandsOk = provided(entry.demands), failuresOk = provided(entry.failures);
        if (demandsOk) {
            if (isNaN(demands) || !Number.isInteger(demands)) errors.push('Number of Demands must be a whole number.');
            else if (demands < 0) errors.push('Number of Demands cannot be negative.');
        }
        if (failuresOk) {
            if (isNaN(failures) || !Number.isInteger(failures)) errors.push('Number of Failures must be a whole number.');
            else if (failures < 0) errors.push('Number of Failures cannot be negative.');
        }
        if (demandsOk && failuresOk && !isNaN(demands) && !isNaN(failures) && demands < failures) {
            errors.push('Number of Demands cannot be less than Number of Failures.');
        }
    } else if (entry.opDataType === 'timeAndFailures') {
        const time = parseFloat(entry.opTime), failures = parseFloat(entry.failures);
        if (provided(entry.opTime)) {
            if (isNaN(time)) errors.push('Operational Time must be a number.');
            else if (time < 0) errors.push('Operational Time cannot be negative.');
        }
        if (provided(entry.failures)) {
            if (isNaN(failures) || !Number.isInteger(failures)) errors.push('Number of Failures must be a whole number.');
            else if (failures < 0) errors.push('Number of Failures cannot be negative.');
        }
    }
    return errors;
}
