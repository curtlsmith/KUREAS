/* ============================================================================
   VISUALIZE MODAL (occurrence rate vs. sorted hierarchy)
   ============================================================================ */
// Splits a hierarchyPathLabel-style string ("Facility: X > System: Y > ...") onto two lines for
// a Chart.js tick label (which accepts an array of strings as a multi-line label), breaking at
// whichever " > " boundary leaves the two resulting lines closest in length -- rather than a
// fixed character count, which could split a level's own "Label: Value" pair awkwardly.
function wrapHierarchyLabelForChart(label) {
    if (!label) return [''];
    const parts = label.split(' > ');
    if (parts.length <= 1) return [label];
    let bestSplit = 1, bestDiff = Infinity;
    for (let i = 1; i < parts.length; i++) {
        const line1 = parts.slice(0, i).join(' > ').length;
        const line2 = parts.slice(i).join(' > ').length;
        const diff = Math.abs(line1 - line2);
        if (diff < bestDiff) { bestDiff = diff; bestSplit = i; }
    }
    return [parts.slice(0, bestSplit).join(' > '), parts.slice(bestSplit).join(' > ')];
}

// Maps event occurrence rates to Visualize rows ({ f, label, posterior, model, color }), dropping
// any without a computable posterior mean, sorted reverse-alpha so A-Z reads top-down on the chart
// (a linear y axis puts index 0 at the bottom). Shared by VisualizeModal and the Report.
function buildVisualizeRows(fsceors, hierarchy) {
    const rows = (fsceors || []).map(f => {
        const fmInfo = getFailureModeInfo(f.failureMode);
        const posterior = computePosterior(f.prior, fmInfo.model, f.operationalData, f.units);
        const label = hierarchyPathLabel(hierarchy, f.hierarchy || {});
        const color = itemColorFromHierarchy(hierarchy, f.hierarchy || {});
        return { f, label, posterior, model: fmInfo.model, color };
    }).filter(r => r.posterior && r.posterior.mean != null);
    rows.sort((a, b) => b.label.localeCompare(a.label));
    return rows;
}

// Log-decade x-axis bounds enclosing every row's 5th-95th range.
function visualizeXRange(rows) {
    const los = rows.map(r => r.posterior.p05 ?? r.posterior.mean).filter(v => v > 0);
    const his = rows.map(r => r.posterior.p95 ?? r.posterior.mean).filter(v => v > 0);
    return {
        xMin: los.length ? Math.pow(10, Math.floor(Math.log10(Math.min(...los)))) : undefined,
        xMax: his.length ? Math.pow(10, Math.ceil(Math.log10(Math.max(...his)))) : undefined
    };
}

// Chart.js config for the occurrence-rate plot. opts: { xMin, xMax, fontSize, static }.
// static=true (Report image rendering) disables animation/responsiveness and paints a white
// background so the exported PNG is not transparent.
function buildOccurrenceRateChartConfig(rows, opts) {
    opts = opts || {};
    const range = (opts.xMin !== undefined || opts.xMax !== undefined) ? opts : visualizeXRange(rows);
    const font = opts.fontSize ? { size: opts.fontSize } : undefined;
    const rangeDatasets = rows.map((r, i) => ({
        type: 'line',
        data: [{ x: r.posterior.p05 ?? r.posterior.mean, y: i }, { x: r.posterior.p95 ?? r.posterior.mean, y: i }],
        borderColor: r.color, borderWidth: 3, pointRadius: 0, showLine: true, fill: false,
        order: 2, _isRange: true
    }));
    const meanDataset = {
        type: 'scatter', label: 'Mean',
        data: rows.map((r, i) => ({ x: r.posterior.mean, y: i })),
        backgroundColor: rows.map(r => r.color), borderColor: rows.map(r => r.color),
        // Demand-based (binomial) means are diamonds ('rectRot'); time-based (Poisson) stay circles.
        // Diamonds get a slightly larger radius so their visual size matches the circles.
        pointStyle: rows.map(r => r.model === 'binomial' ? 'rectRot' : 'circle'),
        pointRadius: rows.map(r => r.model === 'binomial' ? 6 : 5), order: 1
    };
    return {
        type: 'scatter',
        data: { datasets: [...rangeDatasets, meanDataset] },
        options: {
            indexAxis: 'y',
            responsive: !opts.static, maintainAspectRatio: false,
            animation: opts.static ? false : undefined,
            devicePixelRatio: opts.static ? 2 : undefined,
            scales: {
                x: { type: 'logarithmic', min: range.xMin, max: range.xMax, title: { display: true, text: 'Occurrence Rate', color: '#000000', font },
                     ticks: { autoSkip: false, maxRotation: 0, callback: (value) => formatMajorLogTick(value), color: '#000000', font }, grid: { color: 'rgba(0,0,0,0.1)' } }, // minor log ticks are unlabeled, so auto-skip would only drop decade labels
                // A linear axis auto-generates "nice" ticks (default maxTicksLimit 11), which with
                // many rows labeled only every Nth item. Force exactly one tick per row instead
                // (stepSize:1 can't be used -- with the +/-0.5 bounds it lands ticks on half-integers).
                y: { afterBuildTicks: (axis) => { axis.ticks = rows.map((_, i) => ({ value: i })); },
                     ticks: { autoSkip: false, font,
                              callback: (val) => rows[val] ? wrapHierarchyLabelForChart(rows[val].label) : '',
                              color: (ctx) => (rows[ctx.tick.value] && rows[ctx.tick.value].color) || '#374151' },
                     min: -0.5, max: rows.length - 0.5, grid: { color: 'rgba(0,0,0,0.1)' } }
            },
            plugins: {
                tooltip: {
                    enabled: !opts.static,
                    filter: (item) => !item.dataset._isRange,
                    callbacks: {
                        label: (item) => {
                            const r = rows[item.parsed.y];
                            if (!r) return '';
                            return `${r.label}: mean=${formatValue(r.posterior.mean)}, 5th=${formatValue(r.posterior.p05)}, 95th=${formatValue(r.posterior.p95)}`;
                        }
                    }
                },
                legend: { display: false }
            }
        },
        plugins: opts.static ? [{
            id: 'whiteBackground',
            beforeDraw: (chart) => { const c = chart.ctx; c.save(); c.fillStyle = '#ffffff'; c.fillRect(0, 0, chart.width, chart.height); c.restore(); }
        }] : []
    };
}

// Renders the occurrence-rate plot for the Report as one or more PNG images, splitting into
// pages of rowsPerImage rows (top-down order preserved) so each figure fits a portrait page with
// readable labels. All parts share one x range so they can be compared directly.
// Returns [{ dataUrl, width, height }] in CSS pixels (image data is 2x for sharpness).
function renderVisualizeChartImages(rows, rowsPerImage, plotRange) {
    if (!window.Chart || !rows || rows.length === 0) return [];
    rowsPerImage = rowsPerImage || 25;
    const range = plotRange || visualizeXRange(rows);
    const topDown = rows.slice().reverse();
    const width = 1000, rowPx = 36, axisPx = 70;
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-20000px;top:0;visibility:hidden;';
    document.body.appendChild(host);
    const images = [];
    try {
        for (let start = 0; start < topDown.length; start += rowsPerImage) {
            const chunk = topDown.slice(start, start + rowsPerImage).reverse();
            const height = chunk.length * rowPx + axisPx;
            const canvas = document.createElement('canvas');
            canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            canvas.width = width; canvas.height = height;
            host.appendChild(canvas);
            const chart = new window.Chart(canvas.getContext('2d'),
                buildOccurrenceRateChartConfig(chunk, { xMin: range.xMin, xMax: range.xMax, fontSize: 14, static: true }));
            images.push({ dataUrl: chart.toBase64Image('image/png', 1), width, height });
            chart.destroy();
            host.removeChild(canvas);
        }
    } finally {
        document.body.removeChild(host);
    }
    return images;
}

function VisualizeModal({ fsceors, hierarchy, plotRange, onClose }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);
    const [filterText, setFilterText] = useState('');
    const [hierarchyFilter, setHierarchyFilter] = useState({ facilityId: NA, systemId: NA, componentId: NA, failureModeLevelId: NA });
    const [unitsFilter, setUnitsFilter] = useState('all');

    // Picking a level clears any already-chosen descendant levels, since they were only valid
    // relative to the old parent selection (matches HierarchySelector's assignment behavior).
    const handleFilterLevelChange = (level, id) => {
        setHierarchyFilter(prev => {
            const next = { ...prev, [level + 'Id']: id };
            const idx = HIERARCHY_LEVELS.indexOf(level);
            HIERARCHY_LEVELS.slice(idx + 1).forEach(l => { next[l + 'Id'] = NA; });
            return next;
        });
    };

    const rows = useMemo(() => {
        const withData = buildVisualizeRows((fsceors || [])
            .filter(f => HIERARCHY_LEVELS.every(level => {
                const want = hierarchyFilter[level + 'Id'];
                return (!want || want === NA) ? true : (f.hierarchy || {})[level + 'Id'] === want;
            }))
            .filter(f => unitsFilter === 'all' || f.units === unitsFilter), hierarchy);
        return filterText.trim() ? withData.filter(r => r.label.toLowerCase().includes(filterText.toLowerCase())) : withData;
    }, [fsceors, hierarchy, filterText, hierarchyFilter, unitsFilter]);

    useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        const ctx = canvasRef.current.getContext('2d');
        // One thin horizontal line per row (colored to match that row's hierarchy assignment)
        // spanning its 5th-95th percentile range, plus a mean dot per row. The dialog is always
        // opaque white, so axis text is fixed dark rather than theme-dependent; each y label is
        // colored to match its row. See buildOccurrenceRateChartConfig.
        chartRef.current = new window.Chart(ctx, buildOccurrenceRateChartConfig(rows, plotRange));
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
    }, [rows, plotRange?.xMin, plotRange?.xMax]);

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl w-full m-4 max-h-[97vh] flex flex-col" style={{ maxWidth: '1200px', height: '97vh' }} onClick={e => e.stopPropagation()}>
                <div className="p-6 flex flex-col flex-1 overflow-hidden">
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold text-gray-800">Visualize Occurrence Rates</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <p className="text-xs text-gray-500 mb-2">The horizontal line for each event occurrence rate spans its posterior 5th-95th percentile range; the marker is the mean (&#9670; demand-based, &#9679; time-based).</p>
                    <input className="w-full px-3 py-2 border rounded text-sm mb-2" placeholder="Filter by facility/system/component/failure mode name..." value={filterText} onChange={e => setFilterText(e.target.value)} />
                    <div className="grid grid-cols-5 gap-2 mb-3">
                        {HIERARCHY_LEVELS.map(level => {
                            const pLevel = parentLevel(level);
                            const parentValue = pLevel ? (hierarchyFilter[pLevel + 'Id'] || NA) : null;
                            const options = optionsForAssignment(hierarchy, level, parentValue).slice().sort((a, b) => a.name.localeCompare(b.name));
                            return (
                                <div key={level}>
                                    <label className="block text-xs font-medium mb-1 text-gray-600">{HIERARCHY_LEVEL_LABELS[level]}</label>
                                    <select className="w-full px-2 py-1.5 border rounded text-sm"
                                            value={hierarchyFilter[level + 'Id'] || NA}
                                            onChange={e => handleFilterLevelChange(level, e.target.value)}>
                                        <option value={NA}>All</option>
                                        {options.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                                    </select>
                                </div>
                            );
                        })}
                        <div>
                            <label className="block text-xs font-medium mb-1 text-gray-600">Units</label>
                            <select className="w-full px-2 py-1.5 border rounded text-sm" value={unitsFilter} onChange={e => setUnitsFilter(e.target.value)}>
                                <option value="all">All</option>
                                {UNIT_OPTIONS.map(u => <option key={u.value} value={u.value}>{u.label}</option>)}
                            </select>
                        </div>
                    </div>
                    {/* Bounded, scrollable viewport: the inner div is sized to comfortably fit every
                        row (taller per-row spacing now that labels can wrap to two lines), and
                        this outer one scrolls instead of clipping once that exceeds the space
                        actually available -- needed once there are 100+ Tracked Items, where the
                        full chart would otherwise be far taller than any dialog. */}
                    <div className="flex-1 overflow-y-auto min-h-0 border rounded">
                        <div style={{ height: Math.max(500, rows.length * 40) + 'px' }}>
                            <canvas ref={canvasRef}></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
}

/* ============================================================================
   VIEW CHANGES MODAL (QA: data integrity and verification status)
   ============================================================================ */
function exportDataIntegrityReport(fsceors, hierarchy, projectName, deletionLog) {
    const lines = ['Event Occurrence Rate ID,Hierarchy,Locked,Integrity OK,Verified,Verified By,Verified Date,Change Count,History'];
    (fsceors || []).forEach(f => {
        const integrity = verifyIntegrity(f);
        const label = hierarchyPathLabel(hierarchy, f.hierarchy || {});
        const history = buildItemHistory(f);
        const historyText = history.map(h => `${new Date(h.timestamp).toLocaleString()}: ${h.message}`).join(' | ').replace(/"/g, "'");
        lines.push([f.id, `"${label}"`, f.locked ? 'Yes' : 'No', integrity.ok ? 'Yes' : 'NO - DISCREPANCY', f.verification?.verified ? 'Yes' : 'No',
                    f.verification?.verifiedBy || '', f.verification?.verifiedDate || '', history.length, `"${historyText}"`].join(','));
    });
    if ((deletionLog || []).length > 0) {
        lines.push('');
        lines.push('Deleted Tracked Items');
        lines.push('Event Occurrence Rate ID,Hierarchy,Was Locked,Was Verified,Deleted At');
        deletionLog.forEach(d => {
            lines.push([d.id, `"${d.label}"`, d.wasLocked ? 'Yes' : 'No', d.wasVerified ? 'Yes' : 'No', d.deletedAt].join(','));
        });
    }
    downloadBlob(lines.join('\n'), exportFileName(projectName, 'csv'), 'text/csv');
}

function ViewChangesModal({ projectName, fsceors, hierarchy, deletionLog, onClose }) {
    const [expandedId, setExpandedId] = useState(null);
    const [sortKey, setSortKey] = useState('label');
    const [sortDir, setSortDir] = useState('asc');
    const [colWidths, setColWidths] = useState({ label: 260, locked: 190, integrity: 130, verified: 220, history: 120 });
    const exportReport = () => exportDataIntegrityReport(fsceors, hierarchy, projectName, deletionLog);

    const startResize = (key, e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startWidth = colWidths[key];
        const onMove = (ev) => setColWidths(prev => ({ ...prev, [key]: Math.max(60, startWidth + (ev.clientX - startX)) }));
        const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    };
    const handleSort = (key) => {
        if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortKey(key); setSortDir('asc'); }
    };
    const SortHeader = ({ label, sortKeyName }) => (
        <th className="p-2 text-left border-b font-semibold cursor-pointer select-none hover:bg-gray-200 relative"
            style={{ width: colWidths[sortKeyName] }} onClick={() => handleSort(sortKeyName)}>
            {label} {sortKey === sortKeyName ? (sortDir === 'asc' ? '\u25B2' : '\u25BC') : ''}
            <span onMouseDown={e => { e.stopPropagation(); startResize(sortKeyName, e); }} onClick={e => e.stopPropagation()}
                  className="absolute top-0 right-0 h-full w-1.5 cursor-col-resize hover:bg-blue-400" />
        </th>
    );

    const rows = useMemo(() => {
        const withInfo = (fsceors || []).map(f => ({
            f,
            label: hierarchyPathLabel(hierarchy, f.hierarchy || {}),
            integrity: verifyIntegrity(f),
            history: buildItemHistory(f),
            lockedAt: lastLockedTimestamp(f)
        }));
        const sortVal = (r) => {
            switch (sortKey) {
                case 'locked': return r.f.locked ? 2 : (r.f.hasBeenLocked ? 1 : 0);
                case 'integrity': return r.integrity.ok ? 1 : 0;
                case 'verified': return r.f.verification?.verified ? (r.f.verification.verifiedDate || '') : '';
                case 'history': return r.history.length;
                default: return r.label.toLowerCase();
            }
        };
        withInfo.sort((a, b) => {
            const av = sortVal(a), bv = sortVal(b);
            const cmp = typeof av === 'number' ? av - bv : av.toString().localeCompare(bv.toString());
            return sortDir === 'asc' ? cmp : -cmp;
        });
        return withInfo;
    }, [fsceors, hierarchy, sortKey, sortDir]);

    return (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onClick={onClose}>
            <div className="bg-white rounded-lg shadow-xl w-full m-4 flex flex-col" style={{ maxWidth: '1400px', width: 'min(1400px, 96vw)', height: '92vh' }} onClick={e => e.stopPropagation()}>
                <div className="p-6 flex flex-col flex-1 min-h-0">
                    <div className="flex items-center justify-between mb-4 flex-shrink-0">
                        <h2 className="text-xl font-bold text-gray-800">Data Integrity &amp; Verification Status</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-xl leading-none">&times;</button>
                    </div>
                    <p className="text-xs text-gray-500 mb-3 flex-shrink-0">Click "Show" on any row to view the full, chronologically-ordered history of lock/unlock events and field-level changes for that event occurrence rate. Click a column header to sort, or drag its right edge to resize.</p>
                    <button onClick={exportReport} className="mb-3 px-3 py-1.5 bg-blue-600 text-white text-sm rounded hover:bg-blue-700 flex-shrink-0 self-start">Export as CSV</button>
                    <div className="flex-1 overflow-auto border rounded min-h-0">
                        <table className="text-sm border-collapse" style={{ tableLayout: 'fixed', width: '100%' }}>
                            <thead className="bg-gray-100 sticky top-0 z-10">
                                <tr>
                                    <SortHeader label="Event Occurrence Rate" sortKeyName="label" />
                                    <SortHeader label="Locked" sortKeyName="locked" />
                                    <SortHeader label="Integrity" sortKeyName="integrity" />
                                    <SortHeader label="Verified" sortKeyName="verified" />
                                    <SortHeader label="History" sortKeyName="history" />
                                </tr>
                            </thead>
                            <tbody>
                                {rows.map(({ f, label, integrity, history, lockedAt }) => {
                                    const isExpanded = expandedId === f.id;
                                    return (
                                        <React.Fragment key={f.id}>
                                            <tr className="border-b hover:bg-gray-50">
                                                <td className="p-2 truncate" title={label}>
                                                    <div className="font-medium truncate">{label}</div>
                                                </td>
                                                <td className="p-2">
                                                    {f.locked
                                                        ? <React.Fragment>Locked{lockedAt && <div className="text-xs text-gray-500 font-mono">{new Date(lockedAt).toLocaleString()}</div>}</React.Fragment>
                                                        : (f.hasBeenLocked ? 'Unlocked (was locked)' : 'Never locked')}
                                                </td>
                                                <td className="p-2">{integrity.ok ? <span className="text-green-600">OK</span> : <span className="text-red-600 font-bold">DISCREPANCY</span>}</td>
                                                <td className="p-2">{f.verification?.verified ? <span className="text-green-600">{f.verification.verifiedBy} ({new Date(f.verification.verifiedDate).toLocaleDateString()})</span> : <span className="text-gray-400">Not verified</span>}</td>
                                                <td className="p-2">
                                                    {history.length > 0 ? (
                                                        <button onClick={() => setExpandedId(isExpanded ? null : f.id)} className="text-blue-600 hover:underline text-xs font-medium">
                                                            {isExpanded ? '\u25B2 Hide' : '\u25BC Show'} ({history.length})
                                                        </button>
                                                    ) : <span className="text-gray-400 text-xs">None</span>}
                                                </td>
                                            </tr>
                                            {isExpanded && (
                                                <tr className="border-b bg-gray-50">
                                                    <td colSpan="5" className="p-3">
                                                        <div className="max-h-56 overflow-y-auto space-y-1">
                                                            {history.slice().reverse().map((h, i) => (
                                                                <div key={i} className={`text-xs ${h.kind === 'lock' ? 'text-gray-800 font-medium' : 'text-gray-600'}`}>
                                                                    <span className="text-gray-400 font-normal font-mono">{new Date(h.timestamp).toLocaleString()}</span> &mdash; {h.message}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    {(deletionLog || []).length > 0 && (
                        <div className="mt-4 flex-shrink-0" style={{ maxHeight: '30%' }}>
                            <h3 className="text-sm font-bold text-gray-800 mb-2">Deleted Tracked Items</h3>
                            <p className="text-xs text-gray-500 mb-2">Event occurrence rates that were deleted from this project. The item itself no longer exists, so only what was recorded at the time of deletion is shown.</p>
                            <div className="overflow-auto border rounded" style={{ maxHeight: '200px' }}>
                                <table className="w-full text-sm border-collapse">
                                    <thead className="bg-gray-100 sticky top-0">
                                        <tr>
                                            <th className="p-2 text-left border-b">Event Occurrence Rate</th>
                                            <th className="p-2 text-left border-b">Was Locked</th>
                                            <th className="p-2 text-left border-b">Was Verified</th>
                                            <th className="p-2 text-left border-b">Deleted</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {deletionLog.slice().reverse().map((d, i) => (
                                            <tr key={d.id || i} className="border-b hover:bg-gray-50">
                                                <td className="p-2">
                                                    <div className="font-medium">{d.label}</div>
                                                    {d.description && <div className="text-xs text-gray-500">{d.description}</div>}
                                                </td>
                                                <td className="p-2">{d.wasLocked ? 'Locked' : 'Not locked'}</td>
                                                <td className="p-2">{d.wasVerified ? <span className="text-green-600">Verified</span> : <span className="text-gray-400">Not verified</span>}</td>
                                                <td className="p-2 text-xs font-mono">{new Date(d.deletedAt).toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
